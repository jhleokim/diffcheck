 관한 분쟁은 계약당사자가 쌍방의 합의에 의하여 해결한다. ② 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결방법으로 다음 각 호의 어느 하나 중 도급인과 수급인 간 합의로 정한다. 1. 분쟁의 자율적 해결을 중시할 경우, 「건설산업기본법」에 따른 건설분쟁조 정위원회의 조정 2. 분쟁의 원활한 해결을 중시할 경우, 「중재법」에 따른 중재기관의 중재 <②항 적용 예시> · (예시1) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「건설산 업기본법」에 따른 건설분쟁조정위원회에 조정을 신청한다. · (예시2) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「중재 법」에 따른 중재기관에 중재를 신청한다. ③ 제2항에 따라 건설분쟁조정위원회에 조정이 신청된 경우, 상대방은 그 조정 절차에 응하여야 한다."}, {"uid": "a43", "label": "제43조", "title": "특약사항", "text": "기타 이 계약에서 정하지 아니한 사항에 대하여는 \"도급인\"과 \"수급인\"이 합의하여 별도의 특약을 정할 수 있다."}]}, {"id": "v3", "label": "최종 합의본", "short": "최종", "date": "2026-03-10", "actor": "합의", "articles": [{"uid": "a1", "label": "제1조", "title": "총칙", "text": "\"도급인\"과 \"수급인\"은 대등한 입장에서 서로 협력하여 신의에 따라 성실히 계약을 이행한다."}, {"uid": "a2", "label": "제2조", "title": "정의", "text": "이 조건에서 사용하는 용어의 정의는 다음과 같다 1. \"도급인\"이라 함은 건설공사를 건설업자에게 도급하는 자를 말한다. 2. \"도급\"이라 함은 당사자 일방이 건설공사를 완성할 것으로 약정하고, 상대 방이 그 일의 결과에 대하여 대가를 지급할 것을 약정하는 계약을 말한다. 3. \"수급인\"이라 함은 \"도급인\"으로부터 건설공사를 도급받는 건설업자를 말한다. 4. \"하도급\"이라 함은 도급받은 건설공사의 전부 또는 일부를 다시 도급하기 위하여 \"수급인\"이 제3자와 체결하는 계약을 말한다. 5. \"하수급인\"이라 함은 \"수급인\"으로부터 건설공사를 하도급받은 자를 말한다. 6. \"설계서\"라 함은 공사시방서, 설계도면(물량내역서를 작성한 경우 이를 포함 한다) 및 현장설명서를 말한다. 7. \"물량내역서\"라 함은 공종별 목적물을 구성하는 품목 또는 비목과 동 품목 또는 비목의 규격ㆍ수량ㆍ단위 등이 표시된 내역서를 말한다. 8. \"산출내역서\"라 함은 물량내역서에 \"수급인\"이 단가를 기재하여 \"도급인\"에 게 제출한 내역서를 말한다"}, {"uid": "a3", "label": "제3조", "title": "계약문서", "text": "① 계약문서는 민간건설공사 도급계약서, 민간건설공사 도급계 약 일반조건, 공사계약특수조건, 설계서 및 산출내역서로 구성되며, 상호 보완 의 효력을 가진다. ② 이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서 등은 계약문 서로서의 효력을 가진다. ③이 계약조건 외에 당사자 일방에게 현저하게 불공정한 경우로서 다음 각 호 의 어느 하나에 해당하는 특약은 그 부분에 한하여 무효로 한다. 1. 계약체결 이후 설계변경, 경제상황의 변동에 따라 발생하는 계약금액의 변경 을 상당한 이유 없이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특 약 2. 계약체결 이후 공사내용의 변경에 따른 계약기간의 변경을 상당한 이유 없 이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특약 3. 본 계약의 형태와 공사내용 등 제반사정에 비추어 계약체결 당시 예상하기 어려운 내용에 대하여 상대방에게 책임을 전가하는 특약 4. 계약내용에 대하여 구체적인 정함이 없거나 당사자 간 이견이 있을 경우 그 처리방법 등을 일방의 의사에 따르도록 함으로써 상대방의 정당한 이익을 침해 하는 특약 5. 계약불이행에 따른 당사자의 손해배상책임을 과도하게 경감하거나 가중하여 정함으로써 상대방의 정당한 이익을 침해하는 특약 6. 「민법」 등 관계 법령에서 인정하고 있는 상대방의 권리를 상당한 이유 없 이 배제하거나 제한하는 특약 ④ 계약문서 작성에 따른 인지세는 각 50%씩 수급인과 도급인이 부담한다. 다 만, 도급인과 공동수급체가 체결하는 공동계약의 경우는 공동 수급체의 구성원 간의 계약액의 지분율에 따라 부담한다."}, {"uid": "a4", "label": "제4조", "title": "계약보증금 등", "text": "① \"수급인\"은 계약상의 의무이행을 보증하기 위해 계약서 에서 정한 계약보증금을 계약체결전까지 \"도급인\"에게 현금 등으로 납부하여야 한다. 다만, \"도급인\"과 \"수급인\"이 합의에 의하여 계약보증금을 납부하지 아니 하기로 약정한 경우에는 그러하지 아니하다. ② 제1항의 계약보증금은 다음 각 호의 기관이 발행한 보증서로 납부할 수 있다. 1. 건설산업기본법 제54조 제1항의 규정에 의한 각 공제조합 발행 보증서 2. 보증보험회사, 신용보증기금 등 이와 동등한 기관이 발행하는 보증서 3. 금융기관의 지급보증서 또는 예금증서 4. 국채 또는 지방채 ③ \"수급인\"은 제21조부터 제23조의 규정에 의하여 계약금액이 증액된 경우에 는 이에 상응하는 금액의 보증금을 제1항 및 제2항의 규정에 따라 추가 납부하 여야 하며, 계약금액이 감액된 경우에는 \"도급인\"은 이에 상응하는 금액의 계약 보증금을 \"수급인\"에게 반환하여야 한다. ④ 제1항 또는 제3항에 따라 \"수급인\"이 계약의 이행을 보증하는 때에는 \"도급 인\"도 수급인에게 공사대금 지급의 보증 또는 담보를 제공하여야 한다. 다만, \" 도급인\"이 공사대금 지급보증 또는 담보 제공을 하기 곤란한 경우에는 \"수급인\" 이 그에 상응하는 보험 또는 공제에 가입할 수 있도록 계약의 이행 보증을 받 은 날부터 30일 이내에 보험료 또는 공제료(이하 \"보험료등\"이라 한다)를 지급 하여야 한다. ⑤ \"도급인\"이 제4항에 따른 공사대금의 지급보증, 담보의 제공 또는 보험료등 의 지급을 하지 아니한 때에는 \"수급인\"은 15일 이내 \"도급인\"에게 그 이행을 최고하고 공사의 시공을 중지할 수 있다."}, {"uid": "a5", "label": "제5조", "title": "계약보증금의 처리", "text": "① 제34조제1항 각 호의 사유로 계약이 해제 또는 해 지된 경우 제4조의 규정에 의하여 납부된 계약보증금은 \"도급인\"에게 귀속한다. 이 경우 계약의 해제 또는 해지에 따른 손해배상액이 계약보증금을 초과한 경 우에는 그 초과분에 대한 손해배상을 청구할 수 있다. ② \"도급인\"은 제35조제1항 각 호의 사유로 계약이 해제 또는 해지되거나 계약 의 이행이 완료된 때에는 제4조의 규정에 의하여 납부된 계약보증금을 지체없 이 \"수급인\"에게 반환하여야 한다."}, {"uid": "a6", "label": "제6조", "title": "공사감독원", "text": "① \"도급인\"은 계약의 적정한 이행을 확보하기 위하여 스스로 이를 감독하거나 자신을 대리하여 다음 각 호의 사항을 행하는 자(이하 ‘공사 감독원’이라 한다)를 선임할 수 있다. 1. 시공일반에 대하여 감독하고 입회하는 일 2. 계약이행에 있어서 \"수급인\"에 대한 지시ㆍ승낙 또는 협의하는 일 3. 공사의 재료와 시공에 대한 검사 또는 시험에 입회하는 일 4. 공사의 기성부분 검사, 준공검사 또는 공사목적물의 인도에 입회하는 일 5. 기타 공사감독에 관하여 \"도급인\"이 위임하는 일 ② \"도급인\"은 제1항의 규정에 의하여 공사감독원을 선임한 때에는 그 사실을 즉시 \"수급인\"에게 통지하여야 한다. ③ \"수급인\"은 공사감독원의 감독 또는 지시사항이 공사수행에 현저히 부당하 다고 인정할 때에는 \"도급인\"에게 그 사유를 명시하여 필요한 조치를 요구할 수 있다."}, {"uid": "a7", "label": "제7조", "title": "현장대리인의 배치", "text": "① \"수급인\"은 착공전에 건설산업기본법령에서 정한 바에 따라 당해공사의 주된 공종에 상응하는 건설기술자를 현장에 배치하고, 그중 1인을 현장대리인으로 선임한 후 \"도급인\"에게 통지하여야 한다. ② 제1항의 현장대리인은 법령의 규정 또는 \"도급인\"이 동의한 경우를 제외하고 는 현장에 상주하여 시공에 관한 일체의 사항에 대하여 \"수급인\"을 대리하며, 도급받은 공사의 시공관리 기타 기술상의 관리를 담당한다."}, {"uid": "a8", "label": "제8조", "title": "공사현장 근로자", "text": "① \"수급인\"은 해당 공사의 시공 또는 관리에 필요한 기 술과 인력을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 사용자로 서의 모든 책임을 진다. ② \"수급인\"이 채용한 근로자에 대하여 \"도급인\"이 해당 계약의 시공 또는 관리 상 현저히 부적당하다고 인정하여 교체를 요구한 때에는 정당한 사유가 없는 한 즉시 교체하여야 한다. ③ \"수급인\"은 제2항에 의하여 교체된 근로자를 \"도급인\"의 동의 없이 해당 공 사를 위해 다시 채용할 수 없다."}, {"uid": "a9", "label": "제9조", "title": "착공신고 및 공정보고", "text": "① \"수급인\"은 계약서에서 정한 바에 따라 착공하 여야 하며, 착공 시에는 다음 각 호의 서류가 포함된 착공신고서를 \"도급인\"에 게 제출하여야 한다. 1. 건설산업기본법령에 의하여 배치하는 건설기술자 지정서 2. 공사예정공정표 3. 공사비 산출내역서 (단, 계약체결시 산출내역서를 제출하고 계약금액을 정 한 경우를 제외한다) 4. 공정별 인력 및 장비 투입 계획서 5. 기타 \"도급인\"이 지정한 사항 ② \"수급인\"은 계약의 이행중에 제1항의 규정에 의하여 제출한 서류의 변경이 필요한 때에는 관련서류를 변경하여 제출하여야 한다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 제출된 서류의 내용을 조정할 필요가 있다고 인정하는 때에는 \"수급인\"에게 이의 조정을 요구할 수 있다. ④ \"도급인\"은 \"수급인\"이 월별로 수행한 공사에 대하여 다음 각 호의 사항을 명백히 하여 익월 14일까지 제출하도록 요청할 수 있으며, \"수급인\"은 이에 응 하여야 한다. 1. 월별 공정률 및 수행공사금액 2. 인력ㆍ장비 및 자재현황 3. 계약사항의 변경 및 계약금액의 조정내용"}, {"uid": "a10", "label": "제10조", "title": "공사기간", "text": "① 공사착공일과 준공일은 계약서에 명시된 일자로 한다. ② \"수급인\"의 귀책사유 없이 공사착공일에 착공할 수 없는 경우에는 \"수급인\" 의 현장인수일자를 착공일로 하며, 이 경우 \"수급인\"은 공사기간의 연장을 요구 할 수 있다. ③ 준공일은 \"수급인\"이 건설공사를 완성하고 \"도급인\"에게 서면으로 준공검사 를 요청한 날을 말한다. 다만, 제27조의 규정에 의하여 준공검사에 합격한 경우 에 한 한다."}, {"uid": "n_price", "label": "제10조의2", "title": "물가변동 특례", "text": "① \"도급인\"과 \"수급인\"은 착공 이후 발생하는 물가변동에 대하여는 계약금액을 조정하지 아니함을 원칙으로 한다. ② 제1항에도 불구하고 한국건설기술연구원이 공표하는 건설공사비지수의 누적변동률이 계약체결일 대비 100분의 12를 초과하는 경우에는 그 초과분에 한하여 조정할 수 있다."}, {"uid": "a11", "label": "제11조", "title": "선금", "text": "① \"도급인\"은 계약서에서 정한 바에 따라 \"수급인\"에게 선금을 지 급하여야 하며, \"도급인\"이 선금 지급시 보증서 제출을 요구하는 경우 \"수급인\" 은 제4조 제2항 각 호의 보증기관이 발행한 보증서를 제출하여야 한다. ② 제1항에 의한 선금지급은 \"수급인\"의 청구를 받은 날부터 14일이내에 지급 하여야 한다. 다만, 자금사정등 불가피한 사유로 인하여 지급이 불가능한 경우 그 사유 및 지급시기를 \"수급인\"에게 서면으로 통지한 때에는 그러하지 아니하 다. ③ \"수급인\"은 선금을 계약목적달성을 위한 용도이외의 타 목적에 사용할 수 없으며, 노임지급 및 자재확보에 우선 사용하여야 한다. ④ 선금은 기성부분에 대한 대가를 지급할 때마다 다음 방식에 의하여 산출한 금액을 정산한다. 기성부분의 대가 선금정산액＝선금액×  계약금액 ⑤ \"도급인\"은 선금을 지급한 경우 다음 각 호의 1에 해당하는 경우에는 당해 선금잔액에 대하여 반환을 청구할 수 있다. 1. 계약을 해제 또는 해지하는 경우 2. 선금지급조건을 위반한 경우 ⑥ \"도급인\"은 제5항의 규정에 의한 반환청구시 기성부분에 대한 미지급금액이 있는 경우에는 선금잔액을 그 미지급금액에 우선적으로 충당하여야 한다."}, {"uid": "a12", "label": "제12조", "title": "자재의 검사 등", "text": "① 공사에 사용할 재료는 신품이어야 하며, 품질ㆍ품명 등은 설계도서와 일치하여야 한다. 다만, 설계도서에 품질ㆍ품명 등이 명확히 규정되지 아니한 것은 표준품 또는 표준품에 상당하는 재료로서 계약의 목적을 달성하는데 가장 적합한 것이어야 한다. ② 공사에 사용할 자재중에서 \"도급인\"이 품목을 지정하여 검사를 요구하는 경 우에는 \"수급인\"은 사용전에 \"도급인\"의 검사를 받아야 하며, 설계도서와 상이 하거나 품질이 현저히 저하되어 불합격된 자재는 즉시 대체하여 다시 검사를 받아야 한다. ③ 제2항의 검사에 이의가 있을 경우 \"수급인\"은 \"도급인\"에게 재검사를 요구할 수 있으며, 재검사가 필요하다고 인정되는 경우 \"도급인\"은 지체없이 재검사하 도록 조치하여야 한다. ④ \"수급인\"은 자재의 검사에 소요되는 비용을 부담하여야 하며, 검사 또는 재 검사 등을 이유로 계약기간의 연장을 요구할 수 없다. 다만, 제3항의 규정에 의 하여 재검사 결과 적합한 자재인 것으로 판명될 경우에는 재검사에 소요된 기 간에 대하여는 계약기간을 연장할 수 있다. ⑤ 공사에 사용하는 자재중 조립 또는 시험을 요하는 것은 \"도급인\"의 입회하 에 그 조립 또는 시험을 하여야 한다. ⑥ 수중 또는 지하에서 행하여지는 공사나 준공후 외부에서 확인할 수 없는 공 사는 \"도급인\"의 참여없이 시행할 수 없다. 다만, 사전에 \"도급인\"의 서면승인을 받고 사진, 비디오 등으로 시공방법을 확인할 수 있는 경우에는 시행할 수 있 다. ⑦ \"수급인\"은 공사수행과 관련하여 필요한 경우 \"도급인\"에게 입회를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다."}, {"uid": "a13", "label": "제13조", "title": "지급자재와 대여품", "text": "① 계약에 의하여 \"도급인\"이 지급하는 자재와 대여 품은 공사예정공정표에 의한 공사일정에 지장이 없도록 적기에 인도되어야 하 며, 그 인도장소는 시방서 등에 따로 정한 바가 없으면 공사현장으로 한다. ② 제1항의 규정에 의하여 지급된 자재의 소유권은 \"도급인\"에게 있으며, \"수급 인\"은 \"도급인\"의 서면승낙없이 현장 외부로 반출하여서는 아니된다. ③ 제1항의 규정에 의하여 인도된 지급자재와 대여품에 대한 관리상의 책임은 \"수급인\"에게 있으며, \"수급인\"이 이를 멸실 또는 훼손하였을 경우에는 \"도급인\" 에게 변상하여야 한다. ④ \"수급인\"은 지급자재 및 대여품의 품질 또는 규격이 시공에 적당하지 아니 하다고 인정할 때에는 즉시 \"도급인\"에게 이를 통지하고 그 대체를 요구할 수 있다. ⑤ 자재 등의 지급지연으로 공사가 지연될 우려가 있을 때에는 \"수급인\"은 \"도 급인\"의 서면승낙을 얻어 자기가 보유한 자재를 대체 사용할 수 있다. 이 경 우 \"도급인\"은 대체 사용한 자재 등을 \"수급인\"과 합의된 일시 및 장소에서 현 품으로 반환하거나 대체사용당시의 가격을 지체없이 \"수급인\"에게 지급하여야 한다. ⑥ \"수급인\"은 \"도급인\"이 지급한 자재와 기계ㆍ기구 등 대여품을 선량한 관리 자의 주의로 관리하여야 하며, 계약의 목적을 수행하는 데에만 사용하여야 한 다. ⑦ \"수급인\"은 공사내용의 변경으로 인하여 필요없게 된 지급자재 또는 사용완 료된 대여품을 지체없이 \"도급인\"에게 반환하여야 한다."}, {"uid": "a14", "label": "제14조", "title": "안전관리 및 재해보상", "text": "① \"수급인\"은 산업재해를 예방하기 위하여 안전 시설의 설치 및 보험의 가입 등 적정한 조치를 하여야 하며, 이를 위해 \"도급 인\"은 계약금액에 「건설기술진흥법」에 따른 안전관리비와 「산업안전보건 법」에 따른 산업안전보건관리비 및 산업재해보상 보험료 등 관계 법령에서 규 정하는 법정경비의 상당액을 계상하여야 한다. ② 공사현장에서 발생한 산업재해에 대한 책임은 \"수급인\"에게 있다. 다만, 설 계상의 하자 또는 \"도급인\"의 요구에 의한 작업으로 재해가 발생한 경우에는 \" 도급인\"에 대하여 구상권을 행사할 수 있다."}, {"uid": "a15", "label": "제15조", "title": "건설근로자의 보호", "text": "① \"수급인\"은 도급받은 공사가 건설산업기본법, 임 금채권보장법, 고용보험법, 국민연금법, 국민건강보험법 및 노인장기요양보험법 에 의하여 의무가입대상인 경우에는 퇴직공제, 임금채권보장제도, 고용보험, 국 민연금, 건강보험 및 노인장기요양보험에 가입하여야 한다. 다만, \"수급인\"이 도 급받은 공사를 하도급한 경우로서 하수급인이 고용한 근로자에 대하여 고용보 험, 국민연금, 건강보험 및 노인장기요양보험에 가입한 경우에는 그러하지 아니 하다. ② \"도급인\"은 제1항의 건설근로자퇴직공제부금, 임금채권보장제도에 따른 사업 주부담금, 고용보험료, 국민연금보험료, 국민건강보험료 및 노인장기요양보험료 를 계약금액에 계상하여야 한다."}, {"uid": "a16", "label": "제16조", "title": "응급조치", "text": "① \"수급인\"은 재해방지를 위하여 특히 필요하다고 인정될 때 에는 미리 긴급조치를 취하고 즉시 이를 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 재해방지 기타 공사의 시공상 부득이하다고 인정할 때에는 \"수 급인\"에게 긴급조치를 요구할 수 있다. 이 경우 \"수급인\"은 즉시 이에 응하여야 하며, \"수급인\"이 \"도급인\"의 요구에 응하지 않는 경우 \"도급인\"은 제3자로 하여 금 필요한 조치를 하게 할 수 있다. ③ 제1항 및 제2항의 응급조치에 소요된 경비는 실비를 기준으로 \"도급인\"과 \" 수급인\"이 협의하여 부담한다."}, {"uid": "a17", "label": "제17조", "title": "공사기간의 연장", "text": "① \"수급인\" 은 다음 각 호의 사유로 인해 계약이행이 현저히 어려운 경우 등 \"수급인\" 의 책임이 아닌 사유로 공사수행이 지연되는 경우 서면으로 공사기간의 연장을 \"도급인\" 에게 요구할 수 있다. 1. \"도급인\" 의 책임있는 사유 2. 태풍ㆍ홍수ㆍ폭염ㆍ한파ㆍ악천후ㆍ미세먼지 발현ㆍ전쟁ㆍ사변ㆍ지진ㆍ전염병 ㆍ폭동 등 불가항력의 사태(이하 \"불가항력\"이라고 한다.) 3. 원자재 수급불균형 4. 근로시간단축 등 법령의 제ㆍ개정 ② \"도급인\"은 제1항의 규정에 의한 계약기간 연장의 요구가 있는 경우 즉시 그 사실을 조사ㆍ확인하고 공사가 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다. ③ 제1항의 규정에 의거 공사기간이 연장되는 경우 이에 따르는 현장관리비 등 추가경비는 제23조의 규정을 적용하여 조정한다. ④ \"도급인\"은 제1항의 계약기간의 연장을 승인하였을 경우 동 연장기간에 대 하여는 지체상금을 부과하여서는 아니된다."}, {"uid": "a18", "label": "제18조", "title": "부적합한 공사 등", "text": "① \"도급인\"은 \"수급인\"이 시공한 공사중 설계서에 적합 하지 아니한 부분이 있을 때에는 이의 시정을 요구할 수 있으며, \"수급인\"은 지 체없이 이에 응하여야 한다. 이 경우 \"수급인\"은 계약금액의 증액 또는 공기의 연장을 요청할 수 없다. ② 제1항의 경우 설계서에 적합하지 아니한 공사가 \"도급인\"의 요구 또는 지시 에 의하거나 기타 \"수급인\"의 책임으로 돌릴 수 없는 사유로 인한 때에는 \"수 급인\"은 그 책임을 지지 아니한다."}, {"uid": "a19", "label": "제19조", "title": "불가항력에 의한 손해", "text": "① \"수급인\"은 검사를 마친 기성부분 또는 지급자 재와 대여품에 대하여 불가항력에 의한 손해가 발생한 때에는 즉시 그 사실을 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 제1항의 통지를 받은 경우 즉시 그 사실을 조사ㆍ확인하고 그 손해의 부담에 있어서 기성검사를 필한 부분 및 검사를 필하지 아니한 부분 중 객관적인 자료(감독일지, 사진 또는 비디오테잎 등)에 의하여 이미 수행되었음 이 판명된 부분은 \"도급인\"이 부담하고, 기타 부분은 \"도급인\"과 \"수급인\"이 협 의하여 결정한다. ③ 제2항의 협의가 성립되지 않은 때에는 제41조의 규정에 의한다."}, {"uid": "a20", "label": "제20조", "title": "공사의 변경ㆍ중지", "text": "① \"도급인\"이 설계변경 등에 의하여 공사내용을 변 경ㆍ추가하거나 공사의 전부 또는 일부에 대한 시공을 일시 중지할 경우에는 변경계약서 등을 사전에 \"수급인\"에게 교부하여야 한다. ② \"도급인\"이 제1항에 따른 공사내용의 변경ㆍ추가 관련 서류를 교부하지 아 니한 때에는 \"수급인\"은 \"도급인\"에게 도급받은 공사 내용의 변경ㆍ추가에 관한 사항을 서면으로 통지하여 확인을 요청할 수 있다. 이 경우 \"수급인\"의 요청에 대하여 \"도급인\"은 15일 이내에 그 내용에 대한 인정 또는 부인의 의사를 서면 으로 회신하여야 하며, 이 기간내에 회신하지 아니한 경우에는 원래 \"수급인\"이 통지한 내용대로 공사내용의 변경ㆍ추가된 것으로 본다. 다만, 불가항력으로 인 하여 회신이 불가능한 경우에는 제외한다. ③ \"도급인\"의 지시에 의하여 \"수급인\"이 추가로 시공한 공사물량에 대하여서는 공사비를 증액하여 지급하여야 한다. ④ \"수급인\"은 동 계약서에 규정된 계약금액의 조정사유 이외의 계약체결 후 계약조건의 미숙지, 덤핑수주 등을 이유로 계약금액의 변경을 요구하거나 시공 을 거부할 수 없다."}, {"uid": "a21", "label": "제21조", "title": "설계변경으로 인한 계약금액의 조정", "text": "① 설계서의 내용이 공사현장의 상 태와 일치하지 않거나 불분명, 누락, 오류가 있을 때 또는 시공에 관하여 예기 하지 못한 상태가 발생되거나 안전사고의 우려, 사업계획의 변경 등으로 인하 여 추가 시설물(가설구조물을 포함)의 설치가 필요한 때에는 \"도급인\"은 설계를 변경하여야 한다. ② 제1항의 설계변경으로 인하여 공사량의 증감이 발생한 때에는 다음 각 호의 기준에 의하여 계약금액을 조정하며, 필요한 경우 공사기간을 연장하거나 단축 한다. 1. 증감된 공사의 단가는 제9조의 규정에 의한 산출내역서상의 단가를 기준으 로 상호 협의하여 결정한다. 2. 산출내역서에 포함되어 있지 아니한 신규비목의 단가는 설계변경 당시를 기준으로 산정한 단가로 한다. 3. 증감된 공사에 대한 일반관리비 및 이윤 등은 산출내역서상의 율을 적용한다."}, {"uid": "a22", "label": "제22조", "title": "물가변동으로 인한 계약금액의 조정", "text": "① 계약체결 후 90일 이상 경과한 경우에 잔여공사에 대하여 산출내역서에 포함되어 있는 품목 또는 비목, 비목 군 및 지수 등의 변동으로 인한 등락액이 잔여공사에 해당하는 계약금액의 100 분의3 이상인 때에는 계약금액을 조정한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 곤란하다고 인정되는 경우에는 계약체결일(계약체결 후 계 약금액을 조정한 경우 그 조정사유가 발생한 날(이하 \"조정기준일\"이라 한다)을 말하며, 이하 같다)로부터 90일이내에도 계약금액을 조정할 수 있다. ② 제1항의 규정에 의하여 계약금액을 조정할 때에는 국가를 당사자로 하는 계 약에 관한 법률 시행규칙 제74조에 따라 산출된 품목조정률 또는 지수조정률을 활용한다. ③ 제1항의 규정에도 불구하고 해당공사비를 구성하는 재료비, 노무비, 경비 합 계액의 100분의 1을 초과하는 자재의 가격이 계약체결일로부터 100분의 15 이 상 증감된 경우에는 \"도급인\"과 \"수급인\"이 합의하여 계약금액을 조정할 수 있 다. ④ 제1항 및 제3항의 규정에 의한 계약금액의 조정에 있어서 그 조정금액은 계 약금액 중 조정기준일 이후에 이행되는 부분의 대가(이하 \"물가변동적용대가\" 라 한다)에 품목조정률 또는 지수조정률을 곱하여 산출하되, 조정기준일 이전 에 이미 계약이행이 완료되어야 할 부분에 대하여는 적용하지 아니한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 지연된 경우에는 그러하지 아니 하다. ⑤ 선금을 지급한 것이 있는 때에는 제1항, 제3항, 제4항의 규정에 의하여 산출 된 증가액에서 다음 산식으로 산출한 금액을 공제한다. 공제금액=물가변동적용대가×(품목조정률 또는 지수조정률)×선금급률 ⑥ 제1항의 규정에 의하여 조정된 계약금액은 직전의 물가변동으로 인하여 계 약금액 조정기준일부터 60일 이내에는 이를 다시 조정할 수 없다. ⑦ 수급인은 제1항 및 제3항의 규정에 의하여 계약금액 조정을 청구하는 경우 에는 계약금액조정내역서를 첨부하여야 하며, 도급인은 청구를 받은 날부터 30 일 이내에 계약금액을 조정하여야 한다. 다만, 도급인이 자금사정 등 불가피한 경우에는 수급인과 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 증 액할 수 있는 자금이 없는 때에"}, {"uid": "a23", "label": "제23조", "title": "주요 원자재 가격변동에 따른 계약금액의 연동", "text": "도급인과 수급인은 「대ㆍ중소기업 상생협력 촉진에 관한 법률」제21조에 따라 주요 원재료의 가격변동에 따른 계약금액 연동과 관련하여 중소벤처기업부에서 권장하는 표준약정서를 작성하여 첨부하여야 한다. 다만, 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니할 수 있다. 1. 도급인이 「중소기업기본법」제2조 제2항에 따른 소기업에 해당하는 경우 2. 계약기간이 90일 이내의 범위에서 관계 법령으로 정하는 기간 이내인 경우 3. 계약금액이 1억원 이하의 범위에서 관계 법령으로 정하는 금액 이하인 경우 4. 도급인과 수급인이 계약금액 연동을 하지 아니하기로 합의한 경우. 이 경우 도급인과 수급인은 그 취지와 사유를 도급계약서에 기재하여야 한다."}, {"uid": "a24", "label": "제24조", "title": "기타 계약내용의 변동으로 인한 계약금액의 조정", "text": "① 제21조부터 제22조 의2에 의한 경우 이외에 다음 각 호에 의해 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 계약금액을 조정하며, 이 경우 증감된 공사에 대한 일반관리비 및 이율 등은 산출내역서상의 율을 적용한다. 1. 계약내용의 변경 2. 불가항력에 따른 공사기간의 연장 3. 근로시간 단축, 근로자 사회보험료 적용범위 확대 등 공사비, 공사기간에 영향을 미치는 법령의 제ㆍ개정 ② 제1항과 관련하여 \"수급인\"은 제21조부터 제22조2에 규정된 계약금액 조정 사유 이외에 계약체결후 계약조건의 미숙지 등을 이유로 계약금액의 변경을 요 구하거나 시공을 거부할 수 없다."}, {"uid": "a25", "label": "제25조", "title": "기성부분금", "text": "① 계약서에 기성부분금에 관하여 명시한 때에는 \"수급인\"은 이에 따라 기성부분에 대한 검사를 요청할 수 있으며, 이때 \"도급인\"은 지체없 이 검사를 하고 그 결과를 \"수급인\"에게 통지하여야 하며, 14일이내에 통지가 없는 경우에는 검사에 합격한 것으로 본다. ② 기성부분은 제2조 제8호의 산출내역서의 단가에 의하여 산정한다. 다만, 산 출내역서가 없는 경우에는 공사진척율에 따라 \"도급인\"과 \"수급인\"이 합의하여 산정한다. ③ \"도급인\"은 검사완료일로부터 14일이내에 검사된 내용에 따라 기성부분금을 \"수급인\"에게 지급하여야 한다. ④ \"도급인\"이 제3항의 규정에 의한 기성부분금의 지급을 지연하는 경우에는 제28조제3항의 규정을 준용한다."}, {"uid": "a26", "label": "제26조", "title": "손해의 부담", "text": "\"도급인\"ㆍ\"수급인\" 쌍방의 책임 없는 사유로 공사의 목적 물이나 제3자에게 손해가 생긴 경우 다음 각 호의 자가 손해를 부담한다. 1. 목적물이 \"도급인\"에게 인도되기 전에 발생된 손해: \"수급인\" 2. 목적물이 \"도급인\"에게 인도된 후에 발생된 손해: \"도급인\" 3. 목적물에 대한 \"도급인\"의 인수지연 중 발생된 손해: \"도급인\" 4. 목적물 검사기간 중 발생된 손해: \"도급인\"ㆍ\"수급인\"이 협의하여 결정"}, {"uid": "a27", "label": "제27조", "title": "부분사용", "text": "① \"도급인\"은 공사목적물의 인도전이라 하더라도 \"수급인\"의 동의를 얻어 공사목적물의 전부 또는 일부를 사용할 수 있다. ② 제1항의 경우 \"도급인\"은 그 사용부분에 대하여 선량한 관리자의 주의 의무 를 다하여야 한다. ③ \"도급인\"은 제1항에 의한 사용으로 \"수급인\"에게 손해를 끼치거나 \"수급인\" 의 비용을 증가하게 한 때는 그 손해를 배상하거나 증가된 비용을 부담한다."}, {"uid": "a28", "label": "제28조", "title": "준공검사", "text": "① \"수급인\"은 공사를 완성한 때에는 \"도급인\"에게 통지하여야 하며 \"도급인\"은 통지를 받은 후 지체없이 \"수급인\"의 입회하에 검사를 하여야 하며, \"도급인\"이 \"수급인\"의 통지를 받은 후 10일 이내에 검사결과를 통지하지 아니한 경우에는 10일이 경과한 날에 검사에 합격한 것으로 본다. 다만, 불가항 력으로 인하여 검사를 완료하지 못한 경우에는 당해 사유가 존속되는 기간과 당해 사유가 소멸된 날로부터 3일까지는 이를 연장할 수 있다. ② \"수급인\"은 제1항의 검사에 합격하지 못한 때에는 지체없이 이를 보수 또는 개조하여 다시 준공검사를 받아야 한다. ③ \"수급인\"은 검사의 결과에 이의가 있을 때에는 재검사를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다. ④ \"도급인\"은 제1항의 규정에 의한 검사에 합격한 후 \"수급인\"이 공사목적물의 인수를 요청하면 인수증명서를 발급하고 공사목적물을 인수하여야 한다."}, {"uid": "a29", "label": "제29조", "title": "대금지급", "text": "① \"수급인\"은 \"도급인\"의 준공검사에 합격한 후 즉시 잉여자 재, 폐기물, 가설물 등을 철거, 반출하는 등 공사현장을 정리하고 공사대금의 지급을 \"도급인\"에게 청구할 수 있다. ② \"도급인\"은 특약이 없는 한 계약의 목적물을 인도 받음과 동시에 \"수급인\"에 게 공사 대금을 지급하여야 한다. ③ \"도급인\"이 공사대금을 지급기한내에 지급하지 못하는 경우에는 그 미지급 금액에 대하여 지급기한의 다음날부터 지급하는 날까지의 일수에 계약서 상에 서 정한 대가지급 지연이자율(시중은행의 일반대출시 적용되는 연체이자율 수 준을 감안 하여 상향 적용할 수 있다)을 적용하여 산출한 이자를 가산하여 지 급하여야 한다."}, {"uid": "a30", "label": "제30조", "title": "폐기물의 처리 등", "text": "\"수급인\"은 공사현장에서 발생한 폐기물을 관계법령에 의거 처리하여야 하며, \"도급인\"은 폐기물처리에 소요되는 비용을 계약금액에 반영하여야 한다."}, {"uid": "a31", "label": "제31조", "title": "지체상금", "text": "① \"수급인\"은 준공기한내에 공사를 완성하지 아니한 때에는 매 지체일수마다 계약서상의 지체상금율을 계약금액에 곱하여 산출한 금액(이 하 ‘지체상금’이라 한다)을 \"도급인\"에게 납부하여야 한다. 다만, \"도급인\"의 귀 책사유로 준공검사가 지체된 경우와 다음 각 호의 1에 해당하는 사유로 공사가 지체된 경우에는 그 해당일수에 상당하는 지체상금을 지급하지 아니하여도 된 다. 1. 불가항력의 사유에 의한 경우 2. \"수급인\"이 대체하여 사용할 수 없는 중요한 자재의 공급이 \"도급인\"의 책 임있는 사유로 인해 지연되어 공사진행이 불가능하게 된 경우 3. \"도급인\"의 귀책사유로 착공이 지연되거나 시공이 중단된 경우 4. 기타 \"수급인\"의 책임에 속하지 아니하는 사유로 공사가 지체된 경우 ② 제1항을 적용함에 있어 제26조의 규정에 의하여 \"도급인\"이 공사목적물의 전부 또는 일부를 사용한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우 \"도급인\"이 인허가기관으로부터 공사목적물의 전부 또는 일 부에 대하여 사용승인을 받은 경우에는 사용승인을 받은 공사목적물의 해당부 분은 사용한 것으로 본다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 산출된 지체상금은 제28조의 규정에 의하여 \"수급인\"에게 지급되는 공사대금과 상계할 수 있다. ④제1항의 지체상금율은 계약 당사자간에 별도로 정한 바가 없는 경우에는 국 가를 당사자로 하는 계약에 관한 법령 등에 따라 공공공사 계약체결시 적용되 는 지체상금율을 따른다."}, {"uid": "a32", "label": "제32조", "title": "하자담보", "text": "① \"수급인\"은 공사의 하자보수를 보증하기 위하여 계약서에 정한 하자보수보증금율을 계약금액에 곱하여 산출한 금액(이하 ‘하자보수보증 금’이라 한다)을 준공검사후 그 공사의 대가를 지급할 때까지 현금 또는 제4조 제2항 각 호의 보증기관이 발행한 보증서로서 \"도급인\"에게 납부하여야 한다. ② \"수급인\"은 \"도급인\"이 전체목적물을 인수한 날과 준공검사를 완료한 날 중 에서 먼저 도래한 날부터 계약서에 정한 하자담보 책임기간중 당해공사에 발 생하는 일체의 하자를 보수하여야 한다. 다만, 다음 각 호의 사유로 발생한 하자에 대해서는 그러하지 아니하다. 1. 공사목적물의 인도 후에 천재지변 등 불가항력이 \"수급인\"의 책임이 아닌 사유로 인한 경우 2. \"도급인\"이 제공한 재료의 품질이나 규격 등의 기준미달로 인한 경우 3. \"도급인\"의 지시에 따라 시공한 경우 4. \"도급인\"이 건설공사의 목적물을 관계 법령에 따른 내구연한 또는 설계상의 구조내력을 초과하여 사용한 경우 ③ \"수급인\"이 \"도급인\"으로 부터 제2항의 규정에 의한 하자보수의 요구를 받고 이에 응하지 아니하는 경우 제1항의 규정에 의한 하자보수보증금은 \"도급인\"에 게 귀속한다. ④ \"도급인\"은 하자담보책임기간이 종료한 때에는 제1항의 규정에 의한 하자보 수 보증금을 \"수급인\"의 청구에 의하여 반환하여야 한다. 다만, 하자담보책임기 간이 서로 다른 공종이 복합된 공사에 있어서는 공종별 하자담보 책임기간이 만료된 공종의 하자보수보증금은 \"수급인\"의 청구가 있는 경우 즉시 반환하여 야 한다."}, {"uid": "a33", "label": "제33조", "title": "건설공사의 하도급 등", "text": "①\"수급인\"이 도급받은 공사를 제3자에게 하도급 하고자 하는 경우에는 건설산업기본법 및 하도급거래공정화에관한법률에서 정 한 바에 따라 하도급하여야 하며, 하수급인의 선정, 하도급계약의 체결 및 이 행, 하도급 대가의 지급에 있어 관계 법령의 제규정을 준수하여야 한다. ② \"도급인\"은 건설공사의 시공에 있어 현저히 부적당하다고 인정하는 하수급 인이 있는 경우에는 하도급의 통보를 받은 날 또는 그 사유가 있음을 안 날부 터 30일이내에 서면으로 그 사유를 명시하여 하수급인의 변경 또는 하도급 계 약내용의 변경을 요구할 수 있다. 이 경우 \"수급인\"은 정당한 사유가 없는 한 이에 응하여야 한다. ③ \"도급인\"은 제2항의 규정에 의하여 건설공사의 시공에 있어 현저히 부적당 한 하수급인이 있는지 여부를 판단하기 위하여 하수급인의 시공능력, 하도급 계약 금액의 적정성 등을 심사할 수 있다."}, {"uid": "a34", "label": "제34조", "title": "하도급대금의 직접 지급", "text": "① \"도급인\"은 \"수급인\"이 제32조의 규정에 의 하여 체결한 하도급계약중 하도급거래공정화에 관한법률과 건설산업기본법에서 정한 바에 따라 하도급대금의 직접 지급사유가 발생하는 경우에는 그 법에 따 라 하수급인이 시공한 부분에 해당하는 하도급대금을 하수급인에게 지급한다. ② \"도급인\"이 제1항의 규정에 의하여 하도급대금을 직접 지급한 경우에는 \"도 급인\"의 \"수급인\"에 대한 대금지급채무는 하수급인에게 지급한 한도안에서 소 멸한 것으로 본다."}, {"uid": "a35", "label": "제35조", "title": "\"도급인\"의 계약해제 등", "text": "① \"도급인\"은 다음 각 호의 1에 해당하는 경우 에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. \"수급인\"이 정당한 이유없이 약정한 착공기일을 경과하고도 공사에 착수하 지 아니한 경우 2. \"수급인\"의 책임있는 사유로 인하여 준공기일내에 공사를 완성할 가능성이 없음이 명백한 경우 3. 제30조제1항의 규정에 의한 지체상금이 계약보증금 상당액에 도달한 경우 로서 계약기간을 연장하여도 공사를 완공할 가능성이 없다고 판단되는 경우 4. 기타 \"수급인\"의 계약조건 위반으로 인하여 계약의 목적을 달성할 수 없다 고 인정되는 경우 ② 제1항의 규정에 의한 계약의 해제 또는 해지는 \"도급인\"이 \"수급인\"에게 서 면으로 계약의 이행기한을 정하여 통보한 후 기한내에 이행되지 아니한 때 계 약의 해제 또는 해지를 \"수급인\"에게 통지함으로써 효력이 발생한다. ③ \"수급인\"은 제2항의 규정에 의한 계약의 해제 또는 해지 통지를 받은 때에 는 다음 각 호의 사항을 이행하여야 한다. 1. 당해 공사를 지체없이 중지하고 모든 공사용 시설ㆍ장비 등을 공사현장으 로부터 철거하여야 한다. 2. 제13조의 규정에 의한 지급재료의 잔여분과 대여품은 \"도급인\"에게 반환하 여야 한다."}, {"uid": "a36", "label": "제36조", "title": "\"수급인\"의 계약해제 등", "text": "① \"수급인\"은 다음 각 호의 어느 하나에 해당 하는 경우에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. 공사내용을 변경함으로써 계약금액이 100분의 40이상 감소된 때 2. \"도급인\"의 책임있는 사유에 의한 공사의 정지기간이 계약서상의 공사기간 의 100분의 50을 초과한 때 3. \"도급인\"이 정당한 이유없이 계약내용을 이행하지 아니함으로써 공사의 적 정이행이 불가능하다고 명백히 인정되는 때 4. 제4조제5항에 따른 기간 내에 공사대금 지급의 보증, 담보의 제공 또는 보 험료 등의 지급을 이행하지 아니한 때 ② 제1항의 규정에 의하여 계약을 해제 또는 해지하는 경우에는 제34조제2항 및 제3항의 규정을 준용한다."}, {"uid": "a37", "label": "제37조", "title": "계약해지시의 처리", "text": "① 제34조 및 제35조의 규정에 의하여 계약이 해지 된 때에는 \"도급인\"과 \"수급인\"은 지체없이 기성부분의 공사금액을 정산하여야 한다. ② 제34조 및 제35조의 규정에 의한 계약의 해제 또는 해지로 인하여 손해가 발생한 때에는 상대방에게 그에 대한 배상을 청구할 수 있다. 다만, 제35조제1 항제4호에 해당하여 해지한 경우에는 해지에 따라 발생한 손해에 대하여 청구 할 수 없다."}, {"uid": "a38", "label": "제38조", "title": "\"수급인\"의 동시이행 항변권", "text": "① \"도급인\"이 계약조건에 의한 선금과 기 성부분금의 지급을 지연할 경우 \"수급인\"이 상당한 기한을 정하여 그 지급을 독촉하였음에도 불구하고 \"도급인\"이 이를 지급치 않을 때에는 \"수급인\"은 공사 중지기간을 정하여 \"도급인\"에게 통보하고 공사의 일부 또는 전부를 일시 중지 할 수 있다. ② 제1항의 공사중지에 따른 기간은 지체상금 산정시 공사기간에서 제외된다. ③ \"도급인\"은 제1항의 공사중지에 따른 비용을 \"수급인\"에게 지급하여야 하며, 공사중지에 따라 발생하는 손해에 대해 \"수급인\"에게 청구하지 못한다."}, {"uid": "a39", "label": "제39조", "title": "채권양도", "text": "① \"수급인\"은 이 공사의 이행을 위한 목적이외에는 이 계약에 의하여 발생한 채권(공사대금 청구권)을 제3자에게 양도하지 못한다. ② \"수급인\"이 채권양도를 하고자 하는 경우에는 미리 보증기관(연대보증인이 있는 경우 연대보증인을 포함한다)의 동의를 얻어 \"도급인\"의 서면승인을 받아 야 한다. ③ \"도급인\"은 제2항의 규정에 의한 \"수급인\"의 채권양도 승인요청에 대하여 승 인 여부를 서면으로 \"수급인\"과 그 채권을 양수하고자 하는 자에게 통지하여야 한다."}, {"uid": "a40", "label": "제40조", "title": "손해배상책임", "text": "① \"수급인\"이 고의 또는 과실로 인하여 도급받은 건설공 사의 시공관리를 조잡하게 하여 타인에게 손해를 가한 때에는 그 손해를 배상 할 책임이 있다. ② \"수급인\"은 제1항의 규정에 의한 손해가 \"도급인\"의 고의 또는 과실에 의하 여 발생한 것인 때에는 \"도급인\"에 대하여 구상권을 행사할 수 있다. ③ \"수급인\"은 하수급인이 고의 또는 과실로 인하여 하도급 받은 공사를 조잡 하게 하여 타인에게 손해를 가한 때는 하수급인과 연대하여 그 손해를 배상할 책임이 있다."}, {"uid": "a41", "label": "제41조", "title": "법령의 준수", "text": "\"도급인\"과 \"수급인\"은 이 공사의 시공 및 계약의 이행에 있어서 건설산업기본법 등 관계법령의 제규정을 준수하여야 한다."}, {"uid": "a42", "label": "제42조", "title": "분쟁의 해결", "text": "① 계약에 별도로 규정된 것을 제외하고는 계약에서 발생 하는 문제에 관한 분쟁은 계약당사자가 쌍방의 합의에 의하여 해결한다. ② 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결방법으로 다음 각 호의 어느 하나 중 도급인과 수급인 간 합의로 정한다. 1. 분쟁의 자율적 해결을 중시할 경우, 「건설산업기본법」에 따른 건설분쟁조 정위원회의 조정 2. 분쟁의 원활한 해결을 중시할 경우, 「중재법」에 따른 중재기관의 중재 <②항 적용 예시> · (예시1) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「건설산 업기본법」에 따른 건설분쟁조정위원회에 조정을 신청한다. · (예시2) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「중재 법」에 따른 중재기관에 중재를 신청한다. ③ 제2항에 따라 건설분쟁조정위원회에 조정이 신청된 경우, 상대방은 그 조정 절차에 응하여야 한다."}, {"uid": "a43", "label": "제43조", "title": "특약사항", "text": "기타 이 계약에서 정하지 아니한 사항에 대하여는 \"도급인\"과 \"수급인\"이 합의하여 별도의 특약을 정할 수 있다."}, {"uid": "n_ld", "label": "제44조", "title": "품질미이행 손해배상 예정액", "text": "① \"수급인\"이 품질사양서에 정한 자재·공법을 이행하지 아니한 경우 \"도급인\"은 해당 부분 계약금액의 1000분의 5에 상당하는 금액을 손해배상 예정액으로 청구할 수 있다. ② 제1항의 청구는 채무불이행 및 하자담보책임과 별도로 행사할 수 있다."}]}]}, {"id": "sintak", "name": "신탁계약서 · 본문 ↔ 특약", "mode": "override", "source": "한국토지신탁 「토지신탁계약서(관리형)」 본문은 실물, 신탁특약은 합성", "versions": [{"id": "bon", "label": "신탁계약서 본문", "short": "본문", "date": "금감원 신고 약관", "actor": "표준약관", "articles": [{"uid": "b1", "label": "제1조", "title": "신탁목적", "text": "① 이 신탁계약에 따른 신탁은, 이 사업을 수행하기 위하여 위탁자는 신탁부 동산의 소유권을 수탁자에게 이전하고 위탁자의 책임으로 이 사업비를 조 달하여 이를 개발하고, 수탁자는 신탁부동산을 보존하고 관리하여 이 신탁 계약에서 정해진 바에 따라 신탁부동산을 분양 등의 방법으로 처분하거나 임대한 다음 그 처분대가나 임대료 등 신탁재산을 이 신탁계약에 정해진 바에 따라 지급하는 것을 목적으로 한다. ② 제1항의 목적을 달성하기 위하여 수탁자는 신탁재산의 범위 내에서 이 사 업주체로서의 권리와 의무를 부담하되 이 사업에 관한 모든 자금조달의무 를 부담하지 않고, 이 사업과 관련하여 발생하는 모든 비용 및 이 사업과 관련한 모든 시공상 하자, 분쟁 및 민원의 처리와 해결에 대해서는 위탁자 또는 이 신탁계약에서 정하는 자가 부담하기로 하는 내용의 관리형 토지 신탁을 설정함에 이 신탁계약의 목적이 있다."}, {"uid": "b2", "label": "제2조", "title": "용어의 정의", "text": "이 신탁계약에서 사용하는 용어는 아래에서 정의하는 의미를 갖는다. 1. “위탁자”란 신탁부동산을 수탁자에게 위탁하는 자를 말한다. 2. “수탁자”란 이 신탁계약에 따라 신탁부동산을 신탁재산으로 인수하는 자를 말한다. 3. “수익자”란 이 신탁계약에 따라 신탁재산으로부터 금전의 지급을 받거나 그 밖에 이 신탁계약상의 권리를 갖고 의무를 부담하는 자로서 별첨2에 적힌 자를 말하며, 이 신탁계약상 별도로 규정하지 않는 한 우선수익자를 포함한다. 4. “우선수익자”란 수익자들 중에서 이 신탁계약에 따라 신탁재산으로부터 우 선적으로 지급을 받을 권리를 갖고 의무를 부담하는 자로서 별첨2에 적힌 자를 말한다. 5. “수익권”이란 이 신탁계약에 따라 수익자가 신탁재산으로부터 금전을 지급 받을 권리 그 밖에 이 신탁계약상 수익자가 갖는 모든 권리를 말한다. 6. “우선수익권”이란 이 신탁계약에 따라 우선수익자가 신탁재산으로부터 금 전의 지급을 받거나 그 밖에 이 신탁계약상 우선수익자가 갖게 되는 권리 를 말한다. 7. “우선수익권금액”이란 우선수익자가 이 신탁계약에 따라 신탁부동산의 처 분대금 등 신탁재산으로부터 피담보채권의 변제를 위하여 우선하여 지급 받게 될 금액의 한도로서, 별첨2에 적힌 것을 말한다. 8. “피담보채권”이란 이 신탁계약에 따라 우선수익자가 신탁재산으로 그 변제 를 담보하고자 하는 채권으로서 별첨2에 적힌 것을 말한다. 9. “채무자”란 피담보채권에 관한 채무를 이행하여야 하는 자로서 별첨2에 적 힌 자를 말한다. 10. “이 사업”이란 신탁토지에 신탁건물을 신축·증축·개축·재축·대수선 및 리모 델링 등의 방법으로 개발하여 분양, 임대 등 처분하는 사업으로서 별첨3에 적힌 것을 말한다. 11. “수분양자”란 신탁부동산의 일부에 대하여 이 신탁계약에서 정한 바에 따 라 수탁자와 분양계약을 체결한 자를 말한다. 12. “시공사”란 신탁건물의 신축·증축·개축·재축·대수선 및 리모델링 공사를 수 행하는 자를 말한다. 13. “신탁건물”이란 이 신탁계약에 따라 신탁토지에 신축되거나 이 신탁계약에 따라 수탁자에게 신탁되어 증축·개축·재축·대수선 및 리모델링 등의 방법 으로 개발될 별첨1에 적힌 건물을 말한다. 14. “신탁토지”란 이 신탁"}, {"uid": "b3", "label": "제3조", "title": "각 당사자들의 기본 업무", "text": "① 이 신탁계약의 당사자들은 이 사업의 성공적인 수행을 통하여 이 신탁계 약의 목적을 달성하기 위해 이 조 각 항에서 정하는 바에 따라 업무를 분 담하고 상호 협력한다. 다만 위탁자는 신탁특약을 포함한 이 신탁계약에 따라 수탁자 또는 시공사가 담당하기로 한 업무를 제외하고, 이 사업과 관 련된 모든 업무를 위탁자의 책임과 부담으로 수행하되, 시공사는 이러한 위탁자의 의무에 대하여 연대하여 그 책임을 부담한다. ② 위탁자는 이 사업과 관련하여 다음 각 호의 업무를 수행한다. 1. 이 사업에 필요한 전체 부지에 대하여 아무런 제한물권이나 부담이 설 정되어 있지 않은 소유권 확보 2. 이 사업에 필요한 제반 인허가의 취득 및 그에 따른 조건의 이행 3. 이 사업에 필요한 계약들 중 공사도급계약 및 설계·감리용역계약 등 사 업시행주체 이름으로 체결되어야 하는 계약을 제외한 모든 계약 체결 4. 이 사업 시행에 필요한 모든 자금조달 5. 그 밖에 신탁특약에서 정하는 업무 ③ 수탁자는 이 사업과 관련하여 다음 각 호의 업무를 수행한다. 1. 신탁부동산에 대한 수탁업무 2. 신탁재산 범위 내에서 분양계약, 공사도급계약, 설계·감리용역계약 등 사업시행주체 이름으로 체결되어야 하는 계약의 체결 3. 이 사업의 분양수입금을 포함한 모든 자금의 수납 및 자금집행 업무 4. 신탁부동산의 수분양자 이름으로의 소유권이전등기 업무 ④ 시공사는 이 사업과 관련하여 다음 각 호의 업무를 수행한다. 1. 공사도급계약에서 정한 기간 내 신탁건물의 책임준공 2. 이 사업 비용이 부족할 경우의 자금보충 3. 이 사업과 관련한 채무 부담 시 필요한 신용보강 4. 그 밖에 신탁특약에서 정하는 업무 ⑤ 우선수익자는 이 사업과 관련하여 이 사업에 필요한 사업부지의 매입비용 및 사업비 등 대출 업무를 수행한다."}, {"uid": "b4", "label": "제4조", "title": "신탁기간", "text": "이 신탁계약에 따른 신탁기간은 년 월 일부터 년 월 일까지 로 한다. 다만 위 신탁기간이 만료되기 전에 제28조 제1항에 정해진 사유로 이 신탁계약에 따른 신탁이 종료된 경우에는 신탁기간도 이 신탁의 종료 시점 에 종료된 것으로 본다."}, {"uid": "b5", "label": "제5조", "title": "신탁재산의 범위", "text": "아래 각 호의 재산을 포함하여 신탁부동산 및 신탁부동산의 관리, 처분, 운용, 수용, 멸실, 훼손 그 밖의 사유로 수탁자가 얻은 재산은 신탁재산에 속한다. 1. 신탁부동산 및 신탁금전 2. 신탁부동산의 분양대금 (계약금, 중도금 및 잔금을 모두 포함하며, 이하 같다) 3. 신탁부동산의 물상대위로 취득한 재산 4. 신탁부동산의 임대차보증금 및 임대료 5. 제1호부터 제4호에 속하는 금전의 운용수익"}, {"uid": "b6", "label": "제6조", "title": "위탁자의 변경", "text": "① 위탁자는 수탁자 및 수익자 전원의 동의를 받아 위탁자의 지위를 제3자에 게 이전할 수 있다. 이로 인한 신탁원부 등에 적힌 내용 변경 및 수익권증 서 발행에 따른 비용은 위탁자가 부담한다. ② 제1항의 경우 위탁자가 여러 명일 때에는 다른 위탁자의 동의도 받아야 한다."}, {"uid": "b7", "label": "제7조", "title": "수익자 지정 및 수익권증서", "text": "① 수탁자는 위탁자가 이 신탁계약에 따른 위탁자가 아닌 제3자를 수익자로 지정한 경우 그 지정 사실을 지체 없이 해당 수익자에게 통지하여야 한다. ② 위탁자가 제3자를 수익자로 지정한 경우 수익자는 이 신탁계약의 내용을 알고 있으며 이에 동의한다는 취지의 승낙서에 이름을 적고 도장을 찍어 수탁자에게 제출하여야 한다. ③ 수탁자는 수익자의 요청이 있는 경우 이 신탁계약에 따른 수익자의 권리 를 증명하기 위한 증서인 수익권증서를 발행하여 해당 수익자에게 교부한 다."}, {"uid": "b8", "label": "제8조", "title": "우선수익권", "text": "① 우선수익자는 이 신탁계약에 따라 수탁자가 신탁부동산을 처분하는 경우 피담보채권액을 갚기 위하여 별첨2에 적힌 우선수익권금액을 한도로 신탁 부동산의 처분대금 등 신탁재산으로부터 수익자(이 항에서 우선수익자를 포함하지 아니한다)보다 우선하여 지급받을 권리를 가지며, 우선수익자가 여러 명인 경우 우선수익자 사이의 순위는 별첨2에 적힌 순위에 따른다. ② 우선수익자의 피담보채권이 변제된 경우에는 해당 우선수익자의 우선수익 권은 소멸한다. 다만 위탁자는 피담보채권이 변제된 경우 해당 우선수익자 로부터 피담보채권의 변제 사실을 입증하는 서면을 받아 수탁자에게 제공 하여야 하며, 해당 우선수익자에게 수익권증서가 발행된 경우에는 수익권 증서를 수탁자에게 반환함으로써 위 서면의 제공에 갈음할 수 있다. ③ 제1항의 규정에도 불구하고 수탁자는 이 신탁계약 제23조 제2항에서 정하 는 바에 따라 우선수익자에게 신탁수익을 지급할 수 있다."}, {"uid": "b9", "label": "제9조", "title": "수익권의 양도, 수익자의 추가 지정 또는 변경 등", "text": "① 우선수익자는 수탁자의 사전 동의를 받아 이 신탁계약에 따른 우선수익권 을 제3자에게 양도하거나 질권을 설정할 수 있다. 다만 우선수익권은 그 피담보채권과 함께 양도되어야 하며, 그 양수인이 이 신탁계약상 우선수익 자의 의무를 승계하는 조건으로만 양도되어야 한다. ② 제1항의 경우를 제외하고 수익자가 수익권을 양도하거나 질권설정 등 처 분행위를 하고자 하는 경우에는 수탁자의 사전 동의를 받아야 하고, 위탁 자가 수익자를 변경 또는 추가로 지정하고자 하는 경우에는 수탁자 및 다 른 수익자 전원의 사전 동의를 받아야 한다. 다만 이 경우에도 수익권의 양수인 또는 변경되거나 추가로 지정된 수익자는 이 신탁계약상 수익자의 의무를 부담하는 조건으로만 수익권을 양수하거나 수익자로 변경 또는 추 가 지정될 수 있으며, 변경 또는 추가로 지정되는 수익자가 우선수익자인 경우 해당 우선수익권금액에 대해서도 수탁자와 다른 수익자 전원의 사전 동의를 받아야 한다. ③ 제1항 및 제2항에 따라 수익권이 양도 또는 질권 설정되거나 수익자가 변 경 또는 추가로 지정되는 경우 수익권을 양도하거나 질권을 설정한 수익 자 또는 수익자를 변경 또는 추가 지정한 위탁자는 수탁자에게 통지하여 야 하며, 수익권을 양도하거나 질권을 설정한 수익자는 이를 확정일자 있 는 증서로 수탁자에게 통지하여야 한다. 이로 인한 신탁원부 등의 내용 변 경 및 수익권증서 발행에 따른 비용은 수익자가 부담하여야 한다. ④ 위탁자가 이 신탁계약에 따라 수익자를 추가로 지정하거나 변경할 수 있 는 권리는 상속을 원인으로 제3자에게 승계되지 아니한다."}, {"uid": "b10", "label": "제10조", "title": "신탁부동산의 소유권이전의무 등", "text": "① 위탁자는 이 신탁계약 체결 후 지체 없이 신탁부동산의 소유권이전등기 등 신탁재산의 공시에 필요한 모든 서류를 수탁자에게 제공하고 수탁자가 합리적으로 요구하는 조치를 취하여야 한다. ② 위탁자는 제1항의 신탁등기를 마치기 전에 신탁부동산에 설정된 부담(지상 권, 유치권, 전세권 등 제한물권, 등기되거나 대항력 있는 임차권, 가압류, 가처분, 압류, 가등기, 그 밖에 신탁부동산의 소유, 사용 또는 수익에 영향 을 미칠 수 있는 부담을 모두 포함함)을 위탁자의 책임과 비용으로 말소하 여야 한다. ③ 수탁자는 신탁건물의 사용승인, 준공인가 등 관련 법령에 따라 신탁건물을 등기할 수 있는 상태가 완료된 때에는 수탁자 이름으로 소유권보존등기 및 신탁등기를 마쳐야 한다. ④ 제1항 및 제3항의 등기에 필요한 비용은 위탁자가 부담한다. ⑤ 이 사업에 관한 사업승인 또는 인허가 조건상 진입도로 등의 부대사업 부 지를 취득하여야 하는 경우 위탁자는 해당 부지를 취득하여 이 조에 따라 수탁자 이름으로 신탁등기를 하도록 하여야 한다. 만일 위탁자가 이러한 의무를 이행하지 못하는 경우 수탁자는 신탁재산으로 부대사업 부지를 취 득할 수 있다. ⑥ 이 조에 따른 신탁등기 이전에 위탁자 이름으로 이 사업에 필요한 사업승 인이나 인허가를 받은 경우 위탁자는 수탁자 이름으로 그러한 승인이나 인허가 변경절차를 이행하여야 한다. 다만 사업 여건이나 분양시기 등을 고려하여 필요한 경우에는 인허가상 사업주체 등의 변경시기를 조정할 수 있다."}, {"uid": "b11", "label": "제11조", "title": "공사도급계약", "text": "① 수탁자는 시공사와 공사도급계약을 체결하기로 한다. 다만 위탁자가 이미 체결한 공사도급계약이 있는 경우 이를 승계할 수 있다. ② 수탁자가 제1항에 따른 공사도급계약을 체결한 경우, 수탁자는 책임 있는 사유가 없는 한 그러한 공사도급계약과 관련한 또는 그로부터 발생하는 모든 손실, 손해, 비용, 경비, 청구, 소송 및 그 밖의 절차로 인한 책임(이 하 “손실 등”이라 한다)을 부담하지 아니한다. ③ 시공사는 천재지변, 내란, 전쟁 등 불가항력적인 경우를 제외하고는 시공 사가 공사비 지급 지연 또는 민원 등 어떠한 이유로도 공사를 중단하거나 지연할 수 없고 공사도급계약에서 정한 공사기간 내에 사용승인 또는 준 공인가를 받기로 하는 책임준공의무를 부담한다 ④ 수탁자가 신탁재산에 속한 금전으로 공사대금을 지급하지 못할 경우에는 위탁자가 시공사에게 공사대금을 지급할 의무를 부담한다."}, {"uid": "b12", "label": "제12조", "title": "설계·감리 등 용역계약", "text": "① 수탁자는 설계·감리 실적, 재무상황, 기술인력, 설계·감리 능력, 보수액 등 제반 조건을 종합적으로 고려한 다음 선정한 설계·감리자와 설계·감리 용 역계약을 체결할 수 있다. 다만 위탁자가 이미 체결한 설계·감리 용역계약 이 있는 경우 수탁자는 이를 승계할 수 있다. ② 수탁자가 제1항에 따른 설계·감리계약을 체결한 경우, 수탁자는 책임 있는 사유가 없는 한 그러한 설계·감리계약과 관련한 또는 그로부터 발생하는 모든 손실 등으로 인한 책임을 부담하지 아니한다. ③ 제1항의 설계·감리 용역계약과 그 밖의 사업시행주체 이름으로 체결되어야 하는 계약을 제외한 나머지 용역계약은 위탁자가 자신의 이름으로 체결한 다. ④ 수탁자가 신탁재산에 속한 금전으로 용역계약에 따른 금전지급의무를 이 행하기에 부족한 경우에는 위탁자가 이를 이행할 의무를 부담한다."}, {"uid": "b13", "label": "제13조", "title": "자금조달", "text": "이 사업에 필요한 모든 자금은 위탁자가 자신의 책임과 비용으로 조달한다. 다만 위탁자가 자금을 조달하지 못하여 이 사업의 진행에 지장을 초래하는 경우 수탁 자의 요청에 따라 시공사가 위탁자의 자금조달을 위하여 필요한 신용보강을 하 거나 직접 신용공여 또는 자금지원을 한다."}, {"uid": "b14", "label": "제14조", "title": "신탁부동산의 관리 등", "text": "① 수탁자는 관계 법령상 허용되는 범위 내에서 방법, 시기 및 범위를 정하여 신탁부동산의 보존·유지·수선 등 관리에 필요한 조치를 취할 수 있다. ② 수탁자는 관계 법령상 허용되는 범위 내에서 신탁부동산의 보존·유지·수선 등 관리업무를 제3자에게 위임할 수 있다. ③ 수탁자 또는 제2항에 따라 선임된 자산관리자는 관리업무를 수행하기 위 하여 필요한 경우 합리적인 범위 내에서 신탁부동산의 일부를 무상으로 사용할 수 있다. ④ 위탁자는 이 신탁계약 체결 후 수탁자의 사전 서면 승낙이 없는 한 신탁 부동산에 대하여 임대차, 저당권설정, 전세권설정 등 소유권을 제한하는 처분행위 또는 신탁부동산의 현상을 변경하거나 그 밖의 방법으로 가치를 훼손하는 행위를 하지 못한다. ⑤ 수탁자는 신탁부동산의 멸실·훼손 그 밖의 사고가 발생하거나 발생이 예상 되는 경우에는 지체 없이 이를 수익자에게 통지하여야 한다. ⑥ 수탁자는 신탁부동산의 관리에 필요한 비용을 신탁재산에서 지급할 수 있 다."}, {"uid": "b15", "label": "제15조", "title": "신탁부동산의 분양 등 처분", "text": "① 위탁자는 이 신탁계약 체결 전에 신탁부동산에 관하여 분양계약을 체결하 여서는 아니된다. ② 수탁자는 신탁부동산을 신탁특약에서 정한 조건에 따라 분양할 수 있다."}, {"uid": "b16", "label": "제16조", "title": "신탁부동산의 분양업무 수행", "text": "① 위탁자와 시공사가 분양광고 및 그 밖의 분양계약 체결에 필요한 업무를 수행하기로 하되, 수탁자·수익자·우선수익자와 협의하여 달리 정할 수 있 다. ② 제1항에 따른 분양업무의 주체는 광고·홍보 및 분양계약서의 내용에 대하 여 사전에 수탁자의 승인을 얻어야 한다. ③ 분양계약서에는 이 신탁계약의 종료 시 분양계약에 따른 공급자로서 수탁 자의 권리와 의무는 수익자에게 면책적으로 승계된다는 내용을 분명하게 적어야 한다."}, {"uid": "b17", "label": "제17조", "title": "신탁부동산의 분양에 따른 소유권이전", "text": "① 수탁자는 신탁부동산에 대하여 수분양자와 분양계약을 체결한다. ② 수탁자는 신탁건물의 준공 이후 분양대금 납부계좌로 분양대금을 완납한 수분양자에게 분양의 대상인 신탁부동산의 소유권이전등기절차를 이행한 다. ③ 전2항에도 불구하고 수탁자의 책임 있는 사유 없이 분양의 대상인 신탁부 동산의 소유권이전등기가 불가능한 경우 수탁자는 그로 인한 책임을 부담 하지 아니한다."}, {"uid": "b18", "label": "제18조", "title": "보험계약", "text": "위탁자는 시장상황과 이 부동산의 용도, 규모, 가치 등을 생각하여 합리적으로 정한 종류, 기간, 부보금액, 방법으로 수탁자를 피보험자로 하여 신탁건물에 대 한 보험계약을 체결할 수 있다."}, {"uid": "b19", "label": "제19조", "title": "선관주의의무", "text": "① 수탁자는 선량한 관리자의 주의의무로서 신탁부동산을 보존·관리하고 신탁 사무를 처리한다. ② 수탁자가 신탁사무를 처리하는 과정에서 고의 또는 과실로 인하여 위탁자 또는 수익자에게 손해가 발생하는 경우에는 그 손해를 배상할 책임이 있 다."}, {"uid": "b20", "label": "제20조", "title": "신탁건물에 대한 하자담보책임", "text": "① 위탁자는 시공사와 연대하여 신탁건물에 관한 하자담보책임을 부담하며, 신탁건물이 준공된 직후 시공사로부터 신탁건물에 관한 하자보증서를 발 급받아 수탁자에게 교부하여야 한다. 다만 위탁자 또는 시공사가 관련 법 령에 따라 관할 관청에 하자보증서를 발급한 경우 수탁자에게는 하자보증 서를 제출하지 않을 수 있다. ② 위탁자나 시공사가 하자보증서를 발급받지 못하는 경우 수탁자는 신탁재 산에 속한 금전으로 하자보증서를 발급 받을 수 있다."}, {"uid": "b21", "label": "제21조", "title": "신탁재산에 속하는 금전의 운용방법", "text": "① 수탁자는 신탁재산에 속하는 금전을 「자본시장과 금융투자업에 관한 법률」 등 관계법령에서 정하는 방법에 따라 운용한다. ② 수탁자는 신탁재산을 다른 신탁재산 및 수탁자의 고유재산과 구분하여 관 리하여야 한다."}, {"uid": "b22", "label": "제22조", "title": "비용 등의 부담", "text": "① 신탁재산에 관한 다음 각 호의 채무와 비용을 포함하여 신탁사무의 처리 에 필요한 비용 그리고 신탁사무 처리에 있어서 수탁자의 고의나 과실, 그 밖의 책임 없는 사유로 발생한 손실 등은 위탁자가 부담한다. 1. 신탁부동산의 조세, 각종 공과금, 부담금, 등기비용 2. 신탁보수 3. 대지급금의 원리금 상환비용 4. 분양대금 및 임대차보증금 반환채무 5. 공사대금, 설계 및 감리비용 6. 신탁부동산의 보존·유지·수선 등 관리비용 및 보험료 7. 신탁부동산의 분양, 임대 또는 처분에 관한 사무처리에 필요한 비용 8. 이 신탁계약에 따른 신탁사무의 처리에 필요한 자문비용 9. 수탁자의 고의나 과실, 그 밖의 책임 없는 사유로 발생한 손실 10. 그 밖의 위 각 호와 관련 된 비용 ② 위탁자가 제1항의 비용 등을 지급하지 않는 경우 수탁자는 신탁재산에 속 하는 금전으로 이를 지급할 수 있다. 신탁재산에 속한 금전으로 이를 지급 하기에 부족한 경우 수탁자는 신탁부동산의 일부 또는 전부를 처분하여 지급에 사용하거나 신탁재산을 담보로 제공하여 지급에 필요한 금원을 차 용하거나 수익자(우선수익자를 포함하며, 이하 이 조에서 같다)에게 그 지 급을 청구할 수 있다. 다만 그 신탁재산의 매각으로 신탁의 목적을 달성할 수 없게 되거나 그 밖의 부득이한 사유가 있는 경우에는 신탁부동산의 일 부 또는 전부를 처분할 수 없다. ③ 수익자 또는 자금조달의무자에 대한 기업구조조정절차, 회생절차 또는 파 산절차의 개시 등의 사유로 인하여 사업비 조달이 불가능한 경우 수탁자 는 다음 각 호의 경우에 한하여 이를 대신 납부할 수 있으며 이를 위하여 신탁부동산의 전부 또는 일부에 (근)저당권을 설정할 수 있다. 이 경우에 위탁자 및 수익자는 연대하여 그 지급일로부터 상환일까지 연 [ ]%의 이 율로 계산한 지연손해금을 원금과 함께 수탁자에게 지급하여야 한다. 1. 수탁자가 법령상 납부의무자인 모든 세금과 공과금 및 각종 부담금과 분담금 2. 이 사업과 관련하여 수탁자가 당사자가 되는 소송의 소송비용(소송결 과에 따른 판결금액 및 이에 대한 지연이자 등 포함) 3. 분양대금반환채무 4. 그 밖의 신탁사무처리비용 ④ 수탁자는 제3항에 따른 위탁자 및 수익자의 지급의무에도 불"}, {"uid": "b23", "label": "제23조", "title": "자금관리 및 집행", "text": "① 수탁자는 분양수입금 등의 자금관리와 집행업무를 수행한다. ② 수탁자는 금융투자협회가 제정한 「금융투자회사의 영업 및 업무에 관한 규정」 별표15의 ‘토지신탁수익의 신탁 종료 전 지급기준’에서 정한 선지급 요건을 충족하는 경우 신탁기간 종료 이전에도 해당 범위 내에서 수익자 에게 신탁수익을 지급할 수 있다."}, {"uid": "b24", "label": "제24조", "title": "신탁의 계산 및 수익의 교부", "text": "① 신탁재산의 계산기일은 신탁기간이 종료한 날로 하며, 수탁자는 지체 없이 신탁사무에 관한 최종의 계산을 하고, 수익자와 귀속권리자의 승인을 받아 야 한다. ② 수익자와 귀속권리자가 제1항의 계산을 승인한 경우 수탁자의 수익자 및 귀속권리자에 대한 책임은 면제된 것으로 본다. 다만 수탁자의 직무수행에 부정행위가 있었던 경우에는 책임이 면제되지 않는다. ③ 최종계산서에 대하여 수익자 및 귀속권리자가 승인을 하지 아니한 경우 수탁자는 수익자 및 귀속권리자에게 최종계산의 승인을 요구하고, 수익자 및 귀속권리자는 계산승인의 요구를 받은 때로부터 1개월 이내에 승인여 부를 수탁자에게 통지하여야 한다. ④ 수탁자는 제3항의 계산승인을 요구하는 경우 “수익자 및 귀속권리자는 최 종계산에 대하여 이의가 있는 경우 계산승인을 요구 받은 때로부터 1개월 이내에 이의를 제기할 수 있으며, 그 기간 내에 이의를 제기하지 않으면 수익자 및 귀속권리자가 최종계산을 승인한 것으로 본다”라는 취지의 내 용을 수익자에게 알려야 한다. ⑤ 수익자 및 귀속권리자가 수탁자로부터 제3항의 계산승인을 요구 받은 때 로부터 1개월 내에 이의를 제기하지 아니하는 경우 제1항의 계산을 승인 한 것으로 본다. ⑥ 수탁자는 신탁의 계산이 완료된 후 제29조에 따라 신탁재산을 교부하여야 한다."}, {"uid": "b25", "label": "제25조", "title": "신탁보수", "text": "① 신탁보수는 기본보수와 성과보수로 구분한다. ② 기본보수는 매월 ______원이며, 신탁기간 중 매 분기 말일(3월 31일, 6월 30일, 9월 30일 및 12월 31일)에 지급받기로 한다. 다만 해당 지급일이 영 업일이 아닌 경우에는 그 다음 영업일에 지급받는다. 신탁기간이 어느 분 기의 도중에 종료하는 경우에는 위 기본보수를 일할 계산하여 지급받는다. ③ 성과보수는 별첨4에 적힌 산식에 의하여 계산된 금액으로 한다."}, {"uid": "b26", "label": "제26조", "title": "신탁해지 및 책임부담", "text": "① 위탁자는 수탁자, 수익자 등 이해관계인 전원의 동의가 있는 경우를 제외 하고는 수탁자의 책임 있는 사유 없이 신탁계약을 해지할 수 없다. ② 제1항의 규정에도 불구하고 수탁자는 신탁의 목적달성 또는 신탁사무의 수행이 불가능하거나 현저히 곤란한 경우 이 신탁계약을 해지할 수 있으 며, 수탁자의 책임 있는 사유가 없는 한 해지에 따른 책임을 부담하지 아 니한다."}, {"uid": "b27", "label": "제27조", "title": "수탁자의 사임", "text": "① 수탁자는 위탁자와 수익자의 승낙을 받은 경우에 한하여 사임할 수 있다. ② 제1항에도 불구하고 다음 각호의 어느 하나에 해당하는 경우 위탁자 및 수익자에게 [10일] 전 사전 서면 통지를 함으로써 사임할 수 있다. 1. 위탁자 또는 수익자가 이 신탁계약에 따라 수탁자에게 지급하여야 하는 신탁보수 및 비용을 그 지급기일로부터 [6개월] 이상 지체하고, 수탁자 가 그 지급을 요구하였음에도 [10] 영업일 이내에 이를 지급하지 아니 한 경우 2. 위탁자 또는 수익자가 이 신탁계약상 의무를 위반하고, 수탁자가 그 시 정을 요구하였음에도 [10]영업일 이내에 이를 시정하지 아니한 경우 3. 신탁사무의 처리와 관련하여 수탁자를 상대로 소송이 제기된 경우로서 소송비용의 회수가 어려울 것으로 명백히 예상되는 경우"}, {"uid": "b28", "label": "제28조", "title": "신탁의 종료", "text": "① 이 신탁계약에 따른 신탁은 다음 각호의 어느 하나에 해당하는 경우에 종 료한다. 1. 신탁기간이 만료된 경우 2. 신탁의 목적을 달성하였거나 달성할 수 없는 경우 3. 신탁기간 중 신탁부동산이 전부 분양되어 수분양자에게 소유권이 이전 된 경우 4. 이 신탁계약에 따라 신탁부동산이 처분되는 경우로서 신탁부동산에 관 한 처분대금의 정산이 종료되고 제24조에 의한 신탁의 계산이 완료된 경우 5. 제26조에 의하여 신탁이 해지되는 경우 ② 제1항에 따라 이 신탁계약에 따른 신탁이 종료하는 경우 수익자는 이 신 탁계약에 따라 발행된 수익권증서를 전부 수탁자에게 반환하여야 하고 수 탁자는 제29조에서 정한 바에 따라 신탁재산을 처리하여야 한다. ③ 신탁이 종료된 경우 이 사업과 관련한 수탁자의 모든 권리와 의무는 수익 자(신탁특약으로 신탁재산의 귀속권리자를 별도로 정한 경우에는 그 귀속 권리자)가 면책적·포괄적으로 승계한다."}, {"uid": "b29", "label": "제29조", "title": "신탁계약의 종료에 따른 신탁재산의 처리", "text": "① 신탁계약이 종료되고 제24조에 따른 계산의 승인이 있거나 또는 승인 간 주된 경우 수탁자는 수익자로부터 수익권증서를 반환 받은 날로부터 10 영업일 이내에 신탁재산을 다음 각 호의 방법에 따라 수익자(신탁특약으로 신탁재산의 귀속권리자를 별도로 정한 경우에는 그 귀속권리자)에게 교부 한다. 다만 수탁자는 신탁부동산의 하자로 인한 책임, 모든 세금과 공과금 납부의무, 소송에 따라 지급할 가능성이 있는 금액, 민원처리 비용에 해당 하는 금액 등은 신탁특약에서 정하는 바에 따라 그 지급을 하지 않을 수 있다. 1. 신탁부동산은 수탁자 이름의 신탁등기를 말소하고 수익자 이름으로 소 유권이전등기를 마친 다음 신탁계약 종료 당시의 현상 그대로 이를 수 익자에게 인도한다. 2. 신탁부동산 이외에 신탁재산은 신탁계약 종료 당시의 현상 그대로 이를 수익자에게 인도한다. ② 수익자 또는 귀속권리자가 제24조에 따른 계산에 이의를 제기한 경우에는, 수익자와 귀속권리자 및 수탁자가 정산에 합의하거나 또는 판결 등이 확 정된 날로부터 10영업일 이내에 제1항에서 정한 방법으로 신탁재산을 교 부한다. ③ 대지급금 상환, 임대보증금 반환채무 및 그 밖의 이 사업과 관련하여 수탁 자가 부담하는 제반 채무는 다음 각 호와 같이 처리한다. 1. 임대차보증금 반환채무 및 그 밖에 이 사업과 관련하여 수탁자가 부담 하는 채무는 수익자(우선수익자는 포함되지 아니하며, 이하 이 항에서 같다)가 승계하고 수탁자는 그 책임을 면한다. 2. 수탁자는 대지급금 상환, 분양대금 반환 및 비용의 지급을 위하여 신탁 재산에 속하는 금전의 지급을 하지 않을 수 있으며, 이러한 유보금으로 모든 채무를 변제할 수 없는 경우에는 그 부족액을 수익자가 지급한다. 다만 수탁자는 채권자와 수익자가 동의하는 경우 수익자에게 위와 같 은 채무를 면책적으로 인수하도록 하고 수탁자의 책임을 면할 수 있다. 3. 수익자가 제1호부터 제2호에 따라 해당 채무를 승계 또는 지급하지 않 는 경우 수탁자는 신탁부동산의 전부 또는 일부를 매각하여 그 채무를 변제할 수 있다. ④ 이 신탁계약이 종료되는 경우, 전항에 따른 신탁재산 정산 시점까지 발생 한 신탁보수, 신탁사무의 처리에 필요한 비용, 그 밖의 수탁자에게 "}, {"uid": "b30", "label": "제30조", "title": "신고사항", "text": "① 위탁자는 위탁자, 수익자 및 그 대리인 등 그 밖의 신탁관계인의 인감을 미리 수탁자에게 신고하여야 한다. ② 위탁자, 수익자, 시공사, 우선수익자 또는 그 상속인은 다음 각호의 사유가 발생한 경우에는 지체 없이 수탁자에게 그 사실을 서면 또는 팩스, 이메일 등으로 신고하여야 한다. 1. 신탁계약서, 수익권증서 및 신고인감의 분실 2. 각 당사자 및 그 대표자 또는 대리인, 그 밖의 신탁관계인의 사망 또는 주소, 연락처, 성명, 행위능력 등의 변경 및 신고인감의 변경 3. 각 당사자 및 그 대표자 또는 대리인, 그 밖의 신탁관계인의 부도, 파산 신청, 회생절차개시신청 또는 이러한 절차를 위한 보전처분이나 그 밖 의 이와 유사한 절차의 신청 4. 그 밖의 신탁계약에 관하여 변경을 요하는 사항의 발생 ③ 수탁자는 이 신탁계약상 적힌 내용 또는 이 신탁계약 체결 후 제2항에 따 라 각 당사자 신고한 내용에 따라 이 신탁계약 및 신탁특약에 따른 통지 등 신탁사무를 처리하기로 하며, 위탁자의 책임 있는 사유로 인해 제2항의 신고가 지체됨으로써 발생한 결과에 대하여는 수탁자는 수탁자의 책임 있 는 사유가 없는 한 그 책임을 지지 아니한다. 수탁자가 이 신탁계약상 적 힌 내용 또는 제2항에 따라 이 신탁계약 체결 후 각 당사자가 신고한 내 용에 따라 2회 이상 내용증명우편에 의한 통지를 보냈음에도 불구하고 그 통지가 계속 반송된 경우에는 수탁자의 책임 있는 사유 없이 위탁자의 책 임 있는 사유로 위탁자의 변경된 주소 등 소재를 알지 못하는 경우에 한 하여 최종 내용증명우편을 발송한 시점에 그 통지가 도달한 것으로 본다. ④ 위탁자가 위탁자의 책임 있는 사유로 인해 제1항 및 제2항의 신고를 게을 리하여 수탁자에게 손해가 발생한 경우에는 해당 당사자가 그 손해를 배 상한다."}, {"uid": "b31", "label": "제31조", "title": "세무와 회계", "text": "① 위탁자는 이 신탁계약의 체결과 동시에 신탁부동산의 소재지 관할세무서 에 관련 세법에 따라 이 사업만을 목적으로 한 별도의 사업자등록을 할 수 있다. ② 이 사업과 관련하여 발생하는 세무 관련 사항들은 위탁자가 책임지고 처 리한다. ③ 신탁재산의 처분과 관련하여 부과되는 부가가치세에 대해서는 위탁자가 이를 신고·납부하여야 한다. ④ 위탁자는 부가가치세를 환급 받는 경우 그 부가가치세 환급금을 신탁재산 으로 편입시켜야 한다. ⑤ 위탁자는 부가가치세 환급청구권을 수탁자에게 양도하여야 하며, 국세환급 금 양도요구서를 관할세무서에 제출하여야 한다. ⑥ 부가가치세 이외에도 이 사업과 관련하여 국세, 지방세, 그 밖의 조세 또 는 공과금의 환급청구권이 위탁자에게 귀속되는 경우에 제3항부터 제5항 까지의 내용을 적용한다."}, {"uid": "b32", "label": "제32조", "title": "소송수행", "text": "① 신탁부동산에 관한 소송이 제기되었거나 제기할 필요가 있는 경우 수탁자 는 위탁자와 수익자에게 이를 통지하고 위탁자 및 수익자와 협의하여 응 소 또는 제소에 필요한 조치를 취할 수 있다. ② 제1항에 따라 수탁자가 부담하는 소송대리인의 보수 및 소송과 관련된 비 용(소송결과에 따른 판결금액 및 이에 대한 지연이자 등 포함)은 제22조에 따라 처리한다. ③ 제1항에 따라 수탁자가 소송 등 업무를 수행한 경우에는 소송대리인 선임 사실 및 판결이 선고되거나 결정이 내려진 사실을 그 선임이 이루어진 날 또는 수탁자가 판결에 관하여 통지 받은 날로부터 지체 없이 위탁자 및 수익자에게 등기우편으로 통지하며, 이 경우 소송과 관련된 비용 및 해당 판결에 따라 수탁자가 지급의무를 부담하게 된 금액도 함께 통지하여야 한다."}, {"uid": "b33", "label": "제33조", "title": "관할법원", "text": "이 신탁계약에 관하여 분쟁이 발생하는 경우 관할법원은 민사소송법에서 정하 는 바에 따른다."}, {"uid": "b34", "label": "제34조", "title": "관계법령의 준수", "text": "이 신탁계약에 정하지 아니한 사항은 별도의 약정이 없는 한 관계법령 등에 정 하는 바에 따르며 관계법규 등에도 정함이 없는 경우에는 일반적인 상관례에 따른다."}, {"uid": "b35", "label": "제35조", "title": "신탁계약과 신탁특약의 관계", "text": "위탁자와 수탁자는 관계법령에 위반하지 않는 범위내에서 특약을 정할 수 있으 며, 신탁특약의 내용은 이 신탁계약의 내용을 우선한다. 이 신탁계약을 증명하기 위해 계약서를 5부 작성하여 당사자들이 각각 1부씩 보 관하며, 1부는 신탁등기에 사용한다. 년 월 일 위탁자 성명(상호): 주 소: 대 표 이 사: _______________ (인) 생년월일(법인등록번호): 수탁자 상 호: 주 소: 대 표 이 사: 법인등록번호: 시공사 상 호: 주 소: 대 표 이 사: 법인등록번호: 우선수익자 성명(상호): 주 소: 대 표 이 사: 생년월일(법인등록번호): 별 첨: 1. 신탁부동산의 표시 2. 우선수익자 및 수익자의 표시 3. 이 건 사업의 내역 4. 신탁보수 5. 신탁특약 [별첨 1] 신탁부동산의 표시 1. 신탁토지의 표시 2. 신탁건물의 표시 [별첨 2] 우선수익자 및 수익자의 표시 [별첨 3] 이 건 사업의 내역 1. 위치 2. 신탁건물의 건축 개요 구조 용도 층수 규모 건축면적 연면적 3. 주요 건축사양 [별첨 4] 신 탁 보 수 [별첨 5] 신 탁 특 약"}]}, {"id": "teu", "label": "신탁특약 (합성)", "short": "특약", "date": "사업장별 문서", "actor": "협상 대상", "articles": [{"uid": "b1", "label": "제1조", "title": "목적", "text": "이 신탁특약은 위탁자와 수탁자가 체결한 신탁계약에 따른 이 건 사업의 시행에 관하여 신탁계약에 정하지 아니한 사항 또는 신탁계약과 달리 정할 사항을 규정함을 목적으로 한다.", "overrides": "b1"}, {"uid": "t2", "label": "제2조", "title": "이 건 사업의 개요", "text": "① 사업명, 사업부지, 건축개요는 별지에 따른다. ② 이 건 사업은 「도시 및 주거환경정비법」에 따른 정비사업으로서 수탁자가 사업시행자의 지위에서 시행한다.", "overrides": null}, {"uid": "b4", "label": "제3조", "title": "신탁기간의 특례", "text": "① 신탁기간은 신탁계약 제4조에도 불구하고 이 건 사업의 준공 및 정산이 완료되는 날까지로 한다. ② 신탁기간 만료 시 위탁자와 수탁자가 별도 합의하지 아니하는 한 1년 단위로 자동 연장된다.", "overrides": "b4"}, {"uid": "b5", "label": "제4조", "title": "신탁재산의 추가 편입", "text": "위탁자는 이 건 사업에 필요한 부동산을 추가로 취득한 경우 지체 없이 수탁자에게 추가 신탁하여야 한다.", "overrides": "b5"}, {"uid": "b6", "label": "제5조", "title": "위탁자 지위 이전의 제한", "text": "위탁자는 수탁자 및 우선수익자 전원의 사전 서면동의 없이 위탁자의 지위를 제3자에게 이전하거나 위탁자의 지위에 관한 권리를 담보로 제공할 수 없다.", "overrides": "b6"}, {"uid": "b8", "label": "제6조", "title": "우선수익권의 순위 및 한도", "text": "① 우선수익권의 순위와 한도는 별지에 따른다. ② 신탁계약 제8조에도 불구하고 우선수익자는 수탁자의 사전 서면승낙 없이 우선수익권의 순위를 변경할 수 없다. ③ 우선수익권의 한도는 대출약정에 따른 대출원금의 100분의 130으로 한다.", "overrides": "b8"}, {"uid": "b9", "label": "제7조", "title": "수익권 양도의 제한", "text": "수익자는 수탁자의 사전 서면승낙 없이 수익권을 양도하거나 질권을 설정할 수 없다.", "overrides": "b9"}, {"uid": "b11", "label": "제8조", "title": "공사도급계약의 체결 및 승인", "text": "① 수탁자는 위탁자가 선정하여 수탁자의 승인을 받은 시공사와 공사도급계약을 체결한다. ② 신탁계약 제11조 제1항 단서에 따라 위탁자가 이미 체결한 공사도급계약을 승계하는 경우 수탁자는 승계계약을 별도로 체결하며, 승계하지 아니하는 조항을 승계계약에 명시한다. ③ 시공사의 책임준공기한은 착공일로부터 30개월로 하며, 천재지변에 한하여 연장할 수 있다.", "overrides": "b11"}, {"uid": "t9", "label": "제9조", "title": "공사비 증액의 승인", "text": "① 공사도급계약에 따른 공사비의 증액은 수탁자 및 우선수익자 전원의 사전 서면동의를 받아야 한다. ② 누적 증액이 최초 계약금액의 100분의 5를 초과하는 경우 정비사업지원기구의 검증을 받아야 한다.", "overrides": null}, {"uid": "b12", "label": "제10조", "title": "설계·감리자의 선정", "text": "위탁자는 설계자 및 감리자를 선정하여 수탁자의 승인을 받아야 하며, 용역계약은 신탁계약 제12조 제1항에 따라 수탁자 명의로 체결한다.", "overrides": "b12"}, {"uid": "b13", "label": "제11조", "title": "사업비 조달 및 시공사 신용보강", "text": "① 이 건 사업에 필요한 사업비는 위탁자가 조달하되, 위탁자가 조달하지 못하는 경우 시공사가 연대보증 또는 자금보충의 방법으로 신용보강한다. ② 대출약정의 인출선행조건 충족 여부는 수탁자가 확인한다.", "overrides": "b13"}, {"uid": "t12", "label": "제12조", "title": "대출약정과의 관계", "text": "① 수탁자는 대출약정에 따른 기한이익상실 사유가 발생한 경우 지체 없이 위탁자 및 시공사에게 통지한다. ② 대출약정의 내용이 이 신탁특약과 저촉되는 경우 대출약정을 우선한다.", "overrides": null}, {"uid": "b15", "label": "제13조", "title": "분양가의 결정 및 분양업무", "text": "① 분양가는 위탁자가 제안하고 수탁자 및 우선수익자 전원의 동의를 받아 결정한다. ② 신탁계약 제16조에도 불구하고 분양업무는 수탁자가 선정한 분양대행사가 수행한다.", "overrides": "b15"}, {"uid": "b17", "label": "제14조", "title": "분양대금의 관리", "text": "분양대금은 전액 수탁자 명의의 자금관리계좌로 입금하며, 위탁자는 이를 직접 수령할 수 없다.", "overrides": "b17"}, {"uid": "b18", "label": "제15조", "title": "보험 부보의 범위", "text": "위탁자는 신탁부동산에 대하여 화재보험 및 건설공사보험에 가입하되, 보험금청구권에 수탁자를 질권자로 지정하여야 한다.", "overrides": "b18"}, {"uid": "b19", "label": "제16조", "title": "수탁자의 면책 범위", "text": "① 신탁계약 제19조에도 불구하고 수탁자는 이 건 사업의 인허가 지연, 분양 부진, 공사 지연 및 그로 인한 손실에 대하여 책임을 부담하지 아니한다. ② 수탁자는 위탁자 또는 시공사의 귀책으로 발생한 손실에 대하여 책임을 부담하지 아니한다.", "overrides": "b19"}, {"uid": "b20", "label": "제17조", "title": "하자담보책임의 귀속", "text": "신탁건물에 대한 하 /* ═══ 1. 정렬 엔진 — 순서 보존 전역 정렬(Needleman-Wunsch) ═══
   탐욕적 매칭은 조항 하나를 잘못 붙이면 그 뒤가 줄줄이 밀린다.
   NW는 전체 점수를 최적화하므로 그 연쇄가 생기지 않는다. */
/* 유사도 — 문자 n-gram을 쓴다.
   어절 토큰은 한국어 조사 때문에 무너진다: `관할법원` ↔ `관할법원의 특례` 가 0.000이 나온다.
   형태소 분석기 없이 n-gram으로 우회한다. 제목은 길이 비대칭(본문 415자 vs 특약 82자)에
   강하도록 코사인 대신 포함도를 쓴다. */
function ngrams(s,n){ s=(s||"").replace(/\s+/g,""); const m=new Map();
  for(let i=0;i+n<=s.length;i++){const g=s.slice(i,i+n); m.set(g,(m.get(g)||0)+1);} return m; }
function cos(a,b){ let d=0,na=0,nb=0;
  for(const v of a.values()) na+=v*v;
  for(const [k,v] of b){ nb+=v*v; const x=a.get(k); if(x) d+=x*v; }
  return (na&&nb)? d/Math.sqrt(na*nb) : 0; }
function contain(a,b){ let hit=0,tot=0; const [sm,lg]= a.size<=b.size ? [a,b] : [b,a];
  for(const [k,v] of sm){ tot+=v; if(lg.has(k)) hit+=v; } return tot? hit/tot : 0; }

/* 특약·승계계약서는 본문 조를 명시적으로 인용한다 ("신탁계약 제11조에도 불구하고").
   그 인용이 있으면 가장 확실한 근거이므로 점수를 올린다. */
const RE_REF=/(?:신탁계약|본\s*계약|원\s*계약|원\s*도급계약)\s*제\s*(\d+)\s*조/g;
function refs(a){ if(a._r) return a._r;
  a._r=new Set([...(a.text||"").matchAll(RE_REF)].map(m=>+m[1])); return a._r; }
function artNo(a){ const m=/제(\d+)조/.exec(a.label||""); return m? +m[1] : null; }

function sim(a,b){
  a._t=a._t||ngrams(a.title,2); b._t=b._t||ngrams(b.title,2);
  a._b=a._b||ngrams(a.text,3);  b._b=b._b||ngrams(b.text,3);
  const na=artNo(a), bonus=(na!==null && refs(b).has(na)) ? 0.5 : 0;
  return Math.min(1, bonus + 0.35*contain(a._t,b._t) + 0.65*cos(a._b,b._b));
}
const GAP=0.40, FLOOR=0.25;
function align(A,B){
  const n=A.length,m=B.length;
  const S=Array.from({length:n+1},()=>new Float64Array(m+1));
  const P=Array.from({length:n+1},()=>new Uint8Array(m+1));
  for(let i=1;i<=n;i++){S[i][0]=S[i-1][0]-GAP;P[i][0]=2;}
  for(let j=1;j<=m;j++){S[0][j]=S[0][j-1]-GAP;P[0][j]=3;}
  const SIM=Array.from({length:n},()=>new Float64Array(m));
  for(let i=0;i<n;i++)for(let j=0;j<m;j++)SIM[i][j]=sim(A[i],B[j]);
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const dg=S[i-1][j-1]+SIM[i-1][j-1],up=S[i-1][j]-GAP,lf=S[i][j-1]-GAP;
    if(dg>=up&&dg>=lf){S[i][j]=dg;P[i][j]=1;}
    else if(up>=lf){S[i][j]=up;P[i][j]=2;}else{S[i][j]=lf;P[i][j]=3;}
  }
  const out=[];let i=n,j=m;
  while(i>0||j>0){
    const p=(i>0&&j>0)?P[i][j]:(i>0?2:3);
    if(p===1){const s=SIM[i-1][j-1];
      if(s<FLOOR){out.push({L:A[i-1],R:null,score:0});out.push({L:null,R:B[j-1],score:0});}
      else out.push({L:A[i-1],R:B[j-1],score:s});
      i--;j--;
    }else if(p===2){out.push({L:A[i-1],R:null,score:0});i--;}
    else{out.push({L:null,R:B[j-1],score:0});j--;}
  }
  out.reverse();
  return out.map(r=>{
    let status;
    if(!r.R)status="deleted"; else if(!r.L)status="inserted";
    else if(r.L.title!==r.R.title||r.L.text!==r.R.text)status="edited";
    else if(r.L.label!==r.R.label)status="moved"; else status="same";
    const o={...r,status};
    if(r.L&&r.R){const d=wdiff(r.L.text,r.R.text);o.lh=d[0];o.rh=d[1];}
    return o;
  });
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function wdiff(a,b){
  const at=a.match(/\S+|\s+/g)||[],bt=b.match(/\S+|\s+/g)||[];
  const n=at.length,m=bt.length;
  const D=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    D[i][j]=at[i]===bt[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  let i=0,j=0,ah="",bh="",da="",db="";
  const flush=()=>{ if(da)ah+="<del>"+esc(da)+"</del>"; if(db)bh+="<ins>"+esc(db)+"</ins>"; da=db=""; };
  while(i<n&&j<m){
    if(at[i]===bt[j]){flush();ah+=esc(at[i]);bh+=esc(bt[j]);i++;j++;}
    else if(D[i+1][j]>=D[i][j+1]){da+=at[i++];}
    else{db+=bt[j++];}
  }
  while(i<n)da+=at[i++];
  while(j<m)db+=bt[j++];
  flush();
  return[ah,bh];
}

/* ═══ 2. 조문 파서 — 붙여넣기·드롭한 텍스트를 조 단위로 ═══
   조 제목 정규식만으로는 두 군데서 무너진다.
     (1) 특약·승계계약서는 본문 조를 「신탁계약 제15조(분양)에도 불구하고」처럼 제목까지 붙여 인용한다.
         그대로 두면 인용문이 조 제목으로 잡혀 없는 조가 생긴다.
     (2) PDF에서 뽑은 텍스트는 줄바꿈이 아무 데나 들어가, 문장 중간의 「제22조」가 줄머리에 놓인다.
   그래서 ① 인용 접두어 뒤의 히트는 버리고 ② 번호가 역행하면 버리고 ③ 인식 결과를 warn으로 돌려준다.
   제목 없는 계약서(제1조 목적)는 제목 있는 조가 3개 미만일 때만 폴백으로 처리한다 —
   실물 PDF에서 제목 없는 히트를 같이 인정했더니 28조 문서가 18조로 줄었다. */
const RE_TITLED=/제\s*(\d+)\s*조(?:의\s*(\d+))?\s*\(([^)\n]{1,60})\)/g;
const RE_BARE  =/제\s*(\d+)\s*조(?:의\s*(\d+))?(?![\s(]*\()/g;
const RE_CITE  =/(?:신탁계약|본\s*계약|이\s*계약|원\s*계약|원\s*도급계약|동\s*계약|같은\s*법|이\s*법|위)\s*$/;

function scanArticles(t, re, needLineStart, warn){
  const out=[]; let m, last=0; re.lastIndex=0;
  while((m=re.exec(t))!==null){
    const no=+m[1], sub=m[2]?+m[2]:0, title=(m[3]||"").trim();
    const before=t.slice(Math.max(0,m.index-12), m.index);
    if(RE_CITE.test(before)){ warn.push(`다른 계약서 인용으로 보아 제외 — 제${no}조${title?`(${title})`:""}`); continue; }
    if(needLineStart && !/(^|\n)[ \t]*$/.test(before)) continue;
    if(no<last || (no===last && !sub)){ warn.push(`번호가 역행하여 제외 — 제${no}조${title?`(${title})`:""}`); continue; }
    last=no; out.push({at:m.index, len:m[0].length, no, sub, title});
  }
  return out;
}
function parseArticles(raw){
  let t=raw.replace(/\r/g,"");
  if(/<[a-z][\s\S]*>/i.test(t)){const d=document.createElement("div");d.innerHTML=t;t=d.textContent;}
  const warn=[];
  let hits=scanArticles(t, RE_TITLED, false, warn);
  if(hits.length<3){ warn.length=0; hits=scanArticles(t, RE_BARE, true, warn); }
  if(!hits.length)return Object.assign([],{warn});
  const arts=hits.map((h,k)=>({
    label:`제${h.no}조`+(h.sub?`의${h.sub}`:""),
    title:h.title,
    text:t.slice(h.at+h.len, k+1<hits.length?hits[k+1].at:t.length).replace(/\s+/g," ").trim().slice(0,1400)
  }));
  const max=hits[hits.length-1].no;
  if(arts.length<max)warn.push(`마지막 조가 제${max}조인데 ${arts.length}개만 인식됐습니다 — 누락 가능`);
  return Object.assign(arts,{warn});
}

/* ═══ 계약서 파일 판독 — hwpx / docx는 ZIP+XML이라 JSZip으로 직접 연다 ═══ */
function xmlText(xml, tag, paraEnd){
  // 태그 안의 텍스트만 모으고, 문단 끝에서 줄바꿈
  const out=[];
  const re=new RegExp(`<${tag}(?:\\s[^>]*)?>([\\s\\S]*?)</${tag}>|<\\/${paraEnd}>`,"g");
  let m;
  while((m=re.exec(xml))!==null){
    if(m[1]!==undefined) out.push(m[1].replace(/<[^>]+>/g,""));
    else out.push("\n");
  }
  return out.join("")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
    .replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&");
}
function needZip(){
  if(typeof JSZip==="undefined"){
    const e=new Error("압축 해제 모듈(JSZip)을 불러오지 못했습니다. 네트워크가 차단된 환경이면 hwpx·docx 판독과 .docx 추출을 쓸 수 없습니다.");
    e.title="모듈 로드 실패"; e.guide=true; throw e;
  }
}
async function readHwpx(buf){
  needZip();
  const z=await JSZip.loadAsync(buf);
  const names=Object.keys(z.files)
    .filter(n=>/^Contents\/section\d+\.xml$/i.test(n))
    .sort((a,b)=>(+a.match(/\d+/)[0])-(+b.match(/\d+/)[0]));
  if(!names.length) throw new Error("hwpx 구조가 아닙니다");
  let t="";
  for(const n of names) t += xmlText(await z.file(n).async("string"),"hp:t","hp:p")+"\n";
  return t;
}
async function readDocx(buf){
  needZip();
  const z=await JSZip.loadAsync(buf);
  const f=z.file("word/document.xml");
  if(!f) throw new Error("docx 구조가 아닙니다");
  return xmlText(await f.async("string"),"w:t","w:p");
}
const LEGACY={hwp:["한글(HWP) 구버전","한글에서 열고 [다른 이름으로 저장] → 형식을 «한글 문서 (*.hwpx)»로 저장한 뒤 다시 올려주세요."],
              doc:["Word 구버전(DOC)","Word에서 열고 [다른 이름으로 저장] → 형식을 «Word 문서 (*.docx)»로 저장한 뒤 다시 올려주세요."],
              pdf:["PDF","현재 버전은 PDF 본문 추출을 지원하지 않습니다. 원본 hwpx·docx가 있으면 그쪽을 올려주세요."]};
async function readContract(file){
  const ext=(file.name.match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  if(LEGACY[ext]){ const [n,how]=LEGACY[ext]; const e=new Error(how); e.title=n; e.guide=true; throw e; }
  if(ext==="hwpx") return await readHwpx(await file.arrayBuffer());
  if(ext==="docx") return await readDocx(await file.arrayBuffer());
  if(["txt","md","html","htm","xml"].includes(ext)) return await file.text();
  const e=new Error("지원하지 않는 형식입니다. hwpx 또는 docx로 올려주세요."); e.title=ext.toUpperCase(); e.guide=true; throw e;
}

/* ═══ 3. 상태 ═══ */
let SETI=0, VS=[];
let L=0, R=1, hover=-1, opened=new Set(), tab="hist", merge=new Map(), rows=[]
let checkSide=null;   // 문서 점검 탭이 보는 쪽 — 세트를 바꾸면 모드에 맞게 다시 정한다
function loadSet(i){
  SETI=i; const st=DATA.sets[i];
  MODE=st.mode||"version";
  VS=st.versions.map(v=>({...v, articles:v.articles.map(a=>({...a}))}));
  L=0; R=Math.min(1,VS.length-1); opened=new Set(); merge=new Map();

/* 모드에 따라 같은 정렬 결과가 다른 의미를 갖는다.
   version: 버전 간 변경 추적 / override: 특약이 본문을 뒤집는 관계 */
const LABELS={
  version:{ SYM:{same:"=",moved:"⇅",edited:"~",inserted:"+",deleted:"−"},
            NAME:{same:"동일",moved:"번호 이동",edited:"내용 변경",inserted:"신설",deleted:"삭제"},
            fold:"same", foldText:n=>`동일한 조 ${n}개`,
            voidL:"이 버전에 없음", voidR:"삭제됨" },
  override:{ SYM:{same:"→",moved:"→",edited:"→",inserted:"+",deleted:"·",unmet:"⚠"},
             NAME:{same:"특약이 대체",moved:"특약이 대체",edited:"특약이 대체",
                   inserted:"본문에 없는 신규 특약",deleted:"특약 없음 (본문 그대로)",
                   unmet:"본문이 특약에 위임했는데 특약이 없음"},
             fold:"deleted", foldText:n=>`특약이 건드리지 않은 조 ${n}개`,
             voidL:"본문에 없음", voidR:"특약 없음" },
};
let MODE="version";
const SYM=()=>LABELS[MODE].SYM, NAME=()=>LABELS[MODE].NAME;

/* 본문이 스스로 판단을 특약에 넘긴 자리 — 실물 약관에서 5곳 확인됐다(설계 §2.1).
   그중 제29조①단서("…신탁특약에서 정하는 바에 따라 그 지급을 하지 않을 수 있다")는
   유보금의 유일한 근거다. 특약이 이 자리에 침묵하면 근거가 사라지는데,
   override 모드의 접기 규칙은 바로 그 경우를 "특약 없음 → 접기"로 화면에서 지운다.
   그래서 위임 문형이 있는 본문 조는 짝이 없을 때 접지 않고 최상단에 고정한다.
   문형: 신탁특약 … 정하는/정한  (중간에 20여 자가 끼는 형태까지 — 제28·29조의 귀속권리자) */
const RE_DELEG=/신탁특약[^.]{0,25}?정[하한]/;
const delegated=a=>!!a&&RE_DELEG.test(a.text||"");

/* ═══ 4. 렌더 ═══ */
function recompute(){
  rows=align(VS[L].articles, VS[R].articles);
  if(MODE==="override")
    rows.forEach(r=>{
      if(r.status!=="deleted"||!delegated(r.L))return;
      r.status="unmet";
      /* "특약에 없다"는 판정은 정렬이 맞았을 때만 참이다. 정렬이 짝을 놓쳤을 수도 있으므로
         단정하지 않는다.
         → 한때 "가장 가까운 특약"을 힌트로 붙였다가 뺐다. 세 건 모두 엉뚱한 조를 가리켰다
           (본문 제15조 분양 → 특약 제4조 신탁재산의 추가 편입 0.18). 최유사로 짝을 찾는 것은
           이 프로젝트가 이미 부정 결과로 확인한 방법이다(설계 §2.2, 3/35).
           틀린 단서를 주느니 "확인하라"고만 말하는 편이 낫다. */
    });
}

function render(){
  recompute();
  renderSets(); renderSeg(); renderRail(); renderHead(); renderRows(); renderInspector();
  hover=-1;
}
function renderSets(){
  const el=$("sets"); el.innerHTML="";
  DATA.sets.forEach((st,i)=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=st.name;
    b.setAttribute("aria-pressed", i===SETI?"true":"false");
    b.onclick=()=>{ loadSet(i); render(); };
    el.appendChild(b);
  });
}
function renderSeg(){
  const s=$("seg"); s.innerHTML="";
  if(MODE==="override"){ s.style.display="none"; return; }
  s.style.display="";
  VS.forEach((v,i)=>{ if(i===0)return;
    const b=document.createElement("button"); b.type="button";
    b.textContent=`${VS[i-1].short} → ${v.short}`;
    b.setAttribute("aria-pressed", (L===i-1&&R===i)?"true":"false");
    b.onclick=()=>{L=i-1;R=i;opened=new Set();render();};
    s.appendChild(b);
  });
  const b=document.createElement("button"); b.type="button"; b.textContent="처음 → 끝";
  b.setAttribute("aria-pressed",(L===0&&R===VS.length-1&&VS.length>2)?"true":"false");
  b.onclick=()=>{L=0;R=VS.length-1;opened=new Set();render();};
  s.appendChild(b);
}
function renderHead(){
  $("hl").textContent=VS[L].label; $("hlm").textContent=`${VS[L].date} · ${VS[L].actor} · ${VS[L].articles.length}개 조`;
  $("hr").textContent=VS[R].label; $("hrm").textContent=`${VS[R].date} · ${VS[R].actor} · ${VS[R].articles.length}개 조`;
  const st={}; rows.forEach(r=>st[r.status]=(st[r.status]||0)+1);
  const rep=(st.edited||0)+(st.moved||0)+(st.same||0);
  $("tally").innerHTML = MODE==="override"
    ? `<span class="t-mod">대체 ${rep}</span><span class="t-add">신규 ${st.inserted||0}</span>`+
      (st.unmet?`<span class="t-del">위임 미이행 ${st.unmet}</span>`:"")+
      `<span style="opacity:.6">미변경 ${st.deleted||0}</span>`
    : `<span class="t-del">−${st.deleted||0}</span>`+
      `<span class="t-add">+${st.inserted||0}</span>`+
      `<span class="t-mod">~${(st.edited||0)+(st.moved||0)}</span>`;
  const pairs=rows.filter(r=>r.L&&r.R);
  const ver=pairs.filter(r=>r.L.uid&&r.R.uid);
  const ok=ver.filter(r=>r.L.uid===r.R.uid).length;
  const a=$("acc");
  if(ver.length){ a.textContent=`정렬 ${ok}/${ver.length}`+(ok<ver.length?` · 검수필요 ${ver.length-ok}`:"");
    a.className="acc"+(ok<ver.length?" bad":""); }
  else { a.textContent=`정렬쌍 ${pairs.length}`; a.className="acc"; }
}
function rowHTML(r,i){
  const long=d=>d&&d.text.length>190;
  const bad=(r.L&&r.R&&r.L.uid&&r.R.uid&&r.L.uid!==r.R.uid);
  const cell=(side,d,html)=> d
    ? `<div class="cell ${side}" data-row="${i}"><div><span class="ano">${d.label}</span><span class="atl">${esc(d.title)}</span></div>`+
      `<div class="atx${long(d)?" clamp":""}">${html||esc(d.text)}</div></div>`
    : side==="r"&&r.status==="unmet"
    ? `<div class="cell r void hint" data-row="${i}"><span class="voidm">특약에 대응 조문 없음</span>`+
      `<span class="hintm">본문이 특약에 넘긴 자리입니다. <b>특약이 침묵하면 근거가 사라집니다.</b><br>`+
      `정렬이 짝을 놓친 것은 아닌지도 함께 확인하세요</span></div>`
    : `<div class="cell ${side} void" data-row="${i}"><span class="voidm">${side==="r"?LABELS[MODE].voidR:LABELS[MODE].voidL}</span></div>`;
  const hi = MODE!=="override";   // 특약은 본문을 고친 게 아니라 새로 쓴 것이라 어절 diff가 의미 없다
  return cell("l",r.L,hi?r.lh:null)+
    `<div class="gut s-${r.status}" data-row="${i}" title="${NAME()[r.status]}${bad?" · 정렬 검수 필요":""}">`+
    `<span class="sym">${SYM()[r.status]}</span>${r.L&&r.R?`<span>${r.score.toFixed(2)}</span>`:""}</div>`+
    cell("r",r.R,hi?r.rh:null);
}
function renderRows(){
  const g=$("grid"); const out=[]; let run=[];
  // 위임 미이행은 "변화가 없어서" 눈에 안 띄는 항목이다. 접기 대상에서 빼는 것만으로는
  // 부족해서 최상단으로 끌어올린다. 인덱스는 data-row로 박히므로 순서를 바꿔도 트래킹은 유지된다.
  const pin=rows.reduce((v,r,i)=>(r.status==="unmet"&&v.push(i),v),[]);
  if(pin.length){
    out.push(`<div class="fold pin"><button type="button" disabled>⚠ 본문이 특약에 위임한 자리인데 특약이 없습니다 · ${pin.length}건`+
      `<span style="opacity:.7">${pin.map(i=>rows[i].L.label).join(" · ")}</span></button></div>`);
    pin.forEach(i=>out.push(rowHTML(rows[i],i)));
  }
  const flush=()=>{ if(!run.length)return;
    if(run.length>=3 && !opened.has(run[0])){
      const a=rows[run[0]],b=rows[run[run.length-1]];
      out.push(`<div class="fold"><button type="button" data-fold="${run[0]}">▸ ${LABELS[MODE].foldText(run.length)}`+
        `<span style="opacity:.6">${(a.L||a.R).label}–${(b.L||b.R).label}</span></button></div>`);
    } else run.forEach(i=>out.push(rowHTML(rows[i],i)));
    run=[]; };
  const FOLD=LABELS[MODE].fold;
  rows.forEach((r,i)=>{ if(r.status==="unmet")return;         // 위에서 이미 올렸다
    if(r.status===FOLD)run.push(i); else{flush();out.push(rowHTML(r,i));} });
  flush(); g.innerHTML=out.join("");
}
$("grid").addEventListener("click",e=>{
  const f=e.target.closest("[data-fold]");
  if(f){opened.add(+f.dataset.fold);renderRows();return;}
  const c=e.target.closest(".cell"); if(!c)return;
  document.querySelectorAll(`.cell[data-row="${c.dataset.row}"] .atx`).forEach(t=>t.classList.toggle("clamp"));
});

/* ═══ 5. 마우스 트래킹 + 좌우 동시 하이라이트 ═══ */
const sc=$("scroll"), ruler=$("ruler"); let raf=null,my=0;
function rowAt(y){
  const sr=sc.getBoundingClientRect();
  const el=document.elementFromPoint(sr.left+22,y); if(!el)return -1;
  const c=el.closest("[data-row]"); if(!c||c.parentElement!==$("grid"))return -1;

function select(i){

  hover=i;
  if(i<0){status(null);if(tab==="hist")renderInspector();return;}

sc.addEventListener("mousemove",e=>{ my=e.clientY; if(raf)return;

/* ═══ 8-0. 단일 문서 점검 — 비교 상대가 없어도 동작한다 (설계 §8.4) ═══
   전부 정규식이고 도메인 룰을 요구하지 않는다. 실물 신고 약관 한 건에서 아래가 전부 나왔다. */

/* (1) 잔존 공란. 체결 직전 문서에 남아 있으면 사고다. */
const BLANKS=[["빈칸 [ ]",/\[\s+\]/g],["밑줄 공란",/_{3,}/g],["빈 괄호",/\(\s{2,}\)/g],
              ["날짜 미기재",/년\s+월\s+일/g],["○○ 표기",/[○◯]{2,}/g],["미정 표기",/(?:TBD|미정|추후\s*협의)/g]];
function scanBlanks(arts){
  const out=[];
  for(const a of arts)for(const [name,re] of BLANKS){
    re.lastIndex=0; let m;
    while((m=re.exec(a.text||""))!==null)
      out.push({label:a.label,kind:name,ctx:a.text.slice(Math.max(0,m.index-22),m.index+m[0].length+12)});
  }
  return out;
}
/* (2) 상호참조 무결성. 조가 신설·삭제되면 번호는 밀리는데 본문 속 인용 숫자는 안 따라간다.
   두 가지를 반드시 걸러야 한다 — 안 그러면 오탐이 실제로 났다:
     · 법령 인용 (「건설산업기본법」 제54조) — 우리 문서의 조가 아니다
     · 다른 계약서 인용 (신탁계약 제33조) — 특약이 본문을 부르는 정상적인 참조 */
const RE_LAW=/(?:법|법률|시행령|시행규칙|규칙|조례|약관|규정|기준)\s*$/;
const RE_XDOC=/(?:신탁계약|본\s*계약|이\s*계약|원\s*계약|원\s*도급계약|동\s*계약)\s*$/;
function scanRefs(arts){
  const have=new Set(arts.map(a=>(a.label||"").replace(/\s/g,"")));
  const out=[]; let total=0;
  for(const a of arts){
    const re=/제\s*(\d+)\s*조(?:의\s*(\d+))?/g; let m;
    while((m=re.exec(a.text||""))!==null){
      const before=(a.text||"").slice(Math.max(0,m.index-14),m.index);
      if(RE_LAW.test(before)||RE_XDOC.test(before))continue;
      total++;
      const lab=`제${m[1]}조`+(m[2]?`의${m[2]}`:"");
      if(!have.has(lab))out.push({label:a.label,to:lab});
    }
  }
  return {total,broken:out};
}
/* (3) 용어 외연. 한 계약서 안에서 '수익자'의 범위가 세 번 달라지는 것이 실물에서 확인됐다.
   법률문서에서 이건 오류가 아니라 의도된 국소 재정의라서 — 판정하지 않고 목록만 낸다. */
const RE_SCOPE=/(?:[^\s(（]{2,12})\s*[((][^)）]{0,40}?(?:포함한다|포함하지\s*아니한다|포함되지\s*아니하며|포함되지\s*않으며|제외한다)/g;
function scanScope(arts){
  const out=[];
  for(const a of arts){ RE_SCOPE.lastIndex=0; let m;
    while((m=RE_SCOPE.exec(a.text||""))!==null)out.push({label:a.label,ctx:m[0]});
  }
  return out;
}

    const probe=r.R||r.L;

      return {v,a:bs>=0.55?best:null,s:bs};
    });

  }
  if(tab==="check"){
    // 이 탭은 비교가 아니라 문서 한 건을 본다. 그래서 어느 쪽을 볼지 고르게 한다 —
    // 버전 비교에서는 최신 제출본(우), 본문↔특약에서는 신고 약관 본문(좌)이 보통 관심 대상이다.

      sec("잔존 공란",bl.length, bl.length
        ? bl.map(x=>`<div class="cki"><b>${esc(x.label)}</b> ${esc(x.kind)}<span>…${esc(x.ctx)}…</span></div>`).join("")
        : `<div class="cki ok">남아 있는 공란이 없습니다</div>`, bl.length?"bad":"")+
      sec("깨진 상호참조",rf.broken.length, rf.broken.length
        ? rf.broken.map(x=>`<div class="cki"><b>${esc(x.label)}</b> → ${esc(x.to)} <span>그 조가 이 문서에 없습니다</span></div>`).join("")
        : `<div class="cki ok">내부 참조 ${rf.total}건 모두 실재하는 조를 가리킵니다</div>`, rf.broken.length?"bad":"")+
      sec("용어 범위의 국소 재정의",sc.length, sc.length
        ? sc.map(x=>`<div class="cki"><b>${esc(x.label)}</b><span>${esc(x.ctx)}</span></div>`).join("")
        : `<div class="cki ok">범위를 다시 정의하는 표현이 없습니다</div>`)+
      `<div class="note">공란과 참조는 <b>사고</b>이므로 고쳐야 합니다. 용어 재정의는 법률문서에서 흔히 <b>의도된 것</b>이라 `+

async function saveFile(filename,data){

    catch(e){ if(e&&e.code==="declined")return "declined";
      console.warn("downloads:",e&&e.code); } }
  try{ const blob=data instanceof Blob?data:new Blob([data]);

    : `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>`+
      `<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr>`;
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
    `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">`+
    `<w:body>${bodyXml}${sect}</w:body></w:document>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
    `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
    `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
    `<Default Extension="xml" ContentType="application/xml"/>`+
    `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>`+
    `</Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
    `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>`+
    `</Relationships>`;
  const zip=new JSZip();
  zip.file("[Content_Types].xml",ct);
  zip.folder("_rels").file(".rels",rels);
  zip.folder("word").file("document.xml",doc);
  return await zip.generateAsync({type:"blob",
    mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
/* 산출물 2 규격: 가로 A4 · No./조항/【전】/【후】/사유 · 지정 색상 */
function cmpRows(a,b){
  const rs=align(a.articles,b.articles);
  let n=0;
  return rs.filter(r=>r.status!=="same").map(r=>{
    n++;
    const t=(r.R||r.L);
    const reason={inserted:"신설 조항 — 도입 취지와 법리 근거 확인 필요",
      deleted:"삭제된 조항 — 삭제 사유와 대체 장치 확인 필요",
      edited:"본문 변경 — 변경된 어절의 의미 변화 검토",
      moved:"조 번호 이동 — 내용 동일, 인용 조문 정합성 확인"}[r.status];
    return {no:`${{inserted:"A",deleted:"B",edited:"C",moved:"D"}[r.status]}-${n}`,
      clause:`${t.label} ${t.title}`,
      before:r.L?`${r.L.label} ${r.L.title}\n${r.L.text}`:"(해당 조항 없음)",
      after:r.R?`${r.R.label} ${r.R.title}\n${r.R.text}`:"(삭제됨)",
      reason, status:r.status};
  });
}
async function exportCompare(li,ri){
  const a=VS[li],b=VS[ri],data=cmpRows(a,b);
  const head=`<w:tr><w:trPr><w:tblHeader/></w:trPr>`+
    [["No.",900],["조항",2400],["【전】 "+a.label,4300],["【후】 "+b.label,4300],["수정 사유 / 법리근거",3200]]
      .map(([t,w])=>cell(para(t,{b:true,color:"FFFFFF",sz:17}),w,"1F3A5F")).join("")+`</w:tr>`;
  const body=data.map(d=>`<w:tr>`+
    cell(para(d.no,{sz:16,b:true}),900)+
    cell(para(d.clause,{sz:16}),2400)+
    cell(para(d.before,{sz:16,color:"C00000"}),4300,"FFF5F5")+
    cell(para(d.after,{sz:16,color:"0070C0"}),4300,"F0F8E8")+
    cell(para(d.reason,{sz:16}),3200,"FFFEF0")+`</w:tr>`).join("");
  const xml=para(`${a.label} → ${b.label} 변경 대비표`,{b:true,sz:28})+
    para(`${a.date} → ${b.date} · 변경 ${data.length}건 · diffcheck 자동 생성`,{sz:16,color:"666666"})+
    para("")+
    `<w:tbl><w:tblPr><w:tblW w:w="15100" w:type="dxa"/>${BORDERS}</w:tblPr>${head}${body}</w:tbl>`;
  let blob; try{ blob=await docxBlob(xml,true); }
  catch(e){ openModal("err",{title:e.title||"추출 실패",msg:e.message,name:"대비표.docx"}); return; }
  const r=await saveFile(`대비표_${a.short}_${b.short}.docx`,blob);
  if(r==="failed")openModal("err",{title:"추출 실패",msg:"파일을 저장하지 못했습니다.",name:"대비표.docx"});
}
async function exportContract(arts){
  // "최종본"이라 부르지 않는다 — 무엇이 최종이 될지는 검토가 끝나야 안다(설계 §7.7).
  const xml=para("계약서 검토본",{b:true,sz:32,align:"center"})+
    para(`diffcheck 검토 결과 · ${arts.length}개 조`,{sz:16,color:"666666",align:"center"})+para("")+
    arts.map(a=>para(`${a.label}(${a.title})`,{b:true,sz:20})+para(a.text,{sz:18})+para("")).join("");
  let blob; try{ blob=await docxBlob(xml,false); }
  catch(e){ openModal("err",{title:e.title||"추출 실패",msg:e.message,name:"계약서.docx"}); return; }
  const r=await saveFile(`계약서_${(VS[R].label||"검토본").replace(/\s/g,"")}.docx`,blob);
  if(r==="failed")openModal("err",{title:"추출 실패",msg:"파일을 저장하지 못했습니다.",name:"계약서.docx"});
}

/* ═══ 10. 모달 ═══ */
const mask=$("mask"),modal=$("modal");
mask.addEventListener("click",e=>{if(e.target===mask)closeModal();});
function closeModal(){mask.classList.remove("on");modal.innerHTML="";}
function openModal(kind,arg){
  if(kind==="paste"){
    modal.innerHTML=`<h2>붙여넣기로 버전 추가</h2><div class="mb">`+
      `<div class="fld"><label>버전 이름</label><input type="text" id="pName" placeholder="예: 시공사 3차 제출"></div>`+
      `<div class="fld"><label>작성 주체</label><input type="text" id="pActor" placeholder="예: 시공사"></div>`+
      `<div class="fld"><label>계약서 전문 — 「제1조(총칙)」 형식의 조 제목이 있어야 인식됩니다</label>`+
      `<textarea id="pText" placeholder="제1조(총칙) ...&#10;제2조(정의) ..."></textarea></div></div>`+
      `<div class="mf"><button class="btn" id="pC">취소</button><button class="btn pri" id="pO">추가</button></div>`;
    $("pC").onclick=closeModal;
    $("pO").onclick=()=>{ const arts=parseArticles($("pText").value);
      if(!arts.length){alert("조문을 찾지 못했습니다.");return;}
      addVersion(arts,$("pName").value.trim()||null,$("pActor").value.trim()||null); closeModal();
      if(arts.warn&&arts.warn.length)openModal("warn",{name:"붙여넣은 텍스트",n:arts.length,warn:arts.warn}); };
  }
  if(kind==="err"){
    modal.innerHTML=`<h2>${esc(arg.title)}</h2><div class="mb">`+
      `<div style="font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:9px">${esc(arg.name)}</div>`+
      `<div style="font-size:12.5px;line-height:1.75">${esc(arg.msg)}</div>`+
      `<div class="note" style="margin-top:12px">지원 형식: <b>.hwpx</b> · <b>.docx</b> · .txt · .md<br>`+
      `구버전 .hwp / .doc와 .pdf는 본문 구조를 신뢰할 수 있게 읽어낼 수 없어 받지 않습니다.</div></div>`+
      `<div class="mf"><button class="btn pri" id="eC">확인</button></div>`;
    $("eC").onclick=closeModal;
  }
  if(kind==="warn"){
    // 조 인식은 끝났지만 미심쩍은 것이 남았다. 진행은 막지 않되 숨기지도 않는다(§7.4와 같은 원칙).
    modal.innerHTML=`<h2>조 ${arg.n}개를 인식했습니다 — 확인이 필요합니다</h2><div class="mb">`+
      `<div style="font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:9px">${esc(arg.name)}</div>`+
      `<ul style="font-size:12.5px;line-height:1.9;padding-left:18px;margin:0">`+
      arg.warn.map(w=>`<li>${esc(w)}</li>`).join("")+`</ul>`+
      `<div class="note" style="margin-top:12px">인용문이 조 제목으로 잘못 잡히는 것을 막기 위해 걸러낸 것입니다. `+
      `실제 조가 빠졌다면 해당 부분을 붙여넣기로 따로 추가해주세요.</div></div>`+
      `<div class="mf"><button class="btn pri" id="wC">확인</button></div>`;
    $("wC").onclick=closeModal;
  }
  if(kind==="cmp"){
    const [li,ri]=arg, a=VS[li], b=VS[ri], data=cmpRows(a,b);
    modal.innerHTML=`<h2>${esc(a.label)} → ${esc(b.label)} 변경 대비표 · ${data.length}건</h2>`+
      `<div class="mb"><table class="cmp">`+
      `<colgroup><col style="width:7%"><col style="width:16%"><col style="width:28%">`+
      `<col style="width:28%"><col style="width:21%"></colgroup>`+
      `<thead><tr><th>No.</th><th>조항</th>`+
      `<th>【전】 ${esc(a.short)}</th><th>【후】 ${esc(b.short)}</th><th>수정 사유</th></tr></thead><tbody>`+
      data.map(d=>`<tr><td class="no">${d.no}</td><td>${esc(d.clause)}</td>`+
        `<td class="o">${esc(d.before).replace(/\n/g,"<br>").slice(0,420)}</td>`+
        `<td class="n">${esc(d.after).replace(/\n/g,"<br>").slice(0,420)}</td>`+
        `<td class="w">${esc(d.reason)}</td></tr>`).join("")+
      `</tbody></table></div>`+
      `<div class="mf"><button class="btn" id="cC">닫기</button>`+
      `<button class="btn pri" id="cO">.docx 추출 (가로 A4)</button></div>`;
    $("cC").onclick=closeModal;
    $("cO").onclick=async()=>{ await exportCompare(li,ri); closeModal(); };
  }
  mask.classList.add("on");
}
$("btnCmp").onclick=()=>{ const p=selectedPair(); if(p)openModal("cmp",p); };

loadSet(0); render(); syncTabs();
