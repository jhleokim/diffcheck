<title>계약서 협상 타임머신</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* 디자인 시스템: pdf.hanatrust.workers.dev 토큰 채택
   역할/‑ink/‑line/‑wash 4단 네이밍, 타이트한 radius, 절제된 그림자 */
:root{
  --paper:#f6f6f3; --surface-2:#efefeb; --sheet:#f1f1ed;
  --ink:#181a19; --ink-2:#585f5c; --ink-3:#79817d;
  --line:#e2e3e0; --line-2:#cdd0cc;
  --accent:#00806a; --accent-ink:#00604f; --accent-line:#a8cfc5; --accent-wash:#e7f1ee;
  --danger:#bf342e; --danger-ink:#98241f; --danger-line:#e8bfbc; --danger-wash:#fbeceb;
  --warn:#a06a12;  --warn-ink:#7d5310;  --warn-line:#e6d3a4;  --warn-wash:#fbf3e2;
  --r:2px; --r-md:4px; --r-lg:8px;
  --sh-1:0 1px 2px rgba(20,24,22,.05);
  --sh-3:0 24px 60px -12px rgba(20,24,22,.4);
  --ease:cubic-bezier(.2,.7,.3,1);
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111312; --surface-2:#212523; --sheet:#232725;
  --ink:#e9ebe8; --ink-2:#a3aaa6; --ink-3:#8b9390;
  --line:#2a2e2c; --line-2:#3a403d;
  --accent:#3bb79c; --accent-ink:#6fd3bb; --accent-line:#2f6a5c; --accent-wash:#12312a;
  --danger:#e5645d; --danger-ink:#f08b85; --danger-line:#6d302c; --danger-wash:#3a1a18;
  --warn:#d6a748;  --warn-ink:#e8c37a;  --warn-line:#4a3c1c;  --warn-wash:#2a2213;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --paper:#111312; --surface-2:#212523; --sheet:#232725;
  --ink:#e9ebe8; --ink-2:#a3aaa6; --ink-3:#8b9390;
  --line:#2a2e2c; --line-2:#3a403d;
  --accent:#3bb79c; --accent-ink:#6fd3bb; --accent-line:#2f6a5c; --accent-wash:#12312a;
  --danger:#e5645d; --danger-ink:#f08b85; --danger-line:#6d302c; --danger-wash:#3a1a18;
  --warn:#d6a748;  --warn-ink:#e8c37a;  --warn-line:#4a3c1c;  --warn-wash:#2a2213;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;font-size:13px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{display:flex;flex-direction:column;height:100vh}

/* 상단 바 */
.top{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:var(--sheet);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:7px;font-weight:700;letter-spacing:-.02em;flex:none}
.brand b{font-size:14px}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 6px;
  border:1px solid var(--accent-line);color:var(--accent);background:var(--accent-wash);border-radius:var(--r)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 11px;font-size:12px;color:var(--ink-2);
  border-right:1px solid var(--line-2);transition:background .12s var(--ease)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tally{margin-left:auto;display:flex;gap:10px;font-family:var(--mono);font-size:12px;align-items:center}
.t-del{color:var(--danger)} .t-add{color:var(--accent)} .t-mod{color:var(--warn)}
.acc{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:var(--r);
  border:1px solid var(--line-2);color:var(--ink-3)}
.acc.bad{color:var(--warn-ink);border-color:var(--warn-line);background:var(--warn-wash)}

.body{flex:1;display:flex;min-height:0}

/* 좌: 버전 레일 */
.rail{width:206px;flex:none;background:var(--sheet);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.rail-h{padding:9px 12px 7px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between}
.rail-h span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3)}
.vlist{flex:1;overflow-y:auto;padding:6px}
.vdrop{height:3px;margin:1px 0;border-radius:2px;transition:background .1s}
.vdrop.over{background:var(--accent);height:6px}
.vcard{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-md);
  padding:7px 9px;margin:0;cursor:grab;transition:border-color .12s var(--ease),box-shadow .12s}
.vcard:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.vcard.isL{border-color:var(--ink-3);box-shadow:inset 2px 0 0 var(--ink-3)}
.vcard.isR{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.vcard.dragging{opacity:.4}
.vcard .vtop{display:flex;align-items:center;gap:5px}
.vcard .vname{font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vcard .vmeta{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:2px}
.vstar{all:unset;cursor:pointer;font-size:12px;line-height:1;color:var(--ink-3);padding:0 2px;flex:none}
.vstar:hover{color:var(--warn)}
.vstar.on{color:var(--warn)}
.vfinal{margin-top:4px;display:inline-block;font-family:var(--mono);font-size:9px;
  padding:1px 5px;border-radius:var(--r);background:var(--warn-wash);
  color:var(--warn-ink);border:1px solid var(--warn-line)}
.vcard .vside{font-family:var(--mono);font-size:9px;padding:1px 4px;border-radius:var(--r);
  border:1px solid var(--line-2);color:var(--ink-3)}
.vcard.isL .vside,.vcard.isR .vside{border-color:currentColor}
.vchk{width:13px;height:13px;flex:none;accent-color:var(--accent);cursor:pointer}
.rail-f{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px}
.btn{all:unset;cursor:pointer;text-align:center;padding:6px 9px;font-size:11.5px;
  border:1px solid var(--line-2);border-radius:var(--r-md);color:var(--ink-2);
  transition:background .12s var(--ease),border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3);color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-ink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.dz{border:1px dashed var(--line-2);border-radius:var(--r-md);padding:9px;text-align:center;
  font-size:10.5px;color:var(--ink-3);line-height:1.5;transition:all .12s var(--ease)}
.dz.over{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}

/* 중앙 문서 */
.mid{flex:1;display:flex;flex-direction:column;min-width:0}
.dochead{flex:none;display:grid;grid-template-columns:1fr 44px 1fr;background:var(--surface-2);
  border-bottom:1px solid var(--line)}
.dochead>div{padding:6px 12px;min-width:0}
.dochead .r{border-left:1px solid var(--line)}
.dochead .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dochead .mt{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:1px}
.scroll{flex:1;overflow-y:auto;position:relative;background:var(--paper)}
.grid{display:grid;grid-template-columns:1fr 44px 1fr}
.cell{padding:8px 12px 10px;border-bottom:1px solid var(--line);min-width:0}
.cell.r{border-left:1px solid var(--line)}
.cell.void{background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.voidm{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);border:1px dashed var(--line-2);
  padding:2px 8px;border-radius:var(--r)}
/* 위임 미이행 행의 우측 — 비었다는 사실만 보여주면 "정렬이 놓친 것"과 구분이 안 된다 */
.cell.void.hint{flex-direction:column;gap:6px;background:var(--danger-wash);text-align:center}
.cell.void.hint .voidm{border-color:var(--danger-line);color:var(--danger-ink)}
.hintm{font-size:11px;line-height:1.7;color:var(--ink-2)}
.hintm b{font-weight:600;color:var(--ink)}
.ano{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-3);margin-right:6px}
.atl{font-size:12.5px;font-weight:600}
.atx{font-size:12px;line-height:1.85;margin-top:4px;word-break:keep-all;color:var(--ink-2)}
.atx.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.atx ins{background:var(--accent-wash);color:var(--accent-ink);text-decoration:underline;
  text-decoration-thickness:1.5px;text-underline-offset:2px;font-weight:600;padding:0 1px;border-radius:var(--r)}
.atx del{background:var(--danger-wash);color:var(--danger-ink);text-decoration:line-through;
  text-decoration-thickness:1.5px;font-weight:600;padding:0 1px;border-radius:var(--r)}
.gut{border-bottom:1px solid var(--line);background:var(--surface-2);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.gut .sym{font-size:12px;font-weight:700;line-height:1}
.gut.s-edited .sym{color:var(--warn)}
.gut.s-inserted .sym{color:var(--accent)}
.gut.s-deleted .sym{color:var(--danger)}
.gut.s-moved .sym{color:var(--ink-3)}
.gut.s-same .sym{opacity:.3}
.gut.s-unmet{background:var(--danger-wash)}
.gut.s-unmet .sym{color:var(--danger)}
.cell.is-track{background:var(--warn-wash);box-shadow:inset 0 1px 0 var(--warn-line),inset 0 -1px 0 var(--warn-line)}
.gut.is-track{background:var(--warn);color:#fff}
.gut.is-track .sym{color:#fff}
#ruler{position:absolute;left:0;right:0;border-top:1px solid var(--warn);opacity:.5;
  pointer-events:none;z-index:3;display:none}
#ruler.on{display:block}
.fold{grid-column:1/-1;border-bottom:1px solid var(--line);background:var(--surface-2)}
.fold button{all:unset;cursor:pointer;display:flex;gap:8px;width:100%;padding:5px 12px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.fold button:hover{background:var(--sheet);color:var(--accent)}
/* 접기 밴드와 같은 자리를 쓰지만 반대 역할 — 감추는 게 아니라 끌어올린 것이다 */
.fold.pin{background:var(--danger-wash);border-bottom:1px solid var(--danger-line)}
.fold.pin button{cursor:default;color:var(--danger-ink);font-weight:600}
.fold.pin button:hover{background:none;color:var(--danger-ink)}

/* 우: 인스펙터 */
.insp{width:250px;flex:none;background:var(--sheet);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.itabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.itabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 0;font-size:11.5px;
  color:var(--ink-3);border-bottom:2px solid transparent}
.itabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.ibody{flex:1;overflow-y:auto;padding:11px 12px 18px}
.ih{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;color:var(--ink-3);margin-bottom:7px}
.iempty{font-size:11.5px;color:var(--ink-3);line-height:1.65}
.lt{font-size:12.5px;font-weight:600;margin-bottom:8px;line-height:1.4}
.ls{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px}
.ls .v{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);width:26px;flex:none}
.ls .lb{font-family:var(--mono);font-size:10.5px;width:58px;flex:none}
.ls .bar{height:3px;flex:1;background:var(--line);border-radius:2px;position:relative}
.ls .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.ls.chg .lb{color:var(--warn-ink)}
.ls.gone{opacity:.45} .ls.gone .lb{color:var(--danger);text-decoration:line-through}
.ls.born .lb{color:var(--accent)}
/* 문서 점검 탭 */
.ck{margin-bottom:11px}
.ckh{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:600;
  padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:5px}
.ckn{font-family:var(--mono);font-size:10px;color:var(--ink-3);background:var(--surface-2);
  border-radius:var(--r);padding:1px 6px}
.ck.bad .ckh{color:var(--danger-ink)} .ck.bad .ckn{background:var(--danger-wash);color:var(--danger-ink)}
.cki{font-size:11px;line-height:1.6;padding:4px 0;border-bottom:1px dotted var(--line)}
.cki:last-child{border-bottom:0}
.cki b{font-family:var(--mono);font-size:10px;margin-right:5px;color:var(--ink-3)}
.cki span{display:block;color:var(--ink-3);word-break:keep-all}
.cki.ok{color:var(--ink-3)}
.mrow{border:1px solid var(--line);border-radius:var(--r-md);padding:7px 8px;margin-bottom:6px;
  background:var(--paper)}
.mrow .mt{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-bottom:4px}
.mpick{display:flex;gap:4px}
.mpick button{all:unset;cursor:pointer;flex:1;text-align:center;padding:3px 0;font-size:10.5px;
  border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink-3)}
.mpick button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{font-size:10.5px;color:var(--ink-3);line-height:1.6;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--line)}

/* 상태바 */
.status{flex:none;background:var(--sheet);border-top:1px solid var(--line);padding:5px 14px;
  display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:10.5px;
  color:var(--ink-3);min-height:26px}
.status .live{color:var(--ink)}
.status .src{margin-left:auto;font-family:var(--font);font-size:10px;opacity:.7;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}

/* 모달 */
.mask{position:fixed;inset:0;background:rgba(20,24,22,.45);display:none;
  align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.modal{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);width:min(680px,92vw);max-height:86vh;display:flex;flex-direction:column}
.modal h2{margin:0;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.modal .mb{padding:14px 16px;overflow-y:auto;flex:1}
.modal .mf{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end}
.modal textarea{width:100%;min-height:230px;font-family:var(--mono);font-size:11.5px;line-height:1.6;
  border:1px solid var(--line-2);border-radius:var(--r-md);padding:9px;background:var(--surface-2);
  color:var(--ink);resize:vertical}
.modal input[type=text]{font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line-2);
  border-radius:var(--r-md);background:var(--surface-2);color:var(--ink);width:100%}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
.cmp{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
.cmp td{word-break:keep-all;overflow-wrap:anywhere}
.cmp th{background:#1F3A5F;color:#fff;padding:5px 7px;text-align:left;font-weight:600;font-size:10.5px}
.cmp td{border:1px solid var(--line-2);padding:5px 7px;vertical-align:top;line-height:1.6}
.cmp td.o{background:var(--danger-wash)} .cmp td.n{background:var(--accent-wash)}
.cmp td.w{background:var(--warn-wash)}
.cmp .no{font-family:var(--mono);font-size:10px;white-space:nowrap}
@media(max-width:1100px){.insp{display:none}}
@media(max-width:860px){.rail{display:none}}
</style>
<div class="app">
  <div class="top">
    <div class="brand"><b>diffcheck</b><span class="pill">OFFLINE · 로컬 처리</span></div>
    <div class="seg" id="sets"></div>
    <div class="seg" id="seg"></div>
    <div class="tally" id="tally"></div>
    <div class="acc" id="acc"></div>
  </div>

  <div class="body">
    <aside class="rail">
      <div class="rail-h"><span>버전 타임라인</span><span id="vcount"></span></div>
      <div class="vlist" id="vlist"></div>
      <div class="rail-f">
        <div class="dz" id="dz">계약서 파일을 여기로<br>끌어다 놓으세요<br><span style="opacity:.7">.hwpx · .docx</span></div>
        <button class="btn" id="btnPaste">붙여넣기로 버전 추가</button>
        <button class="btn" id="btnCmp" disabled>대비표 만들기</button>
      </div>
    </aside>

    <div class="mid">
      <div class="dochead">
        <div class="l"><div class="nm" id="hl">–</div><div class="mt" id="hlm">–</div></div>
        <div></div>
        <div class="r"><div class="nm" id="hr">–</div><div class="mt" id="hrm">–</div></div>
      </div>
      <div class="scroll" id="scroll"><div id="ruler"></div><div class="grid" id="grid"></div></div>
    </div>

    <aside class="insp">
      <div class="itabs">
        <button id="tabHist" aria-selected="true">조항 이력</button>
        <button id="tabCheck" aria-selected="false">문서 점검</button>
        <button id="tabMerge" aria-selected="false">검토본 만들기</button>
      </div>
      <div class="ibody" id="ibody"></div>
    </aside>
  </div>

  <div class="status">
    <span class="live" id="stLive">조문 위에 마우스를 올리면 좌·우가 동시에 추적됩니다</span>
    <span id="stSep"></span><span id="stDet"></span>
    <span class="src" id="src"></span>
  </div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
const DATA = {"sets": [{"id": "dogeup", "name": "공사도급계약서 · 협상 4회차", "mode": "version", "source": "국가법령정보센터 공개 「민간건설공사 표준도급계약서」 일반조건", "versions": [{"id": "v0", "label": "표준계약서 원안", "short": "원안", "date": "2026-01-15", "actor": "발주처", "articles": [{"uid": "a1", "label": "제1조", "title": "총칙", "text": "\"도급인\"과 \"수급인\"은 대등한 입장에서 서로 협력하여 신의에 따라 성실히 계약을 이행한다."}, {"uid": "a2", "label": "제2조", "title": "정의", "text": "이 조건에서 사용하는 용어의 정의는 다음과 같다 1. \"도급인\"이라 함은 건설공사를 건설업자에게 도급하는 자를 말한다. 2. \"도급\"이라 함은 당사자 일방이 건설공사를 완성할 것으로 약정하고, 상대 방이 그 일의 결과에 대하여 대가를 지급할 것을 약정하는 계약을 말한다. 3. \"수급인\"이라 함은 \"도급인\"으로부터 건설공사를 도급받는 건설업자를 말한다. 4. \"하도급\"이라 함은 도급받은 건설공사의 전부 또는 일부를 다시 도급하기 위하여 \"수급인\"이 제3자와 체결하는 계약을 말한다. 5. \"하수급인\"이라 함은 \"수급인\"으로부터 건설공사를 하도급받은 자를 말한다. 6. \"설계서\"라 함은 공사시방서, 설계도면(물량내역서를 작성한 경우 이를 포함 한다) 및 현장설명서를 말한다. 7. \"물량내역서\"라 함은 공종별 목적물을 구성하는 품목 또는 비목과 동 품목 또는 비목의 규격ㆍ수량ㆍ단위 등이 표시된 내역서를 말한다. 8. \"산출내역서\"라 함은 물량내역서에 \"수급인\"이 단가를 기재하여 \"도급인\"에 게 제출한 내역서를 말한다"}, {"uid": "a3", "label": "제3조", "title": "계약문서", "text": "① 계약문서는 민간건설공사 도급계약서, 민간건설공사 도급계 약 일반조건, 공사계약특수조건, 설계서 및 산출내역서로 구성되며, 상호 보완 의 효력을 가진다. ② 이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서 등은 계약문 서로서의 효력을 가진다. ③이 계약조건 외에 당사자 일방에게 현저하게 불공정한 경우로서 다음 각 호 의 어느 하나에 해당하는 특약은 그 부분에 한하여 무효로 한다. 1. 계약체결 이후 설계변경, 경제상황의 변동에 따라 발생하는 계약금액의 변경 을 상당한 이유 없이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특 약 2. 계약체결 이후 공사내용의 변경에 따른 계약기간의 변경을 상당한 이유 없 이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특약 3. 본 계약의 형태와 공사내용 등 제반사정에 비추어 계약체결 당시 예상하기 어려운 내용에 대하여 상대방에게 책임을 전가하는 특약 4. 계약내용에 대하여 구체적인 정함이 없거나 당사자 간 이견이 있을 경우 그 처리방법 등을 일방의 의사에 따르도록 함으로써 상대방의 정당한 이익을 침해 하는 특약 5. 계약불이행에 따른 당사자의 손해배상책임을 과도하게 경감하거나 가중하여 정함으로써 상대방의 정당한 이익을 침해하는 특약 6. 「민법」 등 관계 법령에서 인정하고 있는 상대방의 권리를 상당한 이유 없 이 배제하거나 제한하는 특약 ④ 계약문서 작성에 따른 인지세는 각 50%씩 수급인과 도급인이 부담한다. 다 만, 도급인과 공동수급체가 체결하는 공동계약의 경우는 공동 수급체의 구성원 간의 계약액의 지분율에 따라 부담한다."}, {"uid": "a4", "label": "제4조", "title": "계약보증금 등", "text": "① \"수급인\"은 계약상의 의무이행을 보증하기 위해 계약서 에서 정한 계약보증금을 계약체결전까지 \"도급인\"에게 현금 등으로 납부하여야 한다. 다만, \"도급인\"과 \"수급인\"이 합의에 의하여 계약보증금을 납부하지 아니 하기로 약정한 경우에는 그러하지 아니하다. ② 제1항의 계약보증금은 다음 각 호의 기관이 발행한 보증서로 납부할 수 있다. 1. 건설산업기본법 제54조 제1항의 규정에 의한 각 공제조합 발행 보증서 2. 보증보험회사, 신용보증기금 등 이와 동등한 기관이 발행하는 보증서 3. 금융기관의 지급보증서 또는 예금증서 4. 국채 또는 지방채 ③ \"수급인\"은 제21조부터 제23조의 규정에 의하여 계약금액이 증액된 경우에 는 이에 상응하는 금액의 보증금을 제1항 및 제2항의 규정에 따라 추가 납부하 여야 하며, 계약금액이 감액된 경우에는 \"도급인\"은 이에 상응하는 금액의 계약 보증금을 \"수급인\"에게 반환하여야 한다. ④ 제1항 또는 제3항에 따라 \"수급인\"이 계약의 이행을 보증하는 때에는 \"도급 인\"도 수급인에게 공사대금 지급의 보증 또는 담보를 제공하여야 한다. 다만, \" 도급인\"이 공사대금 지급보증 또는 담보 제공을 하기 곤란한 경우에는 \"수급인\" 이 그에 상응하는 보험 또는 공제에 가입할 수 있도록 계약의 이행 보증을 받 은 날부터 30일 이내에 보험료 또는 공제료(이하 \"보험료등\"이라 한다)를 지급 하여야 한다. ⑤ \"도급인\"이 제4항에 따른 공사대금의 지급보증, 담보의 제공 또는 보험료등 의 지급을 하지 아니한 때에는 \"수급인\"은 15일 이내 \"도급인\"에게 그 이행을 최고하고 공사의 시공을 중지할 수 있다."}, {"uid": "a5", "label": "제5조", "title": "계약보증금의 처리", "text": "① 제34조제1항 각 호의 사유로 계약이 해제 또는 해 지된 경우 제4조의 규정에 의하여 납부된 계약보증금은 \"도급인\"에게 귀속한다. 이 경우 계약의 해제 또는 해지에 따른 손해배상액이 계약보증금을 초과한 경 우에는 그 초과분에 대한 손해배상을 청구할 수 있다. ② \"도급인\"은 제35조제1항 각 호의 사유로 계약이 해제 또는 해지되거나 계약 의 이행이 완료된 때에는 제4조의 규정에 의하여 납부된 계약보증금을 지체없 이 \"수급인\"에게 반환하여야 한다."}, {"uid": "a6", "label": "제6조", "title": "공사감독원", "text": "① \"도급인\"은 계약의 적정한 이행을 확보하기 위하여 스스로 이를 감독하거나 자신을 대리하여 다음 각 호의 사항을 행하는 자(이하 ‘공사 감독원’이라 한다)를 선임할 수 있다. 1. 시공일반에 대하여 감독하고 입회하는 일 2. 계약이행에 있어서 \"수급인\"에 대한 지시ㆍ승낙 또는 협의하는 일 3. 공사의 재료와 시공에 대한 검사 또는 시험에 입회하는 일 4. 공사의 기성부분 검사, 준공검사 또는 공사목적물의 인도에 입회하는 일 5. 기타 공사감독에 관하여 \"도급인\"이 위임하는 일 ② \"도급인\"은 제1항의 규정에 의하여 공사감독원을 선임한 때에는 그 사실을 즉시 \"수급인\"에게 통지하여야 한다. ③ \"수급인\"은 공사감독원의 감독 또는 지시사항이 공사수행에 현저히 부당하 다고 인정할 때에는 \"도급인\"에게 그 사유를 명시하여 필요한 조치를 요구할 수 있다."}, {"uid": "a7", "label": "제7조", "title": "현장대리인의 배치", "text": "① \"수급인\"은 착공전에 건설산업기본법령에서 정한 바에 따라 당해공사의 주된 공종에 상응하는 건설기술자를 현장에 배치하고, 그중 1인을 현장대리인으로 선임한 후 \"도급인\"에게 통지하여야 한다. ② 제1항의 현장대리인은 법령의 규정 또는 \"도급인\"이 동의한 경우를 제외하고 는 현장에 상주하여 시공에 관한 일체의 사항에 대하여 \"수급인\"을 대리하며, 도급받은 공사의 시공관리 기타 기술상의 관리를 담당한다."}, {"uid": "a8", "label": "제8조", "title": "공사현장 근로자", "text": "① \"수급인\"은 해당 공사의 시공 또는 관리에 필요한 기 술과 인력을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 사용자로 서의 모든 책임을 진다. ② \"수급인\"이 채용한 근로자에 대하여 \"도급인\"이 해당 계약의 시공 또는 관리 상 현저히 부적당하다고 인정하여 교체를 요구한 때에는 정당한 사유가 없는 한 즉시 교체하여야 한다. ③ \"수급인\"은 제2항에 의하여 교체된 근로자를 \"도급인\"의 동의 없이 해당 공 사를 위해 다시 채용할 수 없다."}, {"uid": "a9", "label": "제9조", "title": "착공신고 및 공정보고", "text": "① \"수급인\"은 계약서에서 정한 바에 따라 착공하 여야 하며, 착공 시에는 다음 각 호의 서류가 포함된 착공신고서를 \"도급인\"에 게 제출하여야 한다. 1. 건설산업기본법령에 의하여 배치하는 건설기술자 지정서 2. 공사예정공정표 3. 공사비 산출내역서 (단, 계약체결시 산출내역서를 제출하고 계약금액을 정 한 경우를 제외한다) 4. 공정별 인력 및 장비 투입 계획서 5. 기타 \"도급인\"이 지정한 사항 ② \"수급인\"은 계약의 이행중에 제1항의 규정에 의하여 제출한 서류의 변경이 필요한 때에는 관련서류를 변경하여 제출하여야 한다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 제출된 서류의 내용을 조정할 필요가 있다고 인정하는 때에는 \"수급인\"에게 이의 조정을 요구할 수 있다. ④ \"도급인\"은 \"수급인\"이 월별로 수행한 공사에 대하여 다음 각 호의 사항을 명백히 하여 익월 14일까지 제출하도록 요청할 수 있으며, \"수급인\"은 이에 응 하여야 한다. 1. 월별 공정률 및 수행공사금액 2. 인력ㆍ장비 및 자재현황 3. 계약사항의 변경 및 계약금액의 조정내용"}, {"uid": "a10", "label": "제10조", "title": "공사기간", "text": "① 공사착공일과 준공일은 계약서에 명시된 일자로 한다. ② \"수급인\"의 귀책사유 없이 공사착공일에 착공할 수 없는 경우에는 \"수급인\" 의 현장인수일자를 착공일로 하며, 이 경우 \"수급인\"은 공사기간의 연장을 요구 할 수 있다. ③ 준공일은 \"수급인\"이 건설공사를 완성하고 \"도급인\"에게 서면으로 준공검사 를 요청한 날을 말한다. 다만, 제27조의 규정에 의하여 준공검사에 합격한 경우 에 한 한다."}, {"uid": "a11", "label": "제11조", "title": "선금", "text": "① \"도급인\"은 계약서에서 정한 바에 따라 \"수급인\"에게 선금을 지 급하여야 하며, \"도급인\"이 선금 지급시 보증서 제출을 요구하는 경우 \"수급인\" 은 제4조 제2항 각 호의 보증기관이 발행한 보증서를 제출하여야 한다. ② 제1항에 의한 선금지급은 \"수급인\"의 청구를 받은 날부터 14일이내에 지급 하여야 한다. 다만, 자금사정등 불가피한 사유로 인하여 지급이 불가능한 경우 그 사유 및 지급시기를 \"수급인\"에게 서면으로 통지한 때에는 그러하지 아니하 다. ③ \"수급인\"은 선금을 계약목적달성을 위한 용도이외의 타 목적에 사용할 수 없으며, 노임지급 및 자재확보에 우선 사용하여야 한다. ④ 선금은 기성부분에 대한 대가를 지급할 때마다 다음 방식에 의하여 산출한 금액을 정산한다. 기성부분의 대가 선금정산액＝선금액×  계약금액 ⑤ \"도급인\"은 선금을 지급한 경우 다음 각 호의 1에 해당하는 경우에는 당해 선금잔액에 대하여 반환을 청구할 수 있다. 1. 계약을 해제 또는 해지하는 경우 2. 선금지급조건을 위반한 경우 ⑥ \"도급인\"은 제5항의 규정에 의한 반환청구시 기성부분에 대한 미지급금액이 있는 경우에는 선금잔액을 그 미지급금액에 우선적으로 충당하여야 한다."}, {"uid": "a12", "label": "제12조", "title": "자재의 검사 등", "text": "① 공사에 사용할 재료는 신품이어야 하며, 품질ㆍ품명 등은 설계도서와 일치하여야 한다. 다만, 설계도서에 품질ㆍ품명 등이 명확히 규정되지 아니한 것은 표준품 또는 표준품에 상당하는 재료로서 계약의 목적을 달성하는데 가장 적합한 것이어야 한다. ② 공사에 사용할 자재중에서 \"도급인\"이 품목을 지정하여 검사를 요구하는 경 우에는 \"수급인\"은 사용전에 \"도급인\"의 검사를 받아야 하며, 설계도서와 상이 하거나 품질이 현저히 저하되어 불합격된 자재는 즉시 대체하여 다시 검사를 받아야 한다. ③ 제2항의 검사에 이의가 있을 경우 \"수급인\"은 \"도급인\"에게 재검사를 요구할 수 있으며, 재검사가 필요하다고 인정되는 경우 \"도급인\"은 지체없이 재검사하 도록 조치하여야 한다. ④ \"수급인\"은 자재의 검사에 소요되는 비용을 부담하여야 하며, 검사 또는 재 검사 등을 이유로 계약기간의 연장을 요구할 수 없다. 다만, 제3항의 규정에 의 하여 재검사 결과 적합한 자재인 것으로 판명될 경우에는 재검사에 소요된 기 간에 대하여는 계약기간을 연장할 수 있다. ⑤ 공사에 사용하는 자재중 조립 또는 시험을 요하는 것은 \"도급인\"의 입회하 에 그 조립 또는 시험을 하여야 한다. ⑥ 수중 또는 지하에서 행하여지는 공사나 준공후 외부에서 확인할 수 없는 공 사는 \"도급인\"의 참여없이 시행할 수 없다. 다만, 사전에 \"도급인\"의 서면승인을 받고 사진, 비디오 등으로 시공방법을 확인할 수 있는 경우에는 시행할 수 있 다. ⑦ \"수급인\"은 공사수행과 관련하여 필요한 경우 \"도급인\"에게 입회를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다."}, {"uid": "a13", "label": "제13조", "title": "지급자재와 대여품", "text": "① 계약에 의하여 \"도급인\"이 지급하는 자재와 대여 품은 공사예정공정표에 의한 공사일정에 지장이 없도록 적기에 인도되어야 하 며, 그 인도장소는 시방서 등에 따로 정한 바가 없으면 공사현장으로 한다. ② 제1항의 규정에 의하여 지급된 자재의 소유권은 \"도급인\"에게 있으며, \"수급 인\"은 \"도급인\"의 서면승낙없이 현장 외부로 반출하여서는 아니된다. ③ 제1항의 규정에 의하여 인도된 지급자재와 대여품에 대한 관리상의 책임은 \"수급인\"에게 있으며, \"수급인\"이 이를 멸실 또는 훼손하였을 경우에는 \"도급인\" 에게 변상하여야 한다. ④ \"수급인\"은 지급자재 및 대여품의 품질 또는 규격이 시공에 적당하지 아니 하다고 인정할 때에는 즉시 \"도급인\"에게 이를 통지하고 그 대체를 요구할 수 있다. ⑤ 자재 등의 지급지연으로 공사가 지연될 우려가 있을 때에는 \"수급인\"은 \"도 급인\"의 서면승낙을 얻어 자기가 보유한 자재를 대체 사용할 수 있다. 이 경 우 \"도급인\"은 대체 사용한 자재 등을 \"수급인\"과 합의된 일시 및 장소에서 현 품으로 반환하거나 대체사용당시의 가격을 지체없이 \"수급인\"에게 지급하여야 한다. ⑥ \"수급인\"은 \"도급인\"이 지급한 자재와 기계ㆍ기구 등 대여품을 선량한 관리 자의 주의로 관리하여야 하며, 계약의 목적을 수행하는 데에만 사용하여야 한 다. ⑦ \"수급인\"은 공사내용의 변경으로 인하여 필요없게 된 지급자재 또는 사용완 료된 대여품을 지체없이 \"도급인\"에게 반환하여야 한다."}, {"uid": "a14", "label": "제14조", "title": "안전관리 및 재해보상", "text": "① \"수급인\"은 산업재해를 예방하기 위하여 안전 시설의 설치 및 보험의 가입 등 적정한 조치를 하여야 하며, 이를 위해 \"도급 인\"은 계약금액에 「건설기술진흥법」에 따른 안전관리비와 「산업안전보건 법」에 따른 산업안전보건관리비 및 산업재해보상 보험료 등 관계 법령에서 규 정하는 법정경비의 상당액을 계상하여야 한다. ② 공사현장에서 발생한 산업재해에 대한 책임은 \"수급인\"에게 있다. 다만, 설 계상의 하자 또는 \"도급인\"의 요구에 의한 작업으로 재해가 발생한 경우에는 \" 도급인\"에 대하여 구상권을 행사할 수 있다."}, {"uid": "a15", "label": "제15조", "title": "건설근로자의 보호", "text": "① \"수급인\"은 도급받은 공사가 건설산업기본법, 임 금채권보장법, 고용보험법, 국민연금법, 국민건강보험법 및 노인장기요양보험법 에 의하여 의무가입대상인 경우에는 퇴직공제, 임금채권보장제도, 고용보험, 국 민연금, 건강보험 및 노인장기요양보험에 가입하여야 한다. 다만, \"수급인\"이 도 급받은 공사를 하도급한 경우로서 하수급인이 고용한 근로자에 대하여 고용보 험, 국민연금, 건강보험 및 노인장기요양보험에 가입한 경우에는 그러하지 아니 하다. ② \"도급인\"은 제1항의 건설근로자퇴직공제부금, 임금채권보장제도에 따른 사업 주부담금, 고용보험료, 국민연금보험료, 국민건강보험료 및 노인장기요양보험료 를 계약금액에 계상하여야 한다."}, {"uid": "a16", "label": "제16조", "title": "응급조치", "text": "① \"수급인\"은 재해방지를 위하여 특히 필요하다고 인정될 때 에는 미리 긴급조치를 취하고 즉시 이를 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 재해방지 기타 공사의 시공상 부득이하다고 인정할 때에는 \"수 급인\"에게 긴급조치를 요구할 수 있다. 이 경우 \"수급인\"은 즉시 이에 응하여야 하며, \"수급인\"이 \"도급인\"의 요구에 응하지 않는 경우 \"도급인\"은 제3자로 하여 금 필요한 조치를 하게 할 수 있다. ③ 제1항 및 제2항의 응급조치에 소요된 경비는 실비를 기준으로 \"도급인\"과 \" 수급인\"이 협의하여 부담한다."}, {"uid": "a17", "label": "제17조", "title": "공사기간의 연장", "text": "① \"수급인\" 은 다음 각 호의 사유로 인해 계약이행이 현저히 어려운 경우 등 \"수급인\" 의 책임이 아닌 사유로 공사수행이 지연되는 경우 서면으로 공사기간의 연장을 \"도급인\" 에게 요구할 수 있다. 1. \"도급인\" 의 책임있는 사유 2. 태풍ㆍ홍수ㆍ폭염ㆍ한파ㆍ악천후ㆍ미세먼지 발현ㆍ전쟁ㆍ사변ㆍ지진ㆍ전염병 ㆍ폭동 등 불가항력의 사태(이하 \"불가항력\"이라고 한다.) 3. 원자재 수급불균형 4. 근로시간단축 등 법령의 제ㆍ개정 ② \"도급인\"은 제1항의 규정에 의한 계약기간 연장의 요구가 있는 경우 즉시 그 사실을 조사ㆍ확인하고 공사가 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다. ③ 제1항의 규정에 의거 공사기간이 연장되는 경우 이에 따르는 현장관리비 등 추가경비는 제23조의 규정을 적용하여 조정한다. ④ \"도급인\"은 제1항의 계약기간의 연장을 승인하였을 경우 동 연장기간에 대 하여는 지체상금을 부과하여서는 아니된다."}, {"uid": "a18", "label": "제18조", "title": "부적합한 공사", "text": "① \"도급인\"은 \"수급인\"이 시공한 공사중 설계서에 적합 하지 아니한 부분이 있을 때에는 이의 시정을 요구할 수 있으며, \"수급인\"은 지 체없이 이에 응하여야 한다. 이 경우 \"수급인\"은 계약금액의 증액 또는 공기의 연장을 요청할 수 없다. ② 제1항의 경우 설계서에 적합하지 아니한 공사가 \"도급인\"의 요구 또는 지시 에 의하거나 기타 \"수급인\"의 책임으로 돌릴 수 없는 사유로 인한 때에는 \"수 급인\"은 그 책임을 지지 아니한다."}, {"uid": "a19", "label": "제19조", "title": "불가항력에 의한 손해", "text": "① \"수급인\"은 검사를 마친 기성부분 또는 지급자 재와 대여품에 대하여 불가항력에 의한 손해가 발생한 때에는 즉시 그 사실을 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 제1항의 통지를 받은 경우 즉시 그 사실을 조사ㆍ확인하고 그 손해의 부담에 있어서 기성검사를 필한 부분 및 검사를 필하지 아니한 부분 중 객관적인 자료(감독일지, 사진 또는 비디오테잎 등)에 의하여 이미 수행되었음 이 판명된 부분은 \"도급인\"이 부담하고, 기타 부분은 \"도급인\"과 \"수급인\"이 협 의하여 결정한다. ③ 제2항의 협의가 성립되지 않은 때에는 제41조의 규정에 의한다."}, {"uid": "a20", "label": "제20조", "title": "공사의 변경ㆍ중지", "text": "① \"도급인\"이 설계변경 등에 의하여 공사내용을 변 경ㆍ추가하거나 공사의 전부 또는 일부에 대한 시공을 일시 중지할 경우에는 변경계약서 등을 사전에 \"수급인\"에게 교부하여야 한다. ② \"도급인\"이 제1항에 따른 공사내용의 변경ㆍ추가 관련 서류를 교부하지 아 니한 때에는 \"수급인\"은 \"도급인\"에게 도급받은 공사 내용의 변경ㆍ추가에 관한 사항을 서면으로 통지하여 확인을 요청할 수 있다. 이 경우 \"수급인\"의 요청에 대하여 \"도급인\"은 15일 이내에 그 내용에 대한 인정 또는 부인의 의사를 서면 으로 회신하여야 하며, 이 기간내에 회신하지 아니한 경우에는 원래 \"수급인\"이 통지한 내용대로 공사내용의 변경ㆍ추가된 것으로 본다. 다만, 불가항력으로 인 하여 회신이 불가능한 경우에는 제외한다. ③ \"도급인\"의 지시에 의하여 \"수급인\"이 추가로 시공한 공사물량에 대하여서는 공사비를 증액하여 지급하여야 한다. ④ \"수급인\"은 동 계약서에 규정된 계약금액의 조정사유 이외의 계약체결 후 계약조건의 미숙지, 덤핑수주 등을 이유로 계약금액의 변경을 요구하거나 시공 을 거부할 수 없다."}, {"uid": "a21", "label": "제21조", "title": "설계변경으로 인한 계약금액의 조정", "text": "① 설계서의 내용이 공사현장의 상 태와 일치하지 않거나 불분명, 누락, 오류가 있을 때 또는 시공에 관하여 예기 하지 못한 상태가 발생되거나 안전사고의 우려, 사업계획의 변경 등으로 인하 여 추가 시설물(가설구조물을 포함)의 설치가 필요한 때에는 \"도급인\"은 설계를 변경하여야 한다. ② 제1항의 설계변경으로 인하여 공사량의 증감이 발생한 때에는 다음 각 호의 기준에 의하여 계약금액을 조정하며, 필요한 경우 공사기간을 연장하거나 단축 한다. 1. 증감된 공사의 단가는 제9조의 규정에 의한 산출내역서상의 단가를 기준으 로 상호 협의하여 결정한다. 2. 산출내역서에 포함되어 있지 아니한 신규비목의 단가는 설계변경 당시를 기준으로 산정한 단가로 한다. 3. 증감된 공사에 대한 일반관리비 및 이윤 등은 산출내역서상의 율을 적용한다."}, {"uid": "a22", "label": "제22조", "title": "물가변동으로 인한 계약금액의 조정", "text": "① 계약체결 후 90일 이상 경과한 경우에 잔여공사에 대하여 산출내역서에 포함되어 있는 품목 또는 비목, 비목 군 및 지수 등의 변동으로 인한 등락액이 잔여공사에 해당하는 계약금액의 100 분의3 이상인 때에는 계약금액을 조정한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 곤란하다고 인정되는 경우에는 계약체결일(계약체결 후 계 약금액을 조정한 경우 그 조정사유가 발생한 날(이하 \"조정기준일\"이라 한다)을 말하며, 이하 같다)로부터 90일이내에도 계약금액을 조정할 수 있다. ② 제1항의 규정에 의하여 계약금액을 조정할 때에는 국가를 당사자로 하는 계 약에 관한 법률 시행규칙 제74조에 따라 산출된 품목조정률 또는 지수조정률을 활용한다. ③ 제1항의 규정에도 불구하고 해당공사비를 구성하는 재료비, 노무비, 경비 합 계액의 100분의 1을 초과하는 자재의 가격이 계약체결일로부터 100분의 15 이 상 증감된 경우에는 \"도급인\"과 \"수급인\"이 합의하여 계약금액을 조정할 수 있 다. ④ 제1항 및 제3항의 규정에 의한 계약금액의 조정에 있어서 그 조정금액은 계 약금액 중 조정기준일 이후에 이행되는 부분의 대가(이하 \"물가변동적용대가\" 라 한다)에 품목조정률 또는 지수조정률을 곱하여 산출하되, 조정기준일 이전 에 이미 계약이행이 완료되어야 할 부분에 대하여는 적용하지 아니한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 지연된 경우에는 그러하지 아니 하다. ⑤ 선금을 지급한 것이 있는 때에는 제1항, 제3항, 제4항의 규정에 의하여 산출 된 증가액에서 다음 산식으로 산출한 금액을 공제한다. 공제금액=물가변동적용대가×(품목조정률 또는 지수조정률)×선금급률 ⑥ 제1항의 규정에 의하여 조정된 계약금액은 직전의 물가변동으로 인하여 계 약금액 조정기준일부터 60일 이내에는 이를 다시 조정할 수 없다. ⑦ 수급인은 제1항 및 제3항의 규정에 의하여 계약금액 조정을 청구하는 경우 에는 계약금액조정내역서를 첨부하여야 하며, 도급인은 청구를 받은 날부터 30 일 이내에 계약금액을 조정하여야 한다. 다만, 도급인이 자금사정 등 불가피한 경우에는 수급인과 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 증 액할 수 있는 자금이 없는 때에"}, {"uid": "a23", "label": "제23조", "title": "주요 원자재 가격변동에 따른 계약금액의 연동", "text": "도급인과 수급인은 「대ㆍ중소기업 상생협력 촉진에 관한 법률」제21조에 따라 주요 원재료의 가격변동에 따른 계약금액 연동과 관련하여 중소벤처기업부에서 권장하는 표준약정서를 작성하여 첨부하여야 한다. 다만, 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니할 수 있다. 1. 도급인이 「중소기업기본법」제2조 제2항에 따른 소기업에 해당하는 경우 2. 계약기간이 90일 이내의 범위에서 관계 법령으로 정하는 기간 이내인 경우 3. 계약금액이 1억원 이하의 범위에서 관계 법령으로 정하는 금액 이하인 경우 4. 도급인과 수급인이 계약금액 연동을 하지 아니하기로 합의한 경우. 이 경우 도급인과 수급인은 그 취지와 사유를 도급계약서에 기재하여야 한다."}, {"uid": "a24", "label": "제24조", "title": "기타 계약내용의 변동으로 인한 계약금액의 조정", "text": "① 제21조부터 제22조 의2에 의한 경우 이외에 다음 각 호에 의해 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 계약금액을 조정하며, 이 경우 증감된 공사에 대한 일반관리비 및 이율 등은 산출내역서상의 율을 적용한다. 1. 계약내용의 변경 2. 불가항력에 따른 공사기간의 연장 3. 근로시간 단축, 근로자 사회보험료 적용범위 확대 등 공사비, 공사기간에 영향을 미치는 법령의 제ㆍ개정 ② 제1항과 관련하여 \"수급인\"은 제21조부터 제22조2에 규정된 계약금액 조정 사유 이외에 계약체결후 계약조건의 미숙지 등을 이유로 계약금액의 변경을 요 구하거나 시공을 거부할 수 없다."}, {"uid": "a25", "label": "제25조", "title": "기성부분금", "text": "① 계약서에 기성부분금에 관하여 명시한 때에는 \"수급인\"은 이에 따라 기성부분에 대한 검사를 요청할 수 있으며, 이때 \"도급인\"은 지체없 이 검사를 하고 그 결과를 \"수급인\"에게 통지하여야 하며, 14일이내에 통지가 없는 경우에는 검사에 합격한 것으로 본다. ② 기성부분은 제2조 제8호의 산출내역서의 단가에 의하여 산정한다. 다만, 산 출내역서가 없는 경우에는 공사진척율에 따라 \"도급인\"과 \"수급인\"이 합의하여 산정한다. ③ \"도급인\"은 검사완료일로부터 14일이내에 검사된 내용에 따라 기성부분금을 \"수급인\"에게 지급하여야 한다. ④ \"도급인\"이 제3항의 규정에 의한 기성부분금의 지급을 지연하는 경우에는 제28조제3항의 규정을 준용한다."}, {"uid": "a26", "label": "제26조", "title": "손해의 부담", "text": "\"도급인\"ㆍ\"수급인\" 쌍방의 책임 없는 사유로 공사의 목적 물이나 제3자에게 손해가 생긴 경우 다음 각 호의 자가 손해를 부담한다. 1. 목적물이 \"도급인\"에게 인도되기 전에 발생된 손해: \"수급인\" 2. 목적물이 \"도급인\"에게 인도된 후에 발생된 손해: \"도급인\" 3. 목적물에 대한 \"도급인\"의 인수지연 중 발생된 손해: \"도급인\" 4. 목적물 검사기간 중 발생된 손해: \"도급인\"ㆍ\"수급인\"이 협의하여 결정"}, {"uid": "a27", "label": "제27조", "title": "부분사용", "text": "① \"도급인\"은 공사목적물의 인도전이라 하더라도 \"수급인\"의 동의를 얻어 공사목적물의 전부 또는 일부를 사용할 수 있다. ② 제1항의 경우 \"도급인\"은 그 사용부분에 대하여 선량한 관리자의 주의 의무 를 다하여야 한다. ③ \"도급인\"은 제1항에 의한 사용으로 \"수급인\"에게 손해를 끼치거나 \"수급인\" 의 비용을 증가하게 한 때는 그 손해를 배상하거나 증가된 비용을 부담한다."}, {"uid": "a28", "label": "제28조", "title": "준공검사", "text": "① \"수급인\"은 공사를 완성한 때에는 \"도급인\"에게 통지하여야 하며 \"도급인\"은 통지를 받은 후 지체없이 \"수급인\"의 입회하에 검사를 하여야 하며, \"도급인\"이 \"수급인\"의 통지를 받은 후 10일 이내에 검사결과를 통지하지 아니한 경우에는 10일이 경과한 날에 검사에 합격한 것으로 본다. 다만, 불가항 력으로 인하여 검사를 완료하지 못한 경우에는 당해 사유가 존속되는 기간과 당해 사유가 소멸된 날로부터 3일까지는 이를 연장할 수 있다. ② \"수급인\"은 제1항의 검사에 합격하지 못한 때에는 지체없이 이를 보수 또는 개조하여 다시 준공검사를 받아야 한다. ③ \"수급인\"은 검사의 결과에 이의가 있을 때에는 재검사를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다. ④ \"도급인\"은 제1항의 규정에 의한 검사에 합격한 후 \"수급인\"이 공사목적물의 인수를 요청하면 인수증명서를 발급하고 공사목적물을 인수하여야 한다."}, {"uid": "a29", "label": "제29조", "title": "대금지급", "text": "① \"수급인\"은 \"도급인\"의 준공검사에 합격한 후 즉시 잉여자 재, 폐기물, 가설물 등을 철거, 반출하는 등 공사현장을 정리하고 공사대금의 지급을 \"도급인\"에게 청구할 수 있다. ② \"도급인\"은 특약이 없는 한 계약의 목적물을 인도 받음과 동시에 \"수급인\"에 게 공사 대금을 지급하여야 한다. ③ \"도급인\"이 공사대금을 지급기한내에 지급하지 못하는 경우에는 그 미지급 금액에 대하여 지급기한의 다음날부터 지급하는 날까지의 일수에 계약서 상에 서 정한 대가지급 지연이자율(시중은행의 일반대출시 적용되는 연체이자율 수 준을 감안 하여 상향 적용할 수 있다)을 적용하여 산출한 이자를 가산하여 지 급하여야 한다."}, {"uid": "a30", "label": "제30조", "title": "폐기물의 처리 등", "text": "\"수급인\"은 공사현장에서 발생한 폐기물을 관계법령에 의거 처리하여야 하며, \"도급인\"은 폐기물처리에 소요되는 비용을 계약금액에 반영하여야 한다."}, {"uid": "a31", "label": "제31조", "title": "지체상금", "text": "① \"수급인\"은 준공기한내에 공사를 완성하지 아니한 때에는 매 지체일수마다 계약서상의 지체상금율을 계약금액에 곱하여 산출한 금액(이 하 ‘지체상금’이라 한다)을 \"도급인\"에게 납부하여야 한다. 다만, \"도급인\"의 귀 책사유로 준공검사가 지체된 경우와 다음 각 호의 1에 해당하는 사유로 공사가 지체된 경우에는 그 해당일수에 상당하는 지체상금을 지급하지 아니하여도 된 다. 1. 불가항력의 사유에 의한 경우 2. \"수급인\"이 대체하여 사용할 수 없는 중요한 자재의 공급이 \"도급인\"의 책 임있는 사유로 인해 지연되어 공사진행이 불가능하게 된 경우 3. \"도급인\"의 귀책사유로 착공이 지연되거나 시공이 중단된 경우 4. 기타 \"수급인\"의 책임에 속하지 아니하는 사유로 공사가 지체된 경우 ② 제1항을 적용함에 있어 제26조의 규정에 의하여 \"도급인\"이 공사목적물의 전부 또는 일부를 사용한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우 \"도급인\"이 인허가기관으로부터 공사목적물의 전부 또는 일 부에 대하여 사용승인을 받은 경우에는 사용승인을 받은 공사목적물의 해당부 분은 사용한 것으로 본다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 산출된 지체상금은 제28조의 규정에 의하여 \"수급인\"에게 지급되는 공사대금과 상계할 수 있다. ④제1항의 지체상금율은 계약 당사자간에 별도로 정한 바가 없는 경우에는 국 가를 당사자로 하는 계약에 관한 법령 등에 따라 공공공사 계약체결시 적용되 는 지체상금율을 따른다."}, {"uid": "a32", "label": "제32조", "title": "하자담보", "text": "① \"수급인\"은 공사의 하자보수를 보증하기 위하여 계약서에 정한 하자보수보증금율을 계약금액에 곱하여 산출한 금액(이하 ‘하자보수보증 금’이라 한다)을 준공검사후 그 공사의 대가를 지급할 때까지 현금 또는 제4조 제2항 각 호의 보증기관이 발행한 보증서로서 \"도급인\"에게 납부하여야 한다. ② \"수급인\"은 \"도급인\"이 전체목적물을 인수한 날과 준공검사를 완료한 날 중 에서 먼저 도래한 날부터 계약서에 정한 하자담보 책임기간중 당해공사에 발 생하는 일체의 하자를 보수하여야 한다. 다만, 다음 각 호의 사유로 발생한 하자에 대해서는 그러하지 아니하다. 1. 공사목적물의 인도 후에 천재지변 등 불가항력이 \"수급인\"의 책임이 아닌 사유로 인한 경우 2. \"도급인\"이 제공한 재료의 품질이나 규격 등의 기준미달로 인한 경우 3. \"도급인\"의 지시에 따라 시공한 경우 4. \"도급인\"이 건설공사의 목적물을 관계 법령에 따른 내구연한 또는 설계상의 구조내력을 초과하여 사용한 경우 ③ \"수급인\"이 \"도급인\"으로 부터 제2항의 규정에 의한 하자보수의 요구를 받고 이에 응하지 아니하는 경우 제1항의 규정에 의한 하자보수보증금은 \"도급인\"에 게 귀속한다. ④ \"도급인\"은 하자담보책임기간이 종료한 때에는 제1항의 규정에 의한 하자보 수 보증금을 \"수급인\"의 청구에 의하여 반환하여야 한다. 다만, 하자담보책임기 간이 서로 다른 공종이 복합된 공사에 있어서는 공종별 하자담보 책임기간이 만료된 공종의 하자보수보증금은 \"수급인\"의 청구가 있는 경우 즉시 반환하여 야 한다."}, {"uid": "a33", "label": "제33조", "title": "건설공사의 하도급 등", "text": "①\"수급인\"이 도급받은 공사를 제3자에게 하도급 하고자 하는 경우에는 건설산업기본법 및 하도급거래공정화에관한법률에서 정 한 바에 따라 하도급하여야 하며, 하수급인의 선정, 하도급계약의 체결 및 이 행, 하도급 대가의 지급에 있어 관계 법령의 제규정을 준수하여야 한다. ② \"도급인\"은 건설공사의 시공에 있어 현저히 부적당하다고 인정하는 하수급 인이 있는 경우에는 하도급의 통보를 받은 날 또는 그 사유가 있음을 안 날부 터 30일이내에 서면으로 그 사유를 명시하여 하수급인의 변경 또는 하도급 계 약내용의 변경을 요구할 수 있다. 이 경우 \"수급인\"은 정당한 사유가 없는 한 이에 응하여야 한다. ③ \"도급인\"은 제2항의 규정에 의하여 건설공사의 시공에 있어 현저히 부적당 한 하수급인이 있는지 여부를 판단하기 위하여 하수급인의 시공능력, 하도급 계약 금액의 적정성 등을 심사할 수 있다."}, {"uid": "a34", "label": "제34조", "title": "하도급대금의 직접 지급", "text": "① \"도급인\"은 \"수급인\"이 제32조의 규정에 의 하여 체결한 하도급계약중 하도급거래공정화에 관한법률과 건설산업기본법에서 정한 바에 따라 하도급대금의 직접 지급사유가 발생하는 경우에는 그 법에 따 라 하수급인이 시공한 부분에 해당하는 하도급대금을 하수급인에게 지급한다. ② \"도급인\"이 제1항의 규정에 의하여 하도급대금을 직접 지급한 경우에는 \"도 급인\"의 \"수급인\"에 대한 대금지급채무는 하수급인에게 지급한 한도안에서 소 멸한 것으로 본다."}, {"uid": "a35", "label": "제35조", "title": "\"도급인\"의 계약해제 등", "text": "① \"도급인\"은 다음 각 호의 1에 해당하는 경우 에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. \"수급인\"이 정당한 이유없이 약정한 착공기일을 경과하고도 공사에 착수하 지 아니한 경우 2. \"수급인\"의 책임있는 사유로 인하여 준공기일내에 공사를 완성할 가능성이 없음이 명백한 경우 3. 제30조제1항의 규정에 의한 지체상금이 계약보증금 상당액에 도달한 경우 로서 계약기간을 연장하여도 공사를 완공할 가능성이 없다고 판단되는 경우 4. 기타 \"수급인\"의 계약조건 위반으로 인하여 계약의 목적을 달성할 수 없다 고 인정되는 경우 ② 제1항의 규정에 의한 계약의 해제 또는 해지는 \"도급인\"이 \"수급인\"에게 서 면으로 계약의 이행기한을 정하여 통보한 후 기한내에 이행되지 아니한 때 계 약의 해제 또는 해지를 \"수급인\"에게 통지함으로써 효력이 발생한다. ③ \"수급인\"은 제2항의 규정에 의한 계약의 해제 또는 해지 통지를 받은 때에 는 다음 각 호의 사항을 이행하여야 한다. 1. 당해 공사를 지체없이 중지하고 모든 공사용 시설ㆍ장비 등을 공사현장으 로부터 철거하여야 한다. 2. 제13조의 규정에 의한 지급재료의 잔여분과 대여품은 \"도급인\"에게 반환하 여야 한다."}, {"uid": "a36", "label": "제36조", "title": "\"수급인\"의 계약해제 등", "text": "① \"수급인\"은 다음 각 호의 어느 하나에 해당 하는 경우에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. 공사내용을 변경함으로써 계약금액이 100분의 40이상 감소된 때 2. \"도급인\"의 책임있는 사유에 의한 공사의 정지기간이 계약서상의 공사기간 의 100분의 50을 초과한 때 3. \"도급인\"이 정당한 이유없이 계약내용을 이행하지 아니함으로써 공사의 적 정이행이 불가능하다고 명백히 인정되는 때 4. 제4조제5항에 따른 기간 내에 공사대금 지급의 보증, 담보의 제공 또는 보 험료 등의 지급을 이행하지 아니한 때 ② 제1항의 규정에 의하여 계약을 해제 또는 해지하는 경우에는 제34조제2항 및 제3항의 규정을 준용한다."}, {"uid": "a37", "label": "제37조", "title": "계약해지시의 처리", "text": "① 제34조 및 제35조의 규정에 의하여 계약이 해지 된 때에는 \"도급인\"과 \"수급인\"은 지체없이 기성부분의 공사금액을 정산하여야 한다. ② 제34조 및 제35조의 규정에 의한 계약의 해제 또는 해지로 인하여 손해가 발생한 때에는 상대방에게 그에 대한 배상을 청구할 수 있다. 다만, 제35조제1 항제4호에 해당하여 해지한 경우에는 해지에 따라 발생한 손해에 대하여 청구 할 수 없다."}, {"uid": "a38", "label": "제38조", "title": "\"수급인\"의 동시이행 항변권", "text": "① \"도급인\"이 계약조건에 의한 선금과 기 성부분금의 지급을 지연할 경우 \"수급인\"이 상당한 기한을 정하여 그 지급을 독촉하였음에도 불구하고 \"도급인\"이 이를 지급치 않을 때에는 \"수급인\"은 공사 중지기간을 정하여 \"도급인\"에게 통보하고 공사의 일부 또는 전부를 일시 중지 할 수 있다. ② 제1항의 공사중지에 따른 기간은 지체상금 산정시 공사기간에서 제외된다. ③ \"도급인\"은 제1항의 공사중지에 따른 비용을 \"수급인\"에게 지급하여야 하며, 공사중지에 따라 발생하는 손해에 대해 \"수급인\"에게 청구하지 못한다."}, {"uid": "a39", "label": "제39조", "title": "채권양도", "text": "① \"수급인\"은 이 공사의 이행을 위한 목적이외에는 이 계약에 의하여 발생한 채권(공사대금 청구권)을 제3자에게 양도하지 못한다. ② \"수급인\"이 채권양도를 하고자 하는 경우에는 미리 보증기관(연대보증인이 있는 경우 연대보증인을 포함한다)의 동의를 얻어 \"도급인\"의 서면승인을 받아 야 한다. ③ \"도급인\"은 제2항의 규정에 의한 \"수급인\"의 채권양도 승인요청에 대하여 승 인 여부를 서면으로 \"수급인\"과 그 채권을 양수하고자 하는 자에게 통지하여야 한다."}, {"uid": "a40", "label": "제40조", "title": "손해배상책임", "text": "① \"수급인\"이 고의 또는 과실로 인하여 도급받은 건설공 사의 시공관리를 조잡하게 하여 타인에게 손해를 가한 때에는 그 손해를 배상 할 책임이 있다. ② \"수급인\"은 제1항의 규정에 의한 손해가 \"도급인\"의 고의 또는 과실에 의하 여 발생한 것인 때에는 \"도급인\"에 대하여 구상권을 행사할 수 있다. ③ \"수급인\"은 하수급인이 고의 또는 과실로 인하여 하도급 받은 공사를 조잡 하게 하여 타인에게 손해를 가한 때는 하수급인과 연대하여 그 손해를 배상할 책임이 있다."}, {"uid": "a41", "label": "제41조", "title": "법령의 준수", "text": "\"도급인\"과 \"수급인\"은 이 공사의 시공 및 계약의 이행에 있어서 건설산업기본법 등 관계법령의 제규정을 준수하여야 한다."}, {"uid": "a42", "label": "제42조", "title": "분쟁의 해결", "text": "① 계약에 별도로 규정된 것을 제외하고는 계약에서 발생 하는 문제에 관한 분쟁은 계약당사자가 쌍방의 합의에 의하여 해결한다. ② 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결방법으로 다음 각 호의 어느 하나 중 도급인과 수급인 간 합의로 정한다. 1. 분쟁의 자율적 해결을 중시할 경우, 「건설산업기본법」에 따른 건설분쟁조 정위원회의 조정 2. 분쟁의 원활한 해결을 중시할 경우, 「중재법」에 따른 중재기관의 중재 <②항 적용 예시> · (예시1) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「건설산 업기본법」에 따른 건설분쟁조정위원회에 조정을 신청한다. · (예시2) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「중재 법」에 따른 중재기관에 중재를 신청한다. ③ 제2항에 따라 건설분쟁조정위원회에 조정이 신청된 경우, 상대방은 그 조정 절차에 응하여야 한다."}, {"uid": "a43", "label": "제43조", "title": "특약사항", "text": "기타 이 계약에서 정하지 아니한 사항에 대하여는 \"도급인\"과 \"수급인\"이 합의하여 별도의 특약을 정할 수 있다."}]}, {"id": "v1", "label": "시공사 1차 제출", "short": "1차", "date": "2026-02-03", "actor": "시공사", "articles": [{"uid": "a1", "label": "제1조", "title": "총칙", "text": "\"도급인\"과 \"수급인\"은 대등한 입장에서 서로 협력하여 신의에 따라 성실히 계약을 이행한다."}, {"uid": "a2", "label": "제2조", "title": "정의", "text": "이 조건에서 사용하는 용어의 정의는 다음과 같다 1. \"도급인\"이라 함은 건설공사를 건설업자에게 도급하는 자를 말한다. 2. \"도급\"이라 함은 당사자 일방이 건설공사를 완성할 것으로 약정하고, 상대 방이 그 일의 결과에 대하여 대가를 지급할 것을 약정하는 계약을 말한다. 3. \"수급인\"이라 함은 \"도급인\"으로부터 건설공사를 도급받는 건설업자를 말한다. 4. \"하도급\"이라 함은 도급받은 건설공사의 전부 또는 일부를 다시 도급하기 위하여 \"수급인\"이 제3자와 체결하는 계약을 말한다. 5. \"하수급인\"이라 함은 \"수급인\"으로부터 건설공사를 하도급받은 자를 말한다. 6. \"설계서\"라 함은 공사시방서, 설계도면(물량내역서를 작성한 경우 이를 포함 한다) 및 현장설명서를 말한다. 7. \"물량내역서\"라 함은 공종별 목적물을 구성하는 품목 또는 비목과 동 품목 또는 비목의 규격ㆍ수량ㆍ단위 등이 표시된 내역서를 말한다. 8. \"산출내역서\"라 함은 물량내역서에 \"수급인\"이 단가를 기재하여 \"도급인\"에 게 제출한 내역서를 말한다"}, {"uid": "a3", "label": "제3조", "title": "계약문서", "text": "① 계약문서는 민간건설공사 도급계약서, 민간건설공사 도급계 약 일반조건, 공사계약특수조건, 설계서 및 산출내역서로 구성되며, 상호 보완 의 효력을 가진다. ② 이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서 등은 계약문 서로서의 효력을 가진다. ③이 계약조건 외에 당사자 일방에게 현저하게 불공정한 경우로서 다음 각 호 의 어느 하나에 해당하는 특약은 그 부분에 한하여 무효로 한다. 1. 계약체결 이후 설계변경, 경제상황의 변동에 따라 발생하는 계약금액의 변경 을 상당한 이유 없이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특 약 2. 계약체결 이후 공사내용의 변경에 따른 계약기간의 변경을 상당한 이유 없 이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특약 3. 본 계약의 형태와 공사내용 등 제반사정에 비추어 계약체결 당시 예상하기 어려운 내용에 대하여 상대방에게 책임을 전가하는 특약 4. 계약내용에 대하여 구체적인 정함이 없거나 당사자 간 이견이 있을 경우 그 처리방법 등을 일방의 의사에 따르도록 함으로써 상대방의 정당한 이익을 침해 하는 특약 5. 계약불이행에 따른 당사자의 손해배상책임을 과도하게 경감하거나 가중하여 정함으로써 상대방의 정당한 이익을 침해하는 특약 6. 「민법」 등 관계 법령에서 인정하고 있는 상대방의 권리를 상당한 이유 없 이 배제하거나 제한하는 특약 ④ 계약문서 작성에 따른 인지세는 각 50%씩 수급인과 도급인이 부담한다. 다 만, 도급인과 공동수급체가 체결하는 공동계약의 경우는 공동 수급체의 구성원 간의 계약액의 지분율에 따라 부담한다."}, {"uid": "a4", "label": "제4조", "title": "계약보증금 등", "text": "① \"수급인\"은 계약상의 의무이행을 보증하기 위해 계약서 에서 정한 계약보증금을 계약체결전까지 \"도급인\"에게 현금 등으로 납부하여야 한다. 다만, \"도급인\"과 \"수급인\"이 합의에 의하여 계약보증금을 납부하지 아니 하기로 약정한 경우에는 그러하지 아니하다. ② 제1항의 계약보증금은 다음 각 호의 기관이 발행한 보증서로 납부할 수 있다. 1. 건설산업기본법 제54조 제1항의 규정에 의한 각 공제조합 발행 보증서 2. 보증보험회사, 신용보증기금 등 이와 동등한 기관이 발행하는 보증서 3. 금융기관의 지급보증서 또는 예금증서 4. 국채 또는 지방채 ③ \"수급인\"은 제21조부터 제23조의 규정에 의하여 계약금액이 증액된 경우에 는 이에 상응하는 금액의 보증금을 제1항 및 제2항의 규정에 따라 추가 납부하 여야 하며, 계약금액이 감액된 경우에는 \"도급인\"은 이에 상응하는 금액의 계약 보증금을 \"수급인\"에게 반환하여야 한다. ④ 제1항 또는 제3항에 따라 \"수급인\"이 계약의 이행을 보증하는 때에는 \"도급 인\"도 수급인에게 공사대금 지급의 보증 또는 담보를 제공하여야 한다. 다만, \" 도급인\"이 공사대금 지급보증 또는 담보 제공을 하기 곤란한 경우에는 \"수급인\" 이 그에 상응하는 보험 또는 공제에 가입할 수 있도록 계약의 이행 보증을 받 은 날부터 30일 이내에 보험료 또는 공제료(이하 \"보험료등\"이라 한다)를 지급 하여야 한다. ⑤ \"도급인\"이 제4항에 따른 공사대금의 지급보증, 담보의 제공 또는 보험료등 의 지급을 하지 아니한 때에는 \"수급인\"은 15일 이내 \"도급인\"에게 그 이행을 최고하고 공사의 시공을 중지할 수 있다."}, {"uid": "a5", "label": "제5조", "title": "계약보증금의 처리", "text": "① 제34조제1항 각 호의 사유로 계약이 해제 또는 해 지된 경우 제4조의 규정에 의하여 납부된 계약보증금은 \"도급인\"에게 귀속한다. 이 경우 계약의 해제 또는 해지에 따른 손해배상액이 계약보증금을 초과한 경 우에는 그 초과분에 대한 손해배상을 청구할 수 있다. ② \"도급인\"은 제35조제1항 각 호의 사유로 계약이 해제 또는 해지되거나 계약 의 이행이 완료된 때에는 제4조의 규정에 의하여 납부된 계약보증금을 지체없 이 \"수급인\"에게 반환하여야 한다."}, {"uid": "a6", "label": "제6조", "title": "공사감독원", "text": "① \"도급인\"은 계약의 적정한 이행을 확보하기 위하여 스스로 이를 감독하거나 자신을 대리하여 다음 각 호의 사항을 행하는 자(이하 ‘공사 감독원’이라 한다)를 선임할 수 있다. 1. 시공일반에 대하여 감독하고 입회하는 일 2. 계약이행에 있어서 \"수급인\"에 대한 지시ㆍ승낙 또는 협의하는 일 3. 공사의 재료와 시공에 대한 검사 또는 시험에 입회하는 일 4. 공사의 기성부분 검사, 준공검사 또는 공사목적물의 인도에 입회하는 일 5. 기타 공사감독에 관하여 \"도급인\"이 위임하는 일 ② \"도급인\"은 제1항의 규정에 의하여 공사감독원을 선임한 때에는 그 사실을 즉시 \"수급인\"에게 통지하여야 한다. ③ \"수급인\"은 공사감독원의 감독 또는 지시사항이 공사수행에 현저히 부당하 다고 인정할 때에는 \"도급인\"에게 그 사유를 명시하여 필요한 조치를 요구할 수 있다."}, {"uid": "a7", "label": "제7조", "title": "현장대리인의 배치", "text": "① \"수급인\"은 착공전에 건설산업기본법령에서 정한 바에 따라 당해공사의 주된 공종에 상응하는 건설기술자를 현장에 배치하고, 그중 1인을 현장대리인으로 선임한 후 \"도급인\"에게 통지하여야 한다. ② 제1항의 현장대리인은 법령의 규정 또는 \"도급인\"이 동의한 경우를 제외하고 는 현장에 상주하여 시공에 관한 일체의 사항에 대하여 \"수급인\"을 대리하며, 도급받은 공사의 시공관리 기타 기술상의 관리를 담당한다."}, {"uid": "a8", "label": "제8조", "title": "공사현장 근로자", "text": "① \"수급인\"은 해당 공사의 시공 또는 관리에 필요한 기 술과 인력을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 사용자로 서의 모든 책임을 진다. ② \"수급인\"이 채용한 근로자에 대하여 \"도급인\"이 해당 계약의 시공 또는 관리 상 현저히 부적당하다고 인정하여 교체를 요구한 때에는 정당한 사유가 없는 한 즉시 교체하여야 한다. ③ \"수급인\"은 제2항에 의하여 교체된 근로자를 \"도급인\"의 동의 없이 해당 공 사를 위해 다시 채용할 수 없다."}, {"uid": "a9", "label": "제9조", "title": "착공신고 및 공정보고", "text": "① \"수급인\"은 계약서에서 정한 바에 따라 착공하 여야 하며, 착공 시에는 다음 각 호의 서류가 포함된 착공신고서를 \"도급인\"에 게 제출하여야 한다. 1. 건설산업기본법령에 의하여 배치하는 건설기술자 지정서 2. 공사예정공정표 3. 공사비 산출내역서 (단, 계약체결시 산출내역서를 제출하고 계약금액을 정 한 경우를 제외한다) 4. 공정별 인력 및 장비 투입 계획서 5. 기타 \"도급인\"이 지정한 사항 ② \"수급인\"은 계약의 이행중에 제1항의 규정에 의하여 제출한 서류의 변경이 필요한 때에는 관련서류를 변경하여 제출하여야 한다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 제출된 서류의 내용을 조정할 필요가 있다고 인정하는 때에는 \"수급인\"에게 이의 조정을 요구할 수 있다. ④ \"도급인\"은 \"수급인\"이 월별로 수행한 공사에 대하여 다음 각 호의 사항을 명백히 하여 익월 14일까지 제출하도록 요청할 수 있으며, \"수급인\"은 이에 응 하여야 한다. 1. 월별 공정률 및 수행공사금액 2. 인력ㆍ장비 및 자재현황 3. 계약사항의 변경 및 계약금액의 조정내용"}, {"uid": "a10", "label": "제10조", "title": "공사기간", "text": "① 공사착공일과 준공일은 계약서에 명시된 일자로 한다. ② \"수급인\"의 귀책사유 없이 공사착공일에 착공할 수 없는 경우에는 \"수급인\" 의 현장인수일자를 착공일로 하며, 이 경우 \"수급인\"은 공사기간의 연장을 요구 할 수 있다. ③ 준공일은 \"수급인\"이 건설공사를 완성하고 \"도급인\"에게 서면으로 준공검사 를 요청한 날을 말한다. 다만, 제27조의 규정에 의하여 준공검사에 합격한 경우 에 한 한다."}, {"uid": "n_price", "label": "제10조의2", "title": "물가변동 특례", "text": "① \"도급인\"과 \"수급인\"은 착공 이후 발생하는 물가변동에 대하여는 계약금액을 조정하지 아니한다. ② 제1항에도 불구하고 부득이한 사정이 있는 경우 양 당사자가 협의하여 정한다."}, {"uid": "a11", "label": "제11조", "title": "선금", "text": "① \"도급인\"은 계약서에서 정한 바에 따라 \"수급인\"에게 선금을 지 급하여야 하며, \"도급인\"이 선금 지급시 보증서 제출을 요구하는 경우 \"수급인\" 은 제4조 제2항 각 호의 보증기관이 발행한 보증서를 제출하여야 한다. ② 제1항에 의한 선금지급은 \"수급인\"의 청구를 받은 날부터 14일이내에 지급 하여야 한다. 다만, 자금사정등 불가피한 사유로 인하여 지급이 불가능한 경우 그 사유 및 지급시기를 \"수급인\"에게 서면으로 통지한 때에는 그러하지 아니하 다. ③ \"수급인\"은 선금을 계약목적달성을 위한 용도이외의 타 목적에 사용할 수 없으며, 노임지급 및 자재확보에 우선 사용하여야 한다. ④ 선금은 기성부분에 대한 대가를 지급할 때마다 다음 방식에 의하여 산출한 금액을 정산한다. 기성부분의 대가 선금정산액＝선금액×  계약금액 ⑤ \"도급인\"은 선금을 지급한 경우 다음 각 호의 1에 해당하는 경우에는 당해 선금잔액에 대하여 반환을 청구할 수 있다. 1. 계약을 해제 또는 해지하는 경우 2. 선금지급조건을 위반한 경우 ⑥ \"도급인\"은 제5항의 규정에 의한 반환청구시 기성부분에 대한 미지급금액이 있는 경우에는 선금잔액을 그 미지급금액에 우선적으로 충당하여야 한다."}, {"uid": "a12", "label": "제12조", "title": "자재의 검사 등", "text": "① 공사에 사용할 재료는 신품이어야 하며, 품질ㆍ품명 등은 설계도서와 일치하여야 한다. 다만, 설계도서에 품질ㆍ품명 등이 명확히 규정되지 아니한 것은 표준품 또는 표준품에 상당하는 재료로서 계약의 목적을 달성하는데 가장 적합한 것이어야 한다. ② 공사에 사용할 자재중에서 \"도급인\"이 품목을 지정하여 검사를 요구하는 경 우에는 \"수급인\"은 사용전에 \"도급인\"의 검사를 받아야 하며, 설계도서와 상이 하거나 품질이 현저히 저하되어 불합격된 자재는 즉시 대체하여 다시 검사를 받아야 한다. ③ 제2항의 검사에 이의가 있을 경우 \"수급인\"은 \"도급인\"에게 재검사를 요구할 수 있으며, 재검사가 필요하다고 인정되는 경우 \"도급인\"은 지체없이 재검사하 도록 조치하여야 한다. ④ \"수급인\"은 자재의 검사에 소요되는 비용을 부담하여야 하며, 검사 또는 재 검사 등을 이유로 계약기간의 연장을 요구할 수 없다. 다만, 제3항의 규정에 의 하여 재검사 결과 적합한 자재인 것으로 판명될 경우에는 재검사에 소요된 기 간에 대하여는 계약기간을 연장할 수 있다. ⑤ 공사에 사용하는 자재중 조립 또는 시험을 요하는 것은 \"도급인\"의 입회하 에 그 조립 또는 시험을 하여야 한다. ⑥ 수중 또는 지하에서 행하여지는 공사나 준공후 외부에서 확인할 수 없는 공 사는 \"도급인\"의 참여없이 시행할 수 없다. 다만, 사전에 \"도급인\"의 서면승인을 받고 사진, 비디오 등으로 시공방법을 확인할 수 있는 경우에는 시행할 수 있 다. ⑦ \"수급인\"은 공사수행과 관련하여 필요한 경우 \"도급인\"에게 입회를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다."}, {"uid": "a13", "label": "제13조", "title": "지급자재와 대여품", "text": "① 계약에 의하여 \"도급인\"이 지급하는 자재와 대여 품은 공사예정공정표에 의한 공사일정에 지장이 없도록 적기에 인도되어야 하 며, 그 인도장소는 시방서 등에 따로 정한 바가 없으면 공사현장으로 한다. ② 제1항의 규정에 의하여 지급된 자재의 소유권은 \"도급인\"에게 있으며, \"수급 인\"은 \"도급인\"의 서면승낙없이 현장 외부로 반출하여서는 아니된다. ③ 제1항의 규정에 의하여 인도된 지급자재와 대여품에 대한 관리상의 책임은 \"수급인\"에게 있으며, \"수급인\"이 이를 멸실 또는 훼손하였을 경우에는 \"도급인\" 에게 변상하여야 한다. ④ \"수급인\"은 지급자재 및 대여품의 품질 또는 규격이 시공에 적당하지 아니 하다고 인정할 때에는 즉시 \"도급인\"에게 이를 통지하고 그 대체를 요구할 수 있다. ⑤ 자재 등의 지급지연으로 공사가 지연될 우려가 있을 때에는 \"수급인\"은 \"도 급인\"의 서면승낙을 얻어 자기가 보유한 자재를 대체 사용할 수 있다. 이 경 우 \"도급인\"은 대체 사용한 자재 등을 \"수급인\"과 합의된 일시 및 장소에서 현 품으로 반환하거나 대체사용당시의 가격을 지체없이 \"수급인\"에게 지급하여야 한다. ⑥ \"수급인\"은 \"도급인\"이 지급한 자재와 기계ㆍ기구 등 대여품을 선량한 관리 자의 주의로 관리하여야 하며, 계약의 목적을 수행하는 데에만 사용하여야 한 다. ⑦ \"수급인\"은 공사내용의 변경으로 인하여 필요없게 된 지급자재 또는 사용완 료된 대여품을 지체없이 \"도급인\"에게 반환하여야 한다."}, {"uid": "a14", "label": "제14조", "title": "안전관리 및 재해보상", "text": "① \"수급인\"은 산업재해를 예방하기 위하여 안전 시설의 설치 및 보험의 가입 등 적정한 조치를 하여야 하며, 이를 위해 \"도급 인\"은 계약금액에 「건설기술진흥법」에 따른 안전관리비와 「산업안전보건 법」에 따른 산업안전보건관리비 및 산업재해보상 보험료 등 관계 법령에서 규 정하는 법정경비의 상당액을 계상하여야 한다. ② 공사현장에서 발생한 산업재해에 대한 책임은 \"수급인\"에게 있다. 다만, 설 계상의 하자 또는 \"도급인\"의 요구에 의한 작업으로 재해가 발생한 경우에는 \" 도급인\"에 대하여 구상권을 행사할 수 있다."}, {"uid": "a15", "label": "제15조", "title": "건설근로자의 보호", "text": "① \"수급인\"은 도급받은 공사가 건설산업기본법, 임 금채권보장법, 고용보험법, 국민연금법, 국민건강보험법 및 노인장기요양보험법 에 의하여 의무가입대상인 경우에는 퇴직공제, 임금채권보장제도, 고용보험, 국 민연금, 건강보험 및 노인장기요양보험에 가입하여야 한다. 다만, \"수급인\"이 도 급받은 공사를 하도급한 경우로서 하수급인이 고용한 근로자에 대하여 고용보 험, 국민연금, 건강보험 및 노인장기요양보험에 가입한 경우에는 그러하지 아니 하다. ② \"도급인\"은 제1항의 건설근로자퇴직공제부금, 임금채권보장제도에 따른 사업 주부담금, 고용보험료, 국민연금보험료, 국민건강보험료 및 노인장기요양보험료 를 계약금액에 계상하여야 한다."}, {"uid": "a16", "label": "제16조", "title": "응급조치", "text": "① \"수급인\"은 재해방지를 위하여 특히 필요하다고 인정될 때 에는 미리 긴급조치를 취하고 즉시 이를 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 재해방지 기타 공사의 시공상 부득이하다고 인정할 때에는 \"수 급인\"에게 긴급조치를 요구할 수 있다. 이 경우 \"수급인\"은 즉시 이에 응하여야 하며, \"수급인\"이 \"도급인\"의 요구에 응하지 않는 경우 \"도급인\"은 제3자로 하여 금 필요한 조치를 하게 할 수 있다. ③ 제1항 및 제2항의 응급조치에 소요된 경비는 실비를 기준으로 \"도급인\"과 \" 수급인\"이 협의하여 부담한다."}, {"uid": "a17", "label": "제17조", "title": "공사기간의 연장", "text": "① \"수급인\" 은 다음 각 호의 사유로 인해 계약이행이 현저히 어려운 경우 등 \"수급인\" 의 책임이 아닌 사유로 공사수행이 지연되는 경우 서면으로 공사기간의 연장을 \"도급인\" 에게 요구할 수 있다. 1. \"도급인\" 의 책임있는 사유 2. 태풍ㆍ홍수ㆍ폭염ㆍ한파ㆍ악천후ㆍ미세먼지 발현ㆍ전쟁ㆍ사변ㆍ지진ㆍ전염병 ㆍ폭동 등 불가항력의 사태(이하 \"불가항력\"이라고 한다.) 3. 원자재 수급불균형 4. 근로시간단축 등 법령의 제ㆍ개정 ② \"도급인\"은 제1항의 규정에 의한 계약기간 연장의 요구가 있는 경우 즉시 그 사실을 조사ㆍ확인하고 공사가 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다. ③ 제1항의 규정에 의거 공사기간이 연장되는 경우 이에 따르는 현장관리비 등 추가경비는 제23조의 규정을 적용하여 조정한다. ④ \"도급인\"은 제1항의 계약기간의 연장을 승인하였을 경우 동 연장기간에 대 하여는 지체상금을 부과하여서는 아니된다."}, {"uid": "a18", "label": "제18조", "title": "부적합한 공사 등", "text": "① \"도급인\"은 \"수급인\"이 시공한 공사중 설계서에 적합 하지 아니한 부분이 있을 때에는 이의 시정을 요구할 수 있으며, \"수급인\"은 지 체없이 이에 응할 수 있다. 이 경우 \"수급인\"은 계약금액의 증액 또는 공기의 연장을 요청할 수 없다. ② 제1항의 경우 설계서에 적합하지 아니한 공사가 \"도급인\"의 요구 또는 지시 에 의하거나 기타 \"수급인\"의 책임으로 돌릴 수 없는 사유로 인한 때에는 \"수 급인\"은 그 책임을 지지 아니한다."}, {"uid": "a19", "label": "제19조", "title": "불가항력에 의한 손해", "text": "① \"수급인\"은 검사를 마친 기성부분 또는 지급자 재와 대여품에 대하여 불가항력에 의한 손해가 발생한 때에는 즉시 그 사실을 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 제1항의 통지를 받은 경우 즉시 그 사실을 조사ㆍ확인하고 그 손해의 부담에 있어서 기성검사를 필한 부분 및 검사를 필하지 아니한 부분 중 객관적인 자료(감독일지, 사진 또는 비디오테잎 등)에 의하여 이미 수행되었음 이 판명된 부분은 \"도급인\"이 부담하고, 기타 부분은 \"도급인\"과 \"수급인\"이 협 의하여 결정한다. ③ 제2항의 협의가 성립되지 않은 때에는 제41조의 규정에 의한다."}, {"uid": "a20", "label": "제20조", "title": "공사의 변경ㆍ중지", "text": "① \"도급인\"이 설계변경 등에 의하여 공사내용을 변 경ㆍ추가하거나 공사의 전부 또는 일부에 대한 시공을 일시 중지할 경우에는 변경계약서 등을 사전에 \"수급인\"에게 교부하여야 한다. ② \"도급인\"이 제1항에 따른 공사내용의 변경ㆍ추가 관련 서류를 교부하지 아 니한 때에는 \"수급인\"은 \"도급인\"에게 도급받은 공사 내용의 변경ㆍ추가에 관한 사항을 서면으로 통지하여 확인을 요청할 수 있다. 이 경우 \"수급인\"의 요청에 대하여 \"도급인\"은 15일 이내에 그 내용에 대한 인정 또는 부인의 의사를 서면 으로 회신하여야 하며, 이 기간내에 회신하지 아니한 경우에는 원래 \"수급인\"이 통지한 내용대로 공사내용의 변경ㆍ추가된 것으로 본다. 다만, 불가항력으로 인 하여 회신이 불가능한 경우에는 제외한다. ③ \"도급인\"의 지시에 의하여 \"수급인\"이 추가로 시공한 공사물량에 대하여서는 공사비를 증액하여 지급하여야 한다. ④ \"수급인\"은 동 계약서에 규정된 계약금액의 조정사유 이외의 계약체결 후 계약조건의 미숙지, 덤핑수주 등을 이유로 계약금액의 변경을 요구하거나 시공 을 거부할 수 없다."}, {"uid": "a21", "label": "제21조", "title": "설계변경으로 인한 계약금액의 조정", "text": "① 설계서의 내용이 공사현장의 상 태와 일치하지 않거나 불분명, 누락, 오류가 있을 때 또는 시공에 관하여 예기 하지 못한 상태가 발생되거나 안전사고의 우려, 사업계획의 변경 등으로 인하 여 추가 시설물(가설구조물을 포함)의 설치가 필요한 때에는 \"도급인\"은 설계를 변경하여야 한다. ② 제1항의 설계변경으로 인하여 공사량의 증감이 발생한 때에는 다음 각 호의 기준에 의하여 계약금액을 조정하며, 필요한 경우 공사기간을 연장하거나 단축 한다. 1. 증감된 공사의 단가는 제9조의 규정에 의한 산출내역서상의 단가를 기준으 로 상호 협의하여 결정한다. 2. 산출내역서에 포함되어 있지 아니한 신규비목의 단가는 설계변경 당시를 기준으로 산정한 단가로 한다. 3. 증감된 공사에 대한 일반관리비 및 이윤 등은 산출내역서상의 율을 적용한다."}, {"uid": "a22", "label": "제22조", "title": "물가변동으로 인한 계약금액의 조정", "text": "① 계약체결 후 90일 이상 경과한 경우에 잔여공사에 대하여 산출내역서에 포함되어 있는 품목 또는 비목, 비목 군 및 지수 등의 변동으로 인한 등락액이 잔여공사에 해당하는 계약금액의 100 분의3 이상인 때에는 계약금액을 조정한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 곤란하다고 인정되는 경우에는 계약체결일(계약체결 후 계 약금액을 조정한 경우 그 조정사유가 발생한 날(이하 \"조정기준일\"이라 한다)을 말하며, 이하 같다)로부터 90일이내에도 계약금액을 조정할 수 있다. ② 제1항의 규정에 의하여 계약금액을 조정할 때에는 국가를 당사자로 하는 계 약에 관한 법률 시행규칙 제74조에 따라 산출된 품목조정률 또는 지수조정률을 활용한다. ③ 제1항의 규정에도 불구하고 해당공사비를 구성하는 재료비, 노무비, 경비 합 계액의 100분의 1을 초과하는 자재의 가격이 계약체결일로부터 100분의 15 이 상 증감된 경우에는 \"도급인\"과 \"수급인\"이 합의하여 계약금액을 조정할 수 있 다. ④ 제1항 및 제3항의 규정에 의한 계약금액의 조정에 있어서 그 조정금액은 계 약금액 중 조정기준일 이후에 이행되는 부분의 대가(이하 \"물가변동적용대가\" 라 한다)에 품목조정률 또는 지수조정률을 곱하여 산출하되, 조정기준일 이전 에 이미 계약이행이 완료되어야 할 부분에 대하여는 적용하지 아니한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 지연된 경우에는 그러하지 아니 하다. ⑤ 선금을 지급한 것이 있는 때에는 제1항, 제3항, 제4항의 규정에 의하여 산출 된 증가액에서 다음 산식으로 산출한 금액을 공제한다. 공제금액=물가변동적용대가×(품목조정률 또는 지수조정률)×선금급률 ⑥ 제1항의 규정에 의하여 조정된 계약금액은 직전의 물가변동으로 인하여 계 약금액 조정기준일부터 60일 이내에는 이를 다시 조정할 수 없다. ⑦ 수급인은 제1항 및 제3항의 규정에 의하여 계약금액 조정을 청구하는 경우 에는 계약금액조정내역서를 첨부하여야 하며, 도급인은 청구를 받은 날부터 30 일 이내에 계약금액을 조정하여야 한다. 다만, 도급인이 자금사정 등 불가피한 경우에는 수급인과 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 증 액할 수 있는 자금이 없는 때에 다만, 착공 이후에는 제1항에 따른 조정을 하지 아니한다."}, {"uid": "a23", "label": "제23조", "title": "주요 원자재 가격변동에 따른 계약금액의 연동", "text": "도급인과 수급인은 「대ㆍ중소기업 상생협력 촉진에 관한 법률」제21조에 따라 주요 원재료의 가격변동에 따른 계약금액 연동과 관련하여 중소벤처기업부에서 권장하는 표준약정서를 작성하여 첨부하여야 한다. 다만, 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니할 수 있다. 1. 도급인이 「중소기업기본법」제2조 제2항에 따른 소기업에 해당하는 경우 2. 계약기간이 90일 이내의 범위에서 관계 법령으로 정하는 기간 이내인 경우 3. 계약금액이 1억원 이하의 범위에서 관계 법령으로 정하는 금액 이하인 경우 4. 도급인과 수급인이 계약금액 연동을 하지 아니하기로 합의한 경우. 이 경우 도급인과 수급인은 그 취지와 사유를 도급계약서에 기재하여야 한다."}, {"uid": "a24", "label": "제24조", "title": "기타 계약내용의 변동으로 인한 계약금액의 조정", "text": "① 제21조부터 제22조 의2에 의한 경우 이외에 다음 각 호에 의해 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 계약금액을 조정하며, 이 경우 증감된 공사에 대한 일반관리비 및 이율 등은 산출내역서상의 율을 적용한다. 1. 계약내용의 변경 2. 불가항력에 따른 공사기간의 연장 3. 근로시간 단축, 근로자 사회보험료 적용범위 확대 등 공사비, 공사기간에 영향을 미치는 법령의 제ㆍ개정 ② 제1항과 관련하여 \"수급인\"은 제21조부터 제22조2에 규정된 계약금액 조정 사유 이외에 계약체결후 계약조건의 미숙지 등을 이유로 계약금액의 변경을 요 구하거나 시공을 거부할 수 없다."}, {"uid": "a26", "label": "제25조", "title": "손해의 부담", "text": "\"도급인\"ㆍ\"수급인\" 쌍방의 책임 없는 사유로 공사의 목적 물이나 제3자에게 손해가 생긴 경우 다음 각 호의 자가 손해를 부담한다. 1. 목적물이 \"도급인\"에게 인도되기 전에 발생된 손해: \"수급인\" 2. 목적물이 \"도급인\"에게 인도된 후에 발생된 손해: \"도급인\" 3. 목적물에 대한 \"도급인\"의 인수지연 중 발생된 손해: \"도급인\" 4. 목적물 검사기간 중 발생된 손해: \"도급인\"ㆍ\"수급인\"이 협의하여 결정"}, {"uid": "a27", "label": "제26조", "title": "부분사용", "text": "① \"도급인\"은 공사목적물의 인도전이라 하더라도 \"수급인\"의 동의를 얻어 공사목적물의 전부 또는 일부를 사용할 수 있다. ② 제1항의 경우 \"도급인\"은 그 사용부분에 대하여 선량한 관리자의 주의 의무 를 다하여야 한다. ③ \"도급인\"은 제1항에 의한 사용으로 \"수급인\"에게 손해를 끼치거나 \"수급인\" 의 비용을 증가하게 한 때는 그 손해를 배상하거나 증가된 비용을 부담한다."}, {"uid": "a28", "label": "제27조", "title": "준공검사", "text": "① \"수급인\"은 공사를 완성한 때에는 \"도급인\"에게 통지하여야 하며 \"도급인\"은 통지를 받은 후 지체없이 \"수급인\"의 입회하에 검사를 하여야 하며, \"도급인\"이 \"수급인\"의 통지를 받은 후 10일 이내에 검사결과를 통지하지 아니한 경우에는 10일이 경과한 날에 검사에 합격한 것으로 본다. 다만, 불가항 력으로 인하여 검사를 완료하지 못한 경우에는 당해 사유가 존속되는 기간과 당해 사유가 소멸된 날로부터 3일까지는 이를 연장할 수 있다. ② \"수급인\"은 제1항의 검사에 합격하지 못한 때에는 지체없이 이를 보수 또는 개조하여 다시 준공검사를 받아야 한다. ③ \"수급인\"은 검사의 결과에 이의가 있을 때에는 재검사를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다. ④ \"도급인\"은 제1항의 규정에 의한 검사에 합격한 후 \"수급인\"이 공사목적물의 인수를 요청하면 인수증명서를 발급하고 공사목적물을 인수하여야 한다."}, {"uid": "a29", "label": "제28조", "title": "대금지급", "text": "① \"수급인\"은 \"도급인\"의 준공검사에 합격한 후 즉시 잉여자 재, 폐기물, 가설물 등을 철거, 반출하는 등 공사현장을 정리하고 공사대금의 지급을 \"도급인\"에게 청구할 수 있다. ② \"도급인\"은 특약이 없는 한 계약의 목적물을 인도 받음과 동시에 \"수급인\"에 게 공사 대금을 지급하여야 한다. ③ \"도급인\"이 공사대금을 지급기한내에 지급하지 못하는 경우에는 그 미지급 금액에 대하여 지급기한의 다음날부터 지급하는 날까지의 일수에 계약서 상에 서 정한 대가지급 지연이자율(시중은행의 일반대출시 적용되는 연체이자율 수 준을 감안 하여 상향 적용할 수 있다)을 적용하여 산출한 이자를 가산하여 지 급하여야 한다."}, {"uid": "a30", "label": "제29조", "title": "폐기물의 처리 등", "text": "\"수급인\"은 공사현장에서 발생한 폐기물을 관계법령에 의거 처리하여야 하며, \"도급인\"은 폐기물처리에 소요되는 비용을 계약금액에 반영하여야 한다."}, {"uid": "a31", "label": "제30조", "title": "지체상금", "text": "① \"수급인\"은 준공기한내에 공사를 완성하지 아니한 때에는 매 지체일수마다 계약서상의 지체상금율을 계약금액에 곱하여 산출한 금액(이 하 ‘지체상금’이라 한다)을 \"도급인\"에게 납부하여야 한다. 다만, \"도급인\"의 귀 책사유로 준공검사가 지체된 경우와 다음 각 호의 1에 해당하는 사유로 공사가 지체된 경우에는 그 해당일수에 상당하는 지체상금을 지급하지 아니하여도 된 다. 1. 불가항력의 사유에 의한 경우 2. \"수급인\"이 대체하여 사용할 수 없는 중요한 자재의 공급이 \"도급인\"의 책 임있는 사유로 인해 지연되어 공사진행이 불가능하게 된 경우 3. \"도급인\"의 귀책사유로 착공이 지연되거나 시공이 중단된 경우 4. 기타 \"수급인\"의 책임에 속하지 아니하는 사유로 공사가 지체된 경우 ② 제1항을 적용함에 있어 제26조의 규정에 의하여 \"도급인\"이 공사목적물의 전부 또는 일부를 사용한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우 \"도급인\"이 인허가기관으로부터 공사목적물의 전부 또는 일 부에 대하여 사용승인을 받은 경우에는 사용승인을 받은 공사목적물의 해당부 분은 사용한 것으로 본다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 산출된 지체상금은 제28조의 규정에 의하여 \"수급인\"에게 지급되는 공사대금과 상계할 수 있다. ④제1항의 지체상금율은 계약 당사자간에 별도로 정한 바가 없는 경우에는 국 가를 당사자로 하는 계약에 관한 법령 등에 따라 공공공사 계약체결시 적용되 는 지체상금율을 따른다."}, {"uid": "a32", "label": "제31조", "title": "하자담보", "text": "① \"수급인\"은 공사의 하자보수를 보증하기 위하여 계약서에 정한 하자보수보증금율을 계약금액에 곱하여 산출한 금액(이하 ‘하자보수보증 금’이라 한다)을 준공검사후 그 공사의 대가를 지급할 때까지 현금 또는 제4조 제2항 각 호의 보증기관이 발행한 보증서로서 \"도급인\"에게 납부하여야 한다. ② \"수급인\"은 \"도급인\"이 전체목적물을 인수한 날과 준공검사를 완료한 날 중 에서 먼저 도래한 날부터 계약서에 정한 하자담보 책임기간중 당해공사에 발 생하는 일체의 하자를 보수하여야 한다. 다만, 다음 각 호의 사유로 발생한 하자에 대해서는 그러하지 아니하다. 1. 공사목적물의 인도 후에 천재지변 등 불가항력이 \"수급인\"의 책임이 아닌 사유로 인한 경우 2. \"도급인\"이 제공한 재료의 품질이나 규격 등의 기준미달로 인한 경우 3. \"도급인\"의 지시에 따라 시공한 경우 4. \"도급인\"이 건설공사의 목적물을 관계 법령에 따른 내구연한 또는 설계상의 구조내력을 초과하여 사용한 경우 ③ \"수급인\"이 \"도급인\"으로 부터 제2항의 규정에 의한 하자보수의 요구를 받고 이에 응하지 아니하는 경우 제1항의 규정에 의한 하자보수보증금은 \"도급인\"에 게 귀속한다. ④ \"도급인\"은 하자담보책임기간이 종료한 때에는 제1항의 규정에 의한 하자보 수 보증금을 \"수급인\"의 청구에 의하여 반환하여야 한다. 다만, 하자담보책임기 간이 서로 다른 공종이 복합된 공사에 있어서는 공종별 하자담보 책임기간이 만료된 공종의 하자보수보증금은 \"수급인\"의 청구가 있는 경우 즉시 반환하여 야 한다."}, {"uid": "a33", "label": "제32조", "title": "건설공사의 하도급 등", "text": "①\"수급인\"이 도급받은 공사를 제3자에게 하도급 하고자 하는 경우에는 건설산업기본법 및 하도급거래공정화에관한법률에서 정 한 바에 따라 하도급하여야 하며, 하수급인의 선정, 하도급계약의 체결 및 이 행, 하도급 대가의 지급에 있어 관계 법령의 제규정을 준수하여야 한다. ② \"도급인\"은 건설공사의 시공에 있어 현저히 부적당하다고 인정하는 하수급 인이 있는 경우에는 하도급의 통보를 받은 날 또는 그 사유가 있음을 안 날부 터 30일이내에 서면으로 그 사유를 명시하여 하수급인의 변경 또는 하도급 계 약내용의 변경을 요구할 수 있다. 이 경우 \"수급인\"은 정당한 사유가 없는 한 이에 응하여야 한다. ③ \"도급인\"은 제2항의 규정에 의하여 건설공사의 시공에 있어 현저히 부적당 한 하수급인이 있는지 여부를 판단하기 위하여 하수급인의 시공능력, 하도급 계약 금액의 적정성 등을 심사할 수 있다."}, {"uid": "a34", "label": "제33조", "title": "하도급대금의 직접 지급", "text": "① \"도급인\"은 \"수급인\"이 제32조의 규정에 의 하여 체결한 하도급계약중 하도급거래공정화에 관한법률과 건설산업기본법에서 정한 바에 따라 하도급대금의 직접 지급사유가 발생하는 경우에는 그 법에 따 라 하수급인이 시공한 부분에 해당하는 하도급대금을 하수급인에게 지급한다. ② \"도급인\"이 제1항의 규정에 의하여 하도급대금을 직접 지급한 경우에는 \"도 급인\"의 \"수급인\"에 대한 대금지급채무는 하수급인에게 지급한 한도안에서 소 멸한 것으로 본다."}, {"uid": "a35", "label": "제34조", "title": "\"도급인\"의 계약해제 등", "text": "① \"도급인\"은 다음 각 호의 1에 해당하는 경우 에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. \"수급인\"이 정당한 이유없이 약정한 착공기일을 경과하고도 공사에 착수하 지 아니한 경우 2. \"수급인\"의 책임있는 사유로 인하여 준공기일내에 공사를 완성할 가능성이 없음이 명백한 경우 3. 제30조제1항의 규정에 의한 지체상금이 계약보증금 상당액에 도달한 경우 로서 계약기간을 연장하여도 공사를 완공할 가능성이 없다고 판단되는 경우 4. 기타 \"수급인\"의 계약조건 위반으로 인하여 계약의 목적을 달성할 수 없다 고 인정되는 경우 ② 제1항의 규정에 의한 계약의 해제 또는 해지는 \"도급인\"이 \"수급인\"에게 서 면으로 계약의 이행기한을 정하여 통보한 후 기한내에 이행되지 아니한 때 계 약의 해제 또는 해지를 \"수급인\"에게 통지함으로써 효력이 발생한다. ③ \"수급인\"은 제2항의 규정에 의한 계약의 해제 또는 해지 통지를 받은 때에 는 다음 각 호의 사항을 이행하여야 한다. 1. 당해 공사를 지체없이 중지하고 모든 공사용 시설ㆍ장비 등을 공사현장으 로부터 철거하여야 한다. 2. 제13조의 규정에 의한 지급재료의 잔여분과 대여품은 \"도급인\"에게 반환하 여야 한다."}, {"uid": "a36", "label": "제35조", "title": "\"수급인\"의 계약해제 등", "text": "① \"수급인\"은 다음 각 호의 어느 하나에 해당 하는 경우에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. 공사내용을 변경함으로써 계약금액이 100분의 40이상 감소된 때 2. \"도급인\"의 책임있는 사유에 의한 공사의 정지기간이 계약서상의 공사기간 의 100분의 50을 초과한 때 3. \"도급인\"이 정당한 이유없이 계약내용을 이행하지 아니함으로써 공사의 적 정이행이 불가능하다고 명백히 인정되는 때 4. 제4조제5항에 따른 기간 내에 공사대금 지급의 보증, 담보의 제공 또는 보 험료 등의 지급을 이행하지 아니한 때 ② 제1항의 규정에 의하여 계약을 해제 또는 해지하는 경우에는 제34조제2항 및 제3항의 규정을 준용한다."}, {"uid": "a37", "label": "제36조", "title": "계약해지시의 처리", "text": "① 제34조 및 제35조의 규정에 의하여 계약이 해지 된 때에는 \"도급인\"과 \"수급인\"은 지체없이 기성부분의 공사금액을 정산하여야 한다. ② 제34조 및 제35조의 규정에 의한 계약의 해제 또는 해지로 인하여 손해가 발생한 때에는 상대방에게 그에 대한 배상을 청구할 수 있다. 다만, 제35조제1 항제4호에 해당하여 해지한 경우에는 해지에 따라 발생한 손해에 대하여 청구 할 수 없다."}, {"uid": "a38", "label": "제37조", "title": "\"수급인\"의 동시이행 항변권", "text": "① \"도급인\"이 계약조건에 의한 선금과 기 성부분금의 지급을 지연할 경우 \"수급인\"이 상당한 기한을 정하여 그 지급을 독촉하였음에도 불구하고 \"도급인\"이 이를 지급치 않을 때에는 \"수급인\"은 공사 중지기간을 정하여 \"도급인\"에게 통보하고 공사의 일부 또는 전부를 일시 중지 할 수 있다. ② 제1항의 공사중지에 따른 기간은 지체상금 산정시 공사기간에서 제외된다. ③ \"도급인\"은 제1항의 공사중지에 따른 비용을 \"수급인\"에게 지급하여야 하며, 공사중지에 따라 발생하는 손해에 대해 \"수급인\"에게 청구하지 못한다."}, {"uid": "a39", "label": "제38조", "title": "채권양도", "text": "① \"수급인\"은 이 공사의 이행을 위한 목적이외에는 이 계약에 의하여 발생한 채권(공사대금 청구권)을 제3자에게 양도하지 못한다. ② \"수급인\"이 채권양도를 하고자 하는 경우에는 미리 보증기관(연대보증인이 있는 경우 연대보증인을 포함한다)의 동의를 얻어 \"도급인\"의 서면승인을 받아 야 한다. ③ \"도급인\"은 제2항의 규정에 의한 \"수급인\"의 채권양도 승인요청에 대하여 승 인 여부를 서면으로 \"수급인\"과 그 채권을 양수하고자 하는 자에게 통지하여야 한다."}, {"uid": "a40", "label": "제39조", "title": "손해배상책임", "text": "① \"수급인\"이 고의 또는 과실로 인하여 도급받은 건설공 사의 시공관리를 조잡하게 하여 타인에게 손해를 가한 때에는 그 손해를 배상 할 책임이 있다. ② \"수급인\"은 제1항의 규정에 의한 손해가 \"도급인\"의 고의 또는 과실에 의하 여 발생한 것인 때에는 \"도급인\"에 대하여 구상권을 행사할 수 있다. ③ \"수급인\"은 하수급인이 고의 또는 과실로 인하여 하도급 받은 공사를 조잡 하게 하여 타인에게 손해를 가한 때는 하수급인과 연대하여 그 손해를 배상할 책임이 있다."}, {"uid": "a41", "label": "제40조", "title": "법령의 준수", "text": "\"도급인\"과 \"수급인\"은 이 공사의 시공 및 계약의 이행에 있어서 건설산업기본법 등 관계법령의 제규정을 준수하여야 한다."}, {"uid": "a42", "label": "제41조", "title": "분쟁의 해결", "text": "① 계약에 별도로 규정된 것을 제외하고는 계약에서 발생 하는 문제에 관한 분쟁은 계약당사자가 쌍방의 합의에 의하여 해결한다. ② 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결방법으로 다음 각 호의 어느 하나 중 도급인과 수급인 간 합의로 정한다. 1. 분쟁의 자율적 해결을 중시할 경우, 「건설산업기본법」에 따른 건설분쟁조 정위원회의 조정 2. 분쟁의 원활한 해결을 중시할 경우, 「중재법」에 따른 중재기관의 중재 <②항 적용 예시> · (예시1) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「건설산 업기본법」에 따른 건설분쟁조정위원회에 조정을 신청한다. · (예시2) 제1항의 합의가 성립되지 못할 때에는 분쟁의 해결을 위하여 「중재 법」에 따른 중재기관에 중재를 신청한다. ③ 제2항에 따라 건설분쟁조정위원회에 조정이 신청된 경우, 상대방은 그 조정 절차에 응하여야 한다."}, {"uid": "a43", "label": "제42조", "title": "특약사항", "text": "기타 이 계약에서 정하지 아니한 사항에 대하여는 \"도급인\"과 \"수급인\"이 합의하여 별도의 특약을 정할 수 있다."}]}, {"id": "v2", "label": "발주처 검토 반영", "short": "2차", "date": "2026-02-21", "actor": "발주처", "articles": [{"uid": "a1", "label": "제1조", "title": "총칙", "text": "\"도급인\"과 \"수급인\"은 대등한 입장에서 서로 협력하여 신의에 따라 성실히 계약을 이행한다."}, {"uid": "a2", "label": "제2조", "title": "정의", "text": "이 조건에서 사용하는 용어의 정의는 다음과 같다 1. \"도급인\"이라 함은 건설공사를 건설업자에게 도급하는 자를 말한다. 2. \"도급\"이라 함은 당사자 일방이 건설공사를 완성할 것으로 약정하고, 상대 방이 그 일의 결과에 대하여 대가를 지급할 것을 약정하는 계약을 말한다. 3. \"수급인\"이라 함은 \"도급인\"으로부터 건설공사를 도급받는 건설업자를 말한다. 4. \"하도급\"이라 함은 도급받은 건설공사의 전부 또는 일부를 다시 도급하기 위하여 \"수급인\"이 제3자와 체결하는 계약을 말한다. 5. \"하수급인\"이라 함은 \"수급인\"으로부터 건설공사를 하도급받은 자를 말한다. 6. \"설계서\"라 함은 공사시방서, 설계도면(물량내역서를 작성한 경우 이를 포함 한다) 및 현장설명서를 말한다. 7. \"물량내역서\"라 함은 공종별 목적물을 구성하는 품목 또는 비목과 동 품목 또는 비목의 규격ㆍ수량ㆍ단위 등이 표시된 내역서를 말한다. 8. \"산출내역서\"라 함은 물량내역서에 \"수급인\"이 단가를 기재하여 \"도급인\"에 게 제출한 내역서를 말한다"}, {"uid": "a3", "label": "제3조", "title": "계약문서", "text": "① 계약문서는 민간건설공사 도급계약서, 민간건설공사 도급계 약 일반조건, 공사계약특수조건, 설계서 및 산출내역서로 구성되며, 상호 보완 의 효력을 가진다. ② 이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서 등은 계약문 서로서의 효력을 가진다. ③이 계약조건 외에 당사자 일방에게 현저하게 불공정한 경우로서 다음 각 호 의 어느 하나에 해당하는 특약은 그 부분에 한하여 무효로 한다. 1. 계약체결 이후 설계변경, 경제상황의 변동에 따라 발생하는 계약금액의 변경 을 상당한 이유 없이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특 약 2. 계약체결 이후 공사내용의 변경에 따른 계약기간의 변경을 상당한 이유 없 이 인정하지 아니하거나 그 부담을 상대방에게 전가하는 특약 3. 본 계약의 형태와 공사내용 등 제반사정에 비추어 계약체결 당시 예상하기 어려운 내용에 대하여 상대방에게 책임을 전가하는 특약 4. 계약내용에 대하여 구체적인 정함이 없거나 당사자 간 이견이 있을 경우 그 처리방법 등을 일방의 의사에 따르도록 함으로써 상대방의 정당한 이익을 침해 하는 특약 5. 계약불이행에 따른 당사자의 손해배상책임을 과도하게 경감하거나 가중하여 정함으로써 상대방의 정당한 이익을 침해하는 특약 6. 「민법」 등 관계 법령에서 인정하고 있는 상대방의 권리를 상당한 이유 없 이 배제하거나 제한하는 특약 ④ 계약문서 작성에 따른 인지세는 각 50%씩 수급인과 도급인이 부담한다. 다 만, 도급인과 공동수급체가 체결하는 공동계약의 경우는 공동 수급체의 구성원 간의 계약액의 지분율에 따라 부담한다."}, {"uid": "a4", "label": "제4조", "title": "계약보증금 등", "text": "① \"수급인\"은 계약상의 의무이행을 보증하기 위해 계약서 에서 정한 계약보증금을 계약체결전까지 \"도급인\"에게 현금 등으로 납부하여야 한다. 다만, \"도급인\"과 \"수급인\"이 합의에 의하여 계약보증금을 납부하지 아니 하기로 약정한 경우에는 그러하지 아니하다. ② 제1항의 계약보증금은 다음 각 호의 기관이 발행한 보증서로 납부할 수 있다. 1. 건설산업기본법 제54조 제1항의 규정에 의한 각 공제조합 발행 보증서 2. 보증보험회사, 신용보증기금 등 이와 동등한 기관이 발행하는 보증서 3. 금융기관의 지급보증서 또는 예금증서 4. 국채 또는 지방채 ③ \"수급인\"은 제21조부터 제23조의 규정에 의하여 계약금액이 증액된 경우에 는 이에 상응하는 금액의 보증금을 제1항 및 제2항의 규정에 따라 추가 납부하 여야 하며, 계약금액이 감액된 경우에는 \"도급인\"은 이에 상응하는 금액의 계약 보증금을 \"수급인\"에게 반환하여야 한다. ④ 제1항 또는 제3항에 따라 \"수급인\"이 계약의 이행을 보증하는 때에는 \"도급 인\"도 수급인에게 공사대금 지급의 보증 또는 담보를 제공하여야 한다. 다만, \" 도급인\"이 공사대금 지급보증 또는 담보 제공을 하기 곤란한 경우에는 \"수급인\" 이 그에 상응하는 보험 또는 공제에 가입할 수 있도록 계약의 이행 보증을 받 은 날부터 30일 이내에 보험료 또는 공제료(이하 \"보험료등\"이라 한다)를 지급 하여야 한다. ⑤ \"도급인\"이 제4항에 따른 공사대금의 지급보증, 담보의 제공 또는 보험료등 의 지급을 하지 아니한 때에는 \"수급인\"은 15일 이내 \"도급인\"에게 그 이행을 최고하고 공사의 시공을 중지할 수 있다."}, {"uid": "a5", "label": "제5조", "title": "계약보증금의 처리", "text": "① 제34조제1항 각 호의 사유로 계약이 해제 또는 해 지된 경우 제4조의 규정에 의하여 납부된 계약보증금은 \"도급인\"에게 귀속한다. 이 경우 계약의 해제 또는 해지에 따른 손해배상액이 계약보증금을 초과한 경 우에는 그 초과분에 대한 손해배상을 청구할 수 있다. ② \"도급인\"은 제35조제1항 각 호의 사유로 계약이 해제 또는 해지되거나 계약 의 이행이 완료된 때에는 제4조의 규정에 의하여 납부된 계약보증금을 지체없 이 \"수급인\"에게 반환하여야 한다."}, {"uid": "a6", "label": "제6조", "title": "공사감독원", "text": "① \"도급인\"은 계약의 적정한 이행을 확보하기 위하여 스스로 이를 감독하거나 자신을 대리하여 다음 각 호의 사항을 행하는 자(이하 ‘공사 감독원’이라 한다)를 선임할 수 있다. 1. 시공일반에 대하여 감독하고 입회하는 일 2. 계약이행에 있어서 \"수급인\"에 대한 지시ㆍ승낙 또는 협의하는 일 3. 공사의 재료와 시공에 대한 검사 또는 시험에 입회하는 일 4. 공사의 기성부분 검사, 준공검사 또는 공사목적물의 인도에 입회하는 일 5. 기타 공사감독에 관하여 \"도급인\"이 위임하는 일 ② \"도급인\"은 제1항의 규정에 의하여 공사감독원을 선임한 때에는 그 사실을 즉시 \"수급인\"에게 통지하여야 한다. ③ \"수급인\"은 공사감독원의 감독 또는 지시사항이 공사수행에 현저히 부당하 다고 인정할 때에는 \"도급인\"에게 그 사유를 명시하여 필요한 조치를 요구할 수 있다."}, {"uid": "a7", "label": "제7조", "title": "현장대리인의 배치", "text": "① \"수급인\"은 착공전에 건설산업기본법령에서 정한 바에 따라 당해공사의 주된 공종에 상응하는 건설기술자를 현장에 배치하고, 그중 1인을 현장대리인으로 선임한 후 \"도급인\"에게 통지하여야 한다. ② 제1항의 현장대리인은 법령의 규정 또는 \"도급인\"이 동의한 경우를 제외하고 는 현장에 상주하여 시공에 관한 일체의 사항에 대하여 \"수급인\"을 대리하며, 도급받은 공사의 시공관리 기타 기술상의 관리를 담당한다."}, {"uid": "a8", "label": "제8조", "title": "공사현장 근로자", "text": "① \"수급인\"은 해당 공사의 시공 또는 관리에 필요한 기 술과 인력을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 사용자로 서의 모든 책임을 진다. ② \"수급인\"이 채용한 근로자에 대하여 \"도급인\"이 해당 계약의 시공 또는 관리 상 현저히 부적당하다고 인정하여 교체를 요구한 때에는 정당한 사유가 없는 한 즉시 교체하여야 한다. ③ \"수급인\"은 제2항에 의하여 교체된 근로자를 \"도급인\"의 동의 없이 해당 공 사를 위해 다시 채용할 수 없다."}, {"uid": "a9", "label": "제9조", "title": "착공신고 및 공정보고", "text": "① \"수급인\"은 계약서에서 정한 바에 따라 착공하 여야 하며, 착공 시에는 다음 각 호의 서류가 포함된 착공신고서를 \"도급인\"에 게 제출하여야 한다. 1. 건설산업기본법령에 의하여 배치하는 건설기술자 지정서 2. 공사예정공정표 3. 공사비 산출내역서 (단, 계약체결시 산출내역서를 제출하고 계약금액을 정 한 경우를 제외한다) 4. 공정별 인력 및 장비 투입 계획서 5. 기타 \"도급인\"이 지정한 사항 ② \"수급인\"은 계약의 이행중에 제1항의 규정에 의하여 제출한 서류의 변경이 필요한 때에는 관련서류를 변경하여 제출하여야 한다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 제출된 서류의 내용을 조정할 필요가 있다고 인정하는 때에는 \"수급인\"에게 이의 조정을 요구할 수 있다. ④ \"도급인\"은 \"수급인\"이 월별로 수행한 공사에 대하여 다음 각 호의 사항을 명백히 하여 익월 14일까지 제출하도록 요청할 수 있으며, \"수급인\"은 이에 응 하여야 한다. 1. 월별 공정률 및 수행공사금액 2. 인력ㆍ장비 및 자재현황 3. 계약사항의 변경 및 계약금액의 조정내용"}, {"uid": "a10", "label": "제10조", "title": "공사기간", "text": "① 공사착공일과 준공일은 계약서에 명시된 일자로 한다. ② \"수급인\"의 귀책사유 없이 공사착공일에 착공할 수 없는 경우에는 \"수급인\" 의 현장인수일자를 착공일로 하며, 이 경우 \"수급인\"은 공사기간의 연장을 요구 할 수 있다. ③ 준공일은 \"수급인\"이 건설공사를 완성하고 \"도급인\"에게 서면으로 준공검사 를 요청한 날을 말한다. 다만, 제27조의 규정에 의하여 준공검사에 합격한 경우 에 한 한다."}, {"uid": "n_price", "label": "제10조의2", "title": "물가변동 특례", "text": "① \"도급인\"과 \"수급인\"은 착공 이후 발생하는 물가변동에 대하여는 계약금액을 조정하지 아니함을 원칙으로 한다. ② 제1항에도 불구하고 한국건설기술연구원이 공표하는 건설공사비지수의 누적변동률이 계약체결일 대비 100분의 15를 초과하는 경우에는 그 초과분에 한하여 조정할 수 있다."}, {"uid": "a11", "label": "제11조", "title": "선금", "text": "① \"도급인\"은 계약서에서 정한 바에 따라 \"수급인\"에게 선금을 지 급하여야 하며, \"도급인\"이 선금 지급시 보증서 제출을 요구하는 경우 \"수급인\" 은 제4조 제2항 각 호의 보증기관이 발행한 보증서를 제출하여야 한다. ② 제1항에 의한 선금지급은 \"수급인\"의 청구를 받은 날부터 14일이내에 지급 하여야 한다. 다만, 자금사정등 불가피한 사유로 인하여 지급이 불가능한 경우 그 사유 및 지급시기를 \"수급인\"에게 서면으로 통지한 때에는 그러하지 아니하 다. ③ \"수급인\"은 선금을 계약목적달성을 위한 용도이외의 타 목적에 사용할 수 없으며, 노임지급 및 자재확보에 우선 사용하여야 한다. ④ 선금은 기성부분에 대한 대가를 지급할 때마다 다음 방식에 의하여 산출한 금액을 정산한다. 기성부분의 대가 선금정산액＝선금액×  계약금액 ⑤ \"도급인\"은 선금을 지급한 경우 다음 각 호의 1에 해당하는 경우에는 당해 선금잔액에 대하여 반환을 청구할 수 있다. 1. 계약을 해제 또는 해지하는 경우 2. 선금지급조건을 위반한 경우 ⑥ \"도급인\"은 제5항의 규정에 의한 반환청구시 기성부분에 대한 미지급금액이 있는 경우에는 선금잔액을 그 미지급금액에 우선적으로 충당하여야 한다."}, {"uid": "a12", "label": "제12조", "title": "자재의 검사 등", "text": "① 공사에 사용할 재료는 신품이어야 하며, 품질ㆍ품명 등은 설계도서와 일치하여야 한다. 다만, 설계도서에 품질ㆍ품명 등이 명확히 규정되지 아니한 것은 표준품 또는 표준품에 상당하는 재료로서 계약의 목적을 달성하는데 가장 적합한 것이어야 한다. ② 공사에 사용할 자재중에서 \"도급인\"이 품목을 지정하여 검사를 요구하는 경 우에는 \"수급인\"은 사용전에 \"도급인\"의 검사를 받아야 하며, 설계도서와 상이 하거나 품질이 현저히 저하되어 불합격된 자재는 즉시 대체하여 다시 검사를 받아야 한다. ③ 제2항의 검사에 이의가 있을 경우 \"수급인\"은 \"도급인\"에게 재검사를 요구할 수 있으며, 재검사가 필요하다고 인정되는 경우 \"도급인\"은 지체없이 재검사하 도록 조치하여야 한다. ④ \"수급인\"은 자재의 검사에 소요되는 비용을 부담하여야 하며, 검사 또는 재 검사 등을 이유로 계약기간의 연장을 요구할 수 없다. 다만, 제3항의 규정에 의 하여 재검사 결과 적합한 자재인 것으로 판명될 경우에는 재검사에 소요된 기 간에 대하여는 계약기간을 연장할 수 있다. ⑤ 공사에 사용하는 자재중 조립 또는 시험을 요하는 것은 \"도급인\"의 입회하 에 그 조립 또는 시험을 하여야 한다. ⑥ 수중 또는 지하에서 행하여지는 공사나 준공후 외부에서 확인할 수 없는 공 사는 \"도급인\"의 참여없이 시행할 수 없다. 다만, 사전에 \"도급인\"의 서면승인을 받고 사진, 비디오 등으로 시공방법을 확인할 수 있는 경우에는 시행할 수 있 다. ⑦ \"수급인\"은 공사수행과 관련하여 필요한 경우 \"도급인\"에게 입회를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다."}, {"uid": "a13", "label": "제13조", "title": "지급자재와 대여품", "text": "① 계약에 의하여 \"도급인\"이 지급하는 자재와 대여 품은 공사예정공정표에 의한 공사일정에 지장이 없도록 적기에 인도되어야 하 며, 그 인도장소는 시방서 등에 따로 정한 바가 없으면 공사현장으로 한다. ② 제1항의 규정에 의하여 지급된 자재의 소유권은 \"도급인\"에게 있으며, \"수급 인\"은 \"도급인\"의 서면승낙없이 현장 외부로 반출하여서는 아니된다. ③ 제1항의 규정에 의하여 인도된 지급자재와 대여품에 대한 관리상의 책임은 \"수급인\"에게 있으며, \"수급인\"이 이를 멸실 또는 훼손하였을 경우에는 \"도급인\" 에게 변상하여야 한다. ④ \"수급인\"은 지급자재 및 대여품의 품질 또는 규격이 시공에 적당하지 아니 하다고 인정할 때에는 즉시 \"도급인\"에게 이를 통지하고 그 대체를 요구할 수 있다. ⑤ 자재 등의 지급지연으로 공사가 지연될 우려가 있을 때에는 \"수급인\"은 \"도 급인\"의 서면승낙을 얻어 자기가 보유한 자재를 대체 사용할 수 있다. 이 경 우 \"도급인\"은 대체 사용한 자재 등을 \"수급인\"과 합의된 일시 및 장소에서 현 품으로 반환하거나 대체사용당시의 가격을 지체없이 \"수급인\"에게 지급하여야 한다. ⑥ \"수급인\"은 \"도급인\"이 지급한 자재와 기계ㆍ기구 등 대여품을 선량한 관리 자의 주의로 관리하여야 하며, 계약의 목적을 수행하는 데에만 사용하여야 한 다. ⑦ \"수급인\"은 공사내용의 변경으로 인하여 필요없게 된 지급자재 또는 사용완 료된 대여품을 지체없이 \"도급인\"에게 반환하여야 한다."}, {"uid": "a14", "label": "제14조", "title": "안전관리 및 재해보상", "text": "① \"수급인\"은 산업재해를 예방하기 위하여 안전 시설의 설치 및 보험의 가입 등 적정한 조치를 하여야 하며, 이를 위해 \"도급 인\"은 계약금액에 「건설기술진흥법」에 따른 안전관리비와 「산업안전보건 법」에 따른 산업안전보건관리비 및 산업재해보상 보험료 등 관계 법령에서 규 정하는 법정경비의 상당액을 계상하여야 한다. ② 공사현장에서 발생한 산업재해에 대한 책임은 \"수급인\"에게 있다. 다만, 설 계상의 하자 또는 \"도급인\"의 요구에 의한 작업으로 재해가 발생한 경우에는 \" 도급인\"에 대하여 구상권을 행사할 수 있다."}, {"uid": "a15", "label": "제15조", "title": "건설근로자의 보호", "text": "① \"수급인\"은 도급받은 공사가 건설산업기본법, 임 금채권보장법, 고용보험법, 국민연금법, 국민건강보험법 및 노인장기요양보험법 에 의하여 의무가입대상인 경우에는 퇴직공제, 임금채권보장제도, 고용보험, 국 민연금, 건강보험 및 노인장기요양보험에 가입하여야 한다. 다만, \"수급인\"이 도 급받은 공사를 하도급한 경우로서 하수급인이 고용한 근로자에 대하여 고용보 험, 국민연금, 건강보험 및 노인장기요양보험에 가입한 경우에는 그러하지 아니 하다. ② \"도급인\"은 제1항의 건설근로자퇴직공제부금, 임금채권보장제도에 따른 사업 주부담금, 고용보험료, 국민연금보험료, 국민건강보험료 및 노인장기요양보험료 를 계약금액에 계상하여야 한다."}, {"uid": "a16", "label": "제16조", "title": "응급조치", "text": "① \"수급인\"은 재해방지를 위하여 특히 필요하다고 인정될 때 에는 미리 긴급조치를 취하고 즉시 이를 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 재해방지 기타 공사의 시공상 부득이하다고 인정할 때에는 \"수 급인\"에게 긴급조치를 요구할 수 있다. 이 경우 \"수급인\"은 즉시 이에 응하여야 하며, \"수급인\"이 \"도급인\"의 요구에 응하지 않는 경우 \"도급인\"은 제3자로 하여 금 필요한 조치를 하게 할 수 있다. ③ 제1항 및 제2항의 응급조치에 소요된 경비는 실비를 기준으로 \"도급인\"과 \" 수급인\"이 협의하여 부담한다."}, {"uid": "a17", "label": "제17조", "title": "공사기간의 연장", "text": "① \"수급인\" 은 다음 각 호의 사유로 인해 계약이행이 현저히 어려운 경우 등 \"수급인\" 의 책임이 아닌 사유로 공사수행이 지연되는 경우 서면으로 공사기간의 연장을 \"도급인\" 에게 요구할 수 있다. 1. \"도급인\" 의 책임있는 사유 2. 태풍ㆍ홍수ㆍ폭염ㆍ한파ㆍ악천후ㆍ미세먼지 발현ㆍ전쟁ㆍ사변ㆍ지진ㆍ전염병 ㆍ폭동 등 불가항력의 사태(이하 \"불가항력\"이라고 한다.) 3. 원자재 수급불균형 4. 근로시간단축 등 법령의 제ㆍ개정 ② \"도급인\"은 제1항의 규정에 의한 계약기간 연장의 요구가 있는 경우 즉시 그 사실을 조사ㆍ확인하고 공사가 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다. ③ 제1항의 규정에 의거 공사기간이 연장되는 경우 이에 따르는 현장관리비 등 추가경비는 제23조의 규정을 적용하여 조정한다. ④ \"도급인\"은 제1항의 계약기간의 연장을 승인하였을 경우 동 연장기간에 대 하여는 지체상금을 부과하여서는 아니된다."}, {"uid": "a18", "label": "제18조", "title": "부적합한 공사 등", "text": "① \"도급인\"은 \"수급인\"이 시공한 공사중 설계서에 적합 하지 아니한 부분이 있을 때에는 이의 시정을 요구할 수 있으며, \"수급인\"은 지 체없이 이에 응하여야 한다. 이 경우 \"수급인\"은 계약금액의 증액 또는 공기의 연장을 요청할 수 없다. ② 제1항의 경우 설계서에 적합하지 아니한 공사가 \"도급인\"의 요구 또는 지시 에 의하거나 기타 \"수급인\"의 책임으로 돌릴 수 없는 사유로 인한 때에는 \"수 급인\"은 그 책임을 지지 아니한다."}, {"uid": "a19", "label": "제19조", "title": "불가항력에 의한 손해", "text": "① \"수급인\"은 검사를 마친 기성부분 또는 지급자 재와 대여품에 대하여 불가항력에 의한 손해가 발생한 때에는 즉시 그 사실을 \"도급인\"에게 통지하여야 한다. ② \"도급인\"은 제1항의 통지를 받은 경우 즉시 그 사실을 조사ㆍ확인하고 그 손해의 부담에 있어서 기성검사를 필한 부분 및 검사를 필하지 아니한 부분 중 객관적인 자료(감독일지, 사진 또는 비디오테잎 등)에 의하여 이미 수행되었음 이 판명된 부분은 \"도급인\"이 부담하고, 기타 부분은 \"도급인\"과 \"수급인\"이 협 의하여 결정한다. ③ 제2항의 협의가 성립되지 않은 때에는 제41조의 규정에 의한다."}, {"uid": "a20", "label": "제20조", "title": "공사의 변경ㆍ중지", "text": "① \"도급인\"이 설계변경 등에 의하여 공사내용을 변 경ㆍ추가하거나 공사의 전부 또는 일부에 대한 시공을 일시 중지할 경우에는 변경계약서 등을 사전에 \"수급인\"에게 교부하여야 한다. ② \"도급인\"이 제1항에 따른 공사내용의 변경ㆍ추가 관련 서류를 교부하지 아 니한 때에는 \"수급인\"은 \"도급인\"에게 도급받은 공사 내용의 변경ㆍ추가에 관한 사항을 서면으로 통지하여 확인을 요청할 수 있다. 이 경우 \"수급인\"의 요청에 대하여 \"도급인\"은 15일 이내에 그 내용에 대한 인정 또는 부인의 의사를 서면 으로 회신하여야 하며, 이 기간내에 회신하지 아니한 경우에는 원래 \"수급인\"이 통지한 내용대로 공사내용의 변경ㆍ추가된 것으로 본다. 다만, 불가항력으로 인 하여 회신이 불가능한 경우에는 제외한다. ③ \"도급인\"의 지시에 의하여 \"수급인\"이 추가로 시공한 공사물량에 대하여서는 공사비를 증액하여 지급하여야 한다. ④ \"수급인\"은 동 계약서에 규정된 계약금액의 조정사유 이외의 계약체결 후 계약조건의 미숙지, 덤핑수주 등을 이유로 계약금액의 변경을 요구하거나 시공 을 거부할 수 없다."}, {"uid": "a21", "label": "제21조", "title": "설계변경으로 인한 계약금액의 조정", "text": "① 설계서의 내용이 공사현장의 상 태와 일치하지 않거나 불분명, 누락, 오류가 있을 때 또는 시공에 관하여 예기 하지 못한 상태가 발생되거나 안전사고의 우려, 사업계획의 변경 등으로 인하 여 추가 시설물(가설구조물을 포함)의 설치가 필요한 때에는 \"도급인\"은 설계를 변경하여야 한다. ② 제1항의 설계변경으로 인하여 공사량의 증감이 발생한 때에는 다음 각 호의 기준에 의하여 계약금액을 조정하며, 필요한 경우 공사기간을 연장하거나 단축 한다. 1. 증감된 공사의 단가는 제9조의 규정에 의한 산출내역서상의 단가를 기준으 로 상호 협의하여 결정한다. 2. 산출내역서에 포함되어 있지 아니한 신규비목의 단가는 설계변경 당시를 기준으로 산정한 단가로 한다. 3. 증감된 공사에 대한 일반관리비 및 이윤 등은 산출내역서상의 율을 적용한다."}, {"uid": "a22", "label": "제22조", "title": "물가변동으로 인한 계약금액의 조정", "text": "① 계약체결 후 90일 이상 경과한 경우에 잔여공사에 대하여 산출내역서에 포함되어 있는 품목 또는 비목, 비목 군 및 지수 등의 변동으로 인한 등락액이 잔여공사에 해당하는 계약금액의 100 분의3 이상인 때에는 계약금액을 조정한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 곤란하다고 인정되는 경우에는 계약체결일(계약체결 후 계 약금액을 조정한 경우 그 조정사유가 발생한 날(이하 \"조정기준일\"이라 한다)을 말하며, 이하 같다)로부터 90일이내에도 계약금액을 조정할 수 있다. ② 제1항의 규정에 의하여 계약금액을 조정할 때에는 국가를 당사자로 하는 계 약에 관한 법률 시행규칙 제74조에 따라 산출된 품목조정률 또는 지수조정률을 활용한다. ③ 제1항의 규정에도 불구하고 해당공사비를 구성하는 재료비, 노무비, 경비 합 계액의 100분의 1을 초과하는 자재의 가격이 계약체결일로부터 100분의 15 이 상 증감된 경우에는 \"도급인\"과 \"수급인\"이 합의하여 계약금액을 조정할 수 있 다. ④ 제1항 및 제3항의 규정에 의한 계약금액의 조정에 있어서 그 조정금액은 계 약금액 중 조정기준일 이후에 이행되는 부분의 대가(이하 \"물가변동적용대가\" 라 한다)에 품목조정률 또는 지수조정률을 곱하여 산출하되, 조정기준일 이전 에 이미 계약이행이 완료되어야 할 부분에 대하여는 적용하지 아니한다. 다만, 제17조제1항의 규정에 의한 사유로 계약이행이 지연된 경우에는 그러하지 아니 하다. ⑤ 선금을 지급한 것이 있는 때에는 제1항, 제3항, 제4항의 규정에 의하여 산출 된 증가액에서 다음 산식으로 산출한 금액을 공제한다. 공제금액=물가변동적용대가×(품목조정률 또는 지수조정률)×선금급률 ⑥ 제1항의 규정에 의하여 조정된 계약금액은 직전의 물가변동으로 인하여 계 약금액 조정기준일부터 60일 이내에는 이를 다시 조정할 수 없다. ⑦ 수급인은 제1항 및 제3항의 규정에 의하여 계약금액 조정을 청구하는 경우 에는 계약금액조정내역서를 첨부하여야 하며, 도급인은 청구를 받은 날부터 30 일 이내에 계약금액을 조정하여야 한다. 다만, 도급인이 자금사정 등 불가피한 경우에는 수급인과 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 증 액할 수 있는 자금이 없는 때에"}, {"uid": "a23", "label": "제23조", "title": "주요 원자재 가격변동에 따른 계약금액의 연동", "text": "도급인과 수급인은 「대ㆍ중소기업 상생협력 촉진에 관한 법률」제21조에 따라 주요 원재료의 가격변동에 따른 계약금액 연동과 관련하여 중소벤처기업부에서 권장하는 표준약정서를 작성하여 첨부하여야 한다. 다만, 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니할 수 있다. 1. 도급인이 「중소기업기본법」제2조 제2항에 따른 소기업에 해당하는 경우 2. 계약기간이 90일 이내의 범위에서 관계 법령으로 정하는 기간 이내인 경우 3. 계약금액이 1억원 이하의 범위에서 관계 법령으로 정하는 금액 이하인 경우 4. 도급인과 수급인이 계약금액 연동을 하지 아니하기로 합의한 경우. 이 경우 도급인과 수급인은 그 취지와 사유를 도급계약서에 기재하여야 한다."}, {"uid": "a24", "label": "제24조", "title": "기타 계약내용의 변동으로 인한 계약금액의 조정", "text": "① 제21조부터 제22조 의2에 의한 경우 이외에 다음 각 호에 의해 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 계약금액을 조정하며, 이 경우 증감된 공사에 대한 일반관리비 및 이율 등은 산출내역서상의 율을 적용한다. 1. 계약내용의 변경 2. 불가항력에 따른 공사기간의 연장 3. 근로시간 단축, 근로자 사회보험료 적용범위 확대 등 공사비, 공사기간에 영향을 미치는 법령의 제ㆍ개정 ② 제1항과 관련하여 \"수급인\"은 제21조부터 제22조2에 규정된 계약금액 조정 사유 이외에 계약체결후 계약조건의 미숙지 등을 이유로 계약금액의 변경을 요 구하거나 시공을 거부할 수 없다."}, {"uid": "a25", "label": "제25조", "title": "기성부분금", "text": "① 계약서에 기성부분금에 관하여 명시한 때에는 \"수급인\"은 이에 따라 기성부분에 대한 검사를 요청할 수 있으며, 이때 \"도급인\"은 지체없 이 검사를 하고 그 결과를 \"수급인\"에게 통지하여야 하며, 14일이내에 통지가 없는 경우에는 검사에 합격한 것으로 본다. ② 기성부분은 제2조 제8호의 산출내역서의 단가에 의하여 산정한다. 다만, 산 출내역서가 없는 경우에는 공사진척율에 따라 \"도급인\"과 \"수급인\"이 합의하여 산정한다. ③ \"도급인\"은 검사완료일로부터 14일이내에 검사된 내용에 따라 기성부분금을 \"수급인\"에게 지급하여야 한다. ④ \"도급인\"이 제3항의 규정에 의한 기성부분금의 지급을 지연하는 경우에는 제28조제3항의 규정을 준용한다."}, {"uid": "a26", "label": "제26조", "title": "손해의 부담", "text": "\"도급인\"ㆍ\"수급인\" 쌍방의 책임 없는 사유로 공사의 목적 물이나 제3자에게 손해가 생긴 경우 다음 각 호의 자가 손해를 부담한다. 1. 목적물이 \"도급인\"에게 인도되기 전에 발생된 손해: \"수급인\" 2. 목적물이 \"도급인\"에게 인도된 후에 발생된 손해: \"도급인\" 3. 목적물에 대한 \"도급인\"의 인수지연 중 발생된 손해: \"도급인\" 4. 목적물 검사기간 중 발생된 손해: \"도급인\"ㆍ\"수급인\"이 협의하여 결정"}, {"uid": "a27", "label": "제27조", "title": "부분사용", "text": "① \"도급인\"은 공사목적물의 인도전이라 하더라도 \"수급인\"의 동의를 얻어 공사목적물의 전부 또는 일부를 사용할 수 있다. ② 제1항의 경우 \"도급인\"은 그 사용부분에 대하여 선량한 관리자의 주의 의무 를 다하여야 한다. ③ \"도급인\"은 제1항에 의한 사용으로 \"수급인\"에게 손해를 끼치거나 \"수급인\" 의 비용을 증가하게 한 때는 그 손해를 배상하거나 증가된 비용을 부담한다."}, {"uid": "a28", "label": "제28조", "title": "준공검사", "text": "① \"수급인\"은 공사를 완성한 때에는 \"도급인\"에게 통지하여야 하며 \"도급인\"은 통지를 받은 후 지체없이 \"수급인\"의 입회하에 검사를 하여야 하며, \"도급인\"이 \"수급인\"의 통지를 받은 후 10일 이내에 검사결과를 통지하지 아니한 경우에는 10일이 경과한 날에 검사에 합격한 것으로 본다. 다만, 불가항 력으로 인하여 검사를 완료하지 못한 경우에는 당해 사유가 존속되는 기간과 당해 사유가 소멸된 날로부터 3일까지는 이를 연장할 수 있다. ② \"수급인\"은 제1항의 검사에 합격하지 못한 때에는 지체없이 이를 보수 또는 개조하여 다시 준공검사를 받아야 한다. ③ \"수급인\"은 검사의 결과에 이의가 있을 때에는 재검사를 요구할 수 있으며, \"도급인\"은 이에 응하여야 한다. ④ \"도급인\"은 제1항의 규정에 의한 검사에 합격한 후 \"수급인\"이 공사목적물의 인수를 요청하면 인수증명서를 발급하고 공사목적물을 인수하여야 한다."}, {"uid": "a29", "label": "제29조", "title": "대금지급", "text": "① \"수급인\"은 \"도급인\"의 준공검사에 합격한 후 즉시 잉여자 재, 폐기물, 가설물 등을 철거, 반출하는 등 공사현장을 정리하고 공사대금의 지급을 \"도급인\"에게 청구할 수 있다. ② \"도급인\"은 특약이 없는 한 계약의 목적물을 인도 받음과 동시에 \"수급인\"에 게 공사 대금을 지급하여야 한다. ③ \"도급인\"이 공사대금을 지급기한내에 지급하지 못하는 경우에는 그 미지급 금액에 대하여 지급기한의 다음날부터 지급하는 날까지의 일수에 계약서 상에 서 정한 대가지급 지연이자율(시중은행의 일반대출시 적용되는 연체이자율 수 준을 감안 하여 상향 적용할 수 있다)을 적용하여 산출한 이자를 가산하여 지 급하여야 한다."}, {"uid": "a30", "label": "제30조", "title": "폐기물의 처리 등", "text": "\"수급인\"은 공사현장에서 발생한 폐기물을 관계법령에 의거 처리하여야 하며, \"도급인\"은 폐기물처리에 소요되는 비용을 계약금액에 반영하여야 한다."}, {"uid": "a31", "label": "제31조", "title": "지체상금", "text": "① \"수급인\"은 준공기한내에 공사를 완성하지 아니한 때에는 매 지체일수마다 계약서상의 지체상금율을 계약금액에 곱하여 산출한 금액(이 하 ‘지체상금’이라 한다)을 \"도급인\"에게 납부하여야 한다. 다만, \"도급인\"의 귀 책사유로 준공검사가 지체된 경우와 다음 각 호의 1에 해당하는 사유로 공사가 지체된 경우에는 그 해당일수에 상당하는 지체상금을 지급하지 아니하여도 된 다. 1. 불가항력의 사유에 의한 경우 2. \"수급인\"이 대체하여 사용할 수 없는 중요한 자재의 공급이 \"도급인\"의 책 임있는 사유로 인해 지연되어 공사진행이 불가능하게 된 경우 3. \"도급인\"의 귀책사유로 착공이 지연되거나 시공이 중단된 경우 4. 기타 \"수급인\"의 책임에 속하지 아니하는 사유로 공사가 지체된 경우 ② 제1항을 적용함에 있어 제26조의 규정에 의하여 \"도급인\"이 공사목적물의 전부 또는 일부를 사용한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우 \"도급인\"이 인허가기관으로부터 공사목적물의 전부 또는 일 부에 대하여 사용승인을 받은 경우에는 사용승인을 받은 공사목적물의 해당부 분은 사용한 것으로 본다. ③ \"도급인\"은 제1항 및 제2항의 규정에 의하여 산출된 지체상금은 제28조의 규정에 의하여 \"수급인\"에게 지급되는 공사대금과 상계할 수 있다. ④제1항의 지체상금율은 계약 당사자간에 별도로 정한 바가 없는 경우에는 국 가를 당사자로 하는 계약에 관한 법령 등에 따라 공공공사 계약체결시 적용되 는 지체상금율을 따른다."}, {"uid": "a32", "label": "제32조", "title": "하자담보", "text": "① \"수급인\"은 공사의 하자보수를 보증하기 위하여 계약서에 정한 하자보수보증금율을 계약금액에 곱하여 산출한 금액(이하 ‘하자보수보증 금’이라 한다)을 준공검사후 그 공사의 대가를 지급할 때까지 현금 또는 제4조 제2항 각 호의 보증기관이 발행한 보증서로서 \"도급인\"에게 납부하여야 한다. ② \"수급인\"은 \"도급인\"이 전체목적물을 인수한 날과 준공검사를 완료한 날 중 에서 먼저 도래한 날부터 계약서에 정한 하자담보 책임기간중 당해공사에 발 생하는 일체의 하자를 보수하여야 한다. 다만, 다음 각 호의 사유로 발생한 하자에 대해서는 그러하지 아니하다. 1. 공사목적물의 인도 후에 천재지변 등 불가항력이 \"수급인\"의 책임이 아닌 사유로 인한 경우 2. \"도급인\"이 제공한 재료의 품질이나 규격 등의 기준미달로 인한 경우 3. \"도급인\"의 지시에 따라 시공한 경우 4. \"도급인\"이 건설공사의 목적물을 관계 법령에 따른 내구연한 또는 설계상의 구조내력을 초과하여 사용한 경우 ③ \"수급인\"이 \"도급인\"으로 부터 제2항의 규정에 의한 하자보수의 요구를 받고 이에 응하지 아니하는 경우 제1항의 규정에 의한 하자보수보증금은 \"도급인\"에 게 귀속한다. ④ \"도급인\"은 하자담보책임기간이 종료한 때에는 제1항의 규정에 의한 하자보 수 보증금을 \"수급인\"의 청구에 의하여 반환하여야 한다. 다만, 하자담보책임기 간이 서로 다른 공종이 복합된 공사에 있어서는 공종별 하자담보 책임기간이 만료된 공종의 하자보수보증금은 \"수급인\"의 청구가 있는 경우 즉시 반환하여 야 한다."}, {"uid": "a33", "label": "제33조", "title": "건설공사의 하도급 등", "text": "①\"수급인\"이 도급받은 공사를 제3자에게 하도급 하고자 하는 경우에는 건설산업기본법 및 하도급거래공정화에관한법률에서 정 한 바에 따라 하도급하여야 하며, 하수급인의 선정, 하도급계약의 체결 및 이 행, 하도급 대가의 지급에 있어 관계 법령의 제규정을 준수하여야 한다. ② \"도급인\"은 건설공사의 시공에 있어 현저히 부적당하다고 인정하는 하수급 인이 있는 경우에는 하도급의 통보를 받은 날 또는 그 사유가 있음을 안 날부 터 30일이내에 서면으로 그 사유를 명시하여 하수급인의 변경 또는 하도급 계 약내용의 변경을 요구할 수 있다. 이 경우 \"수급인\"은 정당한 사유가 없는 한 이에 응하여야 한다. ③ \"도급인\"은 제2항의 규정에 의하여 건설공사의 시공에 있어 현저히 부적당 한 하수급인이 있는지 여부를 판단하기 위하여 하수급인의 시공능력, 하도급 계약 금액의 적정성 등을 심사할 수 있다."}, {"uid": "a34", "label": "제34조", "title": "하도급대금의 직접 지급", "text": "① \"도급인\"은 \"수급인\"이 제32조의 규정에 의 하여 체결한 하도급계약중 하도급거래공정화에 관한법률과 건설산업기본법에서 정한 바에 따라 하도급대금의 직접 지급사유가 발생하는 경우에는 그 법에 따 라 하수급인이 시공한 부분에 해당하는 하도급대금을 하수급인에게 지급한다. ② \"도급인\"이 제1항의 규정에 의하여 하도급대금을 직접 지급한 경우에는 \"도 급인\"의 \"수급인\"에 대한 대금지급채무는 하수급인에게 지급한 한도안에서 소 멸한 것으로 본다."}, {"uid": "a35", "label": "제35조", "title": "\"도급인\"의 계약해제 등", "text": "① \"도급인\"은 다음 각 호의 1에 해당하는 경우 에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. \"수급인\"이 정당한 이유없이 약정한 착공기일을 경과하고도 공사에 착수하 지 아니한 경우 2. \"수급인\"의 책임있는 사유로 인하여 준공기일내에 공사를 완성할 가능성이 없음이 명백한 경우 3. 제30조제1항의 규정에 의한 지체상금이 계약보증금 상당액에 도달한 경우 로서 계약기간을 연장하여도 공사를 완공할 가능성이 없다고 판단되는 경우 4. 기타 \"수급인\"의 계약조건 위반으로 인하여 계약의 목적을 달성할 수 없다 고 인정되는 경우 ② 제1항의 규정에 의한 계약의 해제 또는 해지는 \"도급인\"이 \"수급인\"에게 서 면으로 계약의 이행기한을 정하여 통보한 후 기한내에 이행되지 아니한 때 계 약의 해제 또는 해지를 \"수급인\"에게 통지함으로써 효력이 발생한다. ③ \"수급인\"은 제2항의 규정에 의한 계약의 해제 또는 해지 통지를 받은 때에 는 다음 각 호의 사항을 이행하여야 한다. 1. 당해 공사를 지체없이 중지하고 모든 공사용 시설ㆍ장비 등을 공사현장으 로부터 철거하여야 한다. 2. 제13조의 규정에 의한 지급재료의 잔여분과 대여품은 \"도급인\"에게 반환하 여야 한다."}, {"uid": "a36", "label": "제36조", "title": "\"수급인\"의 계약해제 등", "text": "① \"수급인\"은 다음 각 호의 어느 하나에 해당 하는 경우에는 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 1. 공사내용을 변경함으로써 계약금액이 100분의 40이상 감소된 때 2. \"도급인\"의 책임있는 사유에 의한 공사의 정지기간이 계약서상의 공사기간 의 100분의 50을 초과한 때 3. \"도급인\"이 정당한 이유없이 계약내용을 이행하지 아니함으로써 공사의 적 정이행이 불가능하다고 명백히 인정되는 때 4. 제4조제5항에 따른 기간 내에 공사대금 지급의 보증, 담보의 제공 또는 보 험료 등의 지급을 이행하지 아니한 때 ② 제1항의 규정에 의하여 계약을 해제 또는 해지하는 경우에는 제34조제2항 및 제3항의 규정을 준용한다."}, {"uid": "a37", "label": "제37조", "title": "계약해지시의 처리", "text": "① 제34조 및 제35조의 규정에 의하여 계약이 해지 된 때에는 \"도급인\"과 \"수급인\"은 지체없이 기성부분의 공사금액을 정산하여야 한다. ② 제34조 및 제35조의 규정에 의한 계약의 해제 또는 해지로 인하여 손해가 발생한 때에는 상대방에게 그에 대한 배상을 청구할 수 있다. 다만, 제35조제1 항제4호에 해당하여 해지한 경우에는 해지에 따라 발생한 손해에 대하여 청구 할 수 없다."}, {"uid": "a38", "label": "제38조", "title": "\"수급인\"의 동시이행 항변권", "text": "① \"도급인\"이 계약조건에 의한 선금과 기 성부분금의 지급을 지연할 경우 \"수급인\"이 상당한 기한을 정하여 그 지급을 독촉하였음에도 불구하고 \"도급인\"이 이를 지급치 않을 때에는 \"수급인\"은 공사 중지기간을 정하여 \"도급인\"에게 통보하고 공사의 일부 또는 전부를 일시 중지 할 수 있다. ② 제1항의 공사중지에 따른 기간은 지체상금 산정시 공사기간에서 제외된다. ③ \"도급인\"은 제1항의 공사중지에 따른 비용을 \"수급인\"에게 지급하여야 하며, 공사중지에 따라 발생하는 손해에 대해 \"수급인\"에게 청구하지 못한다."}, {"uid": "a39", "label": "제39조", "title": "채권양도", "text": "① \"수급인\"은 이 공사의 이행을 위한 목적이외에는 이 계약에 의하여 발생한 채권(공사대금 청구권)을 제3자에게 양도하지 못한다. ② \"수급인\"이 채권양도를 하고자 하는 경우에는 미리 보증기관(연대보증인이 있는 경우 연대보증인을 포함한다)의 동의를 얻어 \"도급인\"의 서면승인을 받아 야 한다. ③ \"도급인\"은 제2항의 규정에 의한 \"수급인\"의 채권양도 승인요청에 대하여 승 인 여부를 서면으로 \"수급인\"과 그 채권을 양수하고자 하는 자에게 통지하여야 한다."}, {"uid": "a40", "label": "제40조", "title": "손해배상책임", "text": "① \"수급인\"이 고의 또는 과실로 인하여 도급받은 건설공 사의 시공관리를 조잡하게 하여 타인에게 손해를 가한 때에는 그 손해를 배상 할 책임이 있다. ② \"수급인\"은 제1항의 규정에 의한 손해가 \"도급인\"의 고의 또는 과실에 의하 여 발생한 것인 때에는 \"도급인\"에 대하여 구상권을 행사할 수 있다. ③ \"수급인\"은 하수급인이 고의 또는 과실로 인하여 하도급 받은 공사를 조잡 하게 하여 타인에게 손해를 가한 때는 하수급인과 연대하여 그 손해를 배상할 책임이 있다."}, {"uid": "a41", "label": "제41조", "title": "법령의 준수", "text": "\"도급인\"과 \"수급인\"은 이 공사의 시공 및 계약의 이행에 있어서 건설산업기본법 등 관계법령의 제규정을 준수하여야 한다."}, {"uid": "a42", "label": "제42조", "title": "분쟁의 해결", "text": "① 계약에 별도로 규정된 것을 제외하고는 계약에서 발생 하는 문제에
